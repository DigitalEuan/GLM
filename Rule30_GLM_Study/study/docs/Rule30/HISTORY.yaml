  - heading: "Round 36: the drive wheel"
    anchor: round-36-the-drive-wheel
    body: |
      **Brief.** "Continue — see the To Do items. Many of these experiments seem like parts of a wheel —
      could we have a full wheel of this family of operations and skip much of the slow iterations?"

      **The wheel, proved** (`DriveWheel.lean`, FORMAL, C338–C340). The operations that appeared
      separately in earlier rounds form one wheel: the *turn* (`wheelTurn p k s`, reading the column from
      phase `s`, which is the old drive started `s` steps later; Round 26 used two special cases, Round 34
      the observer's phase), the *inner wheels* (a drive that repeats after `g ∣ p` steps is a word of
      period `g`, and periods combine by `gcd`; Round 34's divisor rule), and their composition (turns
      compose, `p` turns are the identity). Each orbit has one *hub*, its least turn, taken only for
      primitive words (`WheelRep`; the Lyndon words). Every non-white word is a turn of a hub of a divisor
      period (`exists_wheelRep`), so `HalfLineDies p` ⟺ the hubs of the divisors of `p` kill every
      non-empty half-line (`halfLineDies_iff_wheel`), and the single statement `WheelDies` is equivalent
      to `HalfLineDies p` for every `p`, to "every periodic drive with a black cell kills every non-empty
      half-line" (`wheelDies_iff_periodic`), and implies Problem 1 (`problem1_of_wheelDies`). On the
      observer's clock a turn costs at most `2` slack per step, so hub slacks give the per-period law with
      `+ 2(p − 1)` (`testCountLinear_of_wheel`; finite-range form `testSlackUpTo_of_wheel`).

      **The wheel, computed** (`DriveWheelData.lean`, CERT, C341–C342). Hub counts for periods `0 … 12`:
      `0, 1, 1, 2, 3, 6, 9, 18, 30, 56, 99, 186, 335`; up to period 8, 70 hubs against 502 words. One table
      gives a slack for every hub of period `≤ 8` on `d ≤ 24`, checked by one diagonal-search pass (about
      6½ minutes to build); a completeness check confirms it covers every hub. Through the wheel: the
      per-period law for every `1 ≤ p ≤ 8` on `d ≤ 25 − p` (`testCountLinearUpTo_wheel`), and the first run
      bounds in every left-white row for periods 7 and 8 (`7(d + 20)` for `d ≤ 18`, `8(d + 25)` for
      `d ≤ 17`; for periods 5 and 6 this route is weaker than Round 22's bounds). `frontier_round36` collects it.

      **Limits.** Turns are exact for dying but not for slack: the period-4 slack 7 at `d = 30` is attained
      in the phase `0111` (`not_testCountLinear_four_six`) while the hub `1110` stays within 5 on `d ≤ 24`,
      so exact least per-period slacks still need per-phase checks. A finite-range transfer loses `p − 1`
      in the code length. Nothing becomes uniform in `d`; that would need a proof for an infinite family
      of hubs (To Do 39). New To Do 39–41. No prize problem is settled.
