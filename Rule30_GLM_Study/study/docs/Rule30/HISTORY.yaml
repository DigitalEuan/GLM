          - - "`InjectorData.lean`"
            - "*computation*: exact numbers of surviving pairs `3, 3, 5, 3` for `n = 1..4`"
      - header:
          - Analogy
          - What is exactly true here
          - Lean
        rows:
          - - Discrete exterior calculus, `δ² = 0`
            - "The Boolean derivative `Δ_i` satisfies `Δ_iΔ_i = 0`, and derivatives commute. An ANF coefficient is an iterated derivative at the white row: dropping one variable from the monomial is one derivative. \"Interior faces cancel in pairs\" is exactly `x + x = 0` in these sums"
            - "`booleanDerivative_twice`, `booleanDerivative_comm`, `anfCoeff_eq_anfCoeff_derivative`, `mobius_double_sum` (the transform is its own inverse)"
          - - Stabilizer / Clifford propagation
            - "Rule 30 = Rule 150 (`L + C + R`, linear) + `C·R`. Rule 150 is `GF(2)`-linear at every step, so all its coefficients of degree `≥ 2` vanish for ever: fully trackable, as Pauli strings are under Clifford gates. The `C·R` term breaks linearity at step 1 and is the only source of degree growth (`deg = 2n − 1`), the analogue of a non-Clifford resource"
