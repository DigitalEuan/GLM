  - heading: "Round 10: the GLM reads Rule 30 step by step — inducing the wheel, and the observer's frame"
    anchor: round-10-the-glm-reads-rule-30-step-by-step-inducing-the-wheel-and-the-observers-frame
    body: |
      The aim of this round was to let the GLM work through Rule 30 the way it works through an ARC
      task (shown part of the diagram, it must say which rule made it and what comes next, or refuse),
      and to make the user's "perspective / direction of the observer `Y`" precise. Everything below is
      proved in Lean with no `sorry`. All of it uses only the standard axioms (`propext`,
      `Classical.choice`, `Quot.sound`). The finite checks use `decide +kernel` (checked by the kernel,
      no `native_decide`).

      ### A. Inducing a wheel is sound and complete (`WheelInduction.lean`)

      * `rows_agree_iff`: a wheel `s` reproduces rows `0..T` of the run of `r` **iff** `s` agrees with `r`
        on every neighbourhood occurring in rows `0..T-1`. The demonstrations fix the seen part of the
        table, and nothing else.
      * `ecaRule_flip`: flipping bit `k` of a wheel number changes the rule on exactly one neighbourhood.
      * `next_row_determined_iff`: **every wheel that reproduces rows `0..T` predicts the same row `T+1`
        iff every neighbourhood of row `T` already occurred in rows `0..T-1`.** If one did not, flipping
        that single table entry gives a wheel that fits every demonstration and predicts a different row.

      So the GLM's rule "answer only if every surviving hypothesis agrees" is, for wheels, the same as
      "answer only if the query uses no unseen neighbourhood". This holds for every wheel, every
      starting row and every `T`.

      ### B. What the rows and the columns of Rule 30 reveal (`Observer.lean`)

      * `windowStep_iterate_sample`, `ecaEvolve_eq_window`: exact simulation on a finite window. Every
        finite question about the diagram is a list computation.
      * **Rows.** `rows_identify_thirty`: among all 256 wheels, rows `0..4` of the impulse run (read
        inside the light cone) determine wheel 30. `rows_three_do_not_identify`: rows `0..3` do not.
        Wheel 62 has the same rows `0..3` at every cell, because the two differ only on `(1,0,1)`
        (`thirty_sixtyTwo_differ_only_at_101`), and `(1,0,1)` first occurs in row 3. Hence
        `row_four_not_determined`.
      * **The centre column cannot tell left from right.** `centre_column_class`: for `r < 256`, the
        centre column of wheel `r` from the impulse equals Rule 30's centre column **iff `r = 30` or
        `r = 86`** (the mirror image). Seven values already give `{30, 86}` (`centre_prefix_class`), six
        do not (`centre_six_not_enough`), and no number of further values ever separates 30 from 86. So
        nothing computed from the centre column alone can tell which way the run is oriented. That
        includes the frequency, the wobble `D(N)` and every finite-state observer.
      * **One cell off-centre, it can.** `column_one_identifies`: column 1 of the impulse run is produced
        only by wheel 30. Eight values suffice (`column_one_prefix_identifies`); seven do not
        (`column_one_seven_not_enough`). `offCentre_column_identifies`: the same holds at every column
        `1 ≤ |c| ≤ 5`, where thirteen values suffice.
      * **The wobble arrow is a perspective.** `observerArrow_mirror`: reflecting space leaves the arrow
        `−sign D(N)` unchanged, for every wheel, row, column and `N`. `observerArrow_complement`:
        swapping the colours reverses it (`wobble_complement`). For Rule 30's class:
        `observerArrow_eightySix` (equal) and `observerArrow_oneThirtyFive` (negated).

      **Answer to the "perspective" question.** The arrow `−sign D(N)` records the observer's
      **colour frame**: which colour counts as black. It is blind to the **spatial frame**: which way is
      right. The spatial frame cannot be read from the centre column at all (`centre_column_class`), but
      an observer one cell off-centre reads it within eight steps (`column_one_identifies`).
      `wobble_reverse` (Round 2, `Perspective.lean`) gives the third frame, time: read backwards, the
      accumulator after `k` steps is `D(N) − D(N−k)`.

      ### C. The GLM in this round (`rule30_round10/`, outside Lean)

      * The `automata` register gains these carriers:
        * `r30_step_t` (`t < 64`): row `t`, the centre neighbourhood, the GF(2) evaluation, `D(t+1)` and
          the arrow;
        * `r30_induction_rows_T` (`T ≤ 6`);
        * `r30_observer_column_c` (`|c| ≤ 5`, `m3` for `−3`);
        * `r30_arrow_mirror` (+1) and `r30_arrow_colour` (−1).
      * There are four new report subjects: `report wheel steps`, `report wheel induction`,
        `report wheel observer` and `report wheel perspective`.
      * `reasoning/wheel_induction.py` is the radius-1 wheel family for `tool induce`. On every call it
        checks the two refusal criteria of `next_row_determined_iff` against each other.
        `toolbox_wheel_induction.patch` adds it as a fallback, used only when no pipeline-kit family
        fits. The GLM's existing families report `unsolved` on Rule 30 rows (0 of 76 hypotheses fit).
      * `rule30_round10/GLM_AVAILABILITY.md` lists the 22 modules that `glm_repo.zip` lacks. Because of
        them, the connected CLI (`GLM.py --ask`, `GLM.py -q`), `tool induce` and `tool arc` cannot run
        from the archive. The session (`GeometricSession`) runs.

      ### Where the prize problems stand after Round 10

      Unchanged: all three are open. This round adds facts about **which rule produced the data** and
      **how the arrow transforms with the frame**. Neither kind of fact bears on the limit behaviour of
      the centre column. The P1/P2 question is the same for 30 and 86 (`problem1_iff_eightySix`), and
      the centre observer cannot tell these two apart. So a proof of P1 or P2 can only use what the two
      mirror images share.
