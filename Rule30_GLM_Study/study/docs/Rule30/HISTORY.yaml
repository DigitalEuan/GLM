  - heading: "Round 24: alternatives to XOR; Kronecker's converse"
    anchor: round-24-alternatives-to-xor-kroneckers-converse
    body: |
      **Input.** "Try alternatives to XOR where possible as a test to see if any insights come from
      implementation choice, otherwise get some To Do items completed." Rule 30 is
      `new = L xor (C or R)`. "Alternative to XOR" can mean two different things, and both were tested:
      (A) another way of *computing* the same rule, and (B) another *gate* in place of the XOR (or of the
      OR), which gives a different rule. Nothing in this round settles a prize problem.

      ### A. Implementation choice changes nothing (`XorAlternatives.lean`, FORMAL)

      Seven XOR-free formulas compute Rule 30: `L ≠ (C ∨ R)` (`rule30_eq_bne`), a branch on `L`
      (`rule30_eq_ite`), OR/AND/NOT only (`rule30_eq_orAndNot`), `L + C + R + CR mod 2`
      (`rule30_eq_natMod`), `(L − (C ∨ R))²` (`rule30_eq_intSq`), `|L − (C ∨ R)|` (`rule30_eq_intAbs`) and
      `max − min` (`rule30_eq_maxSubMin`). All have wheel number 30 (`tableNum_implementations`), and
      **`implementation_invariance`**: any local rule that agrees with Rule 30 on the eight
      neighbourhoods has the same evolution from every row. So no question about Rule 30 can depend on
      how the XOR is implemented. What every implementation must contain is a non-monotone gate
      (`rule30_not_monotone`).

      ### B1. Replace the XOR: `g(L, C or R)` for all 16 gates `g` (FORMAL)

      **`outer_alternative_periodic`**: for every gate `g ≠ xor`, the centre column from a single black
      cell is eventually periodic. The 15 alternative wheels are 0, 1, 14, 15, 16, 17, 31, 224, 225,
      238, 239, 240, 241, 254, 255 (`outerRule_mem`); each is settled by a closed form of its whole
      space-time diagram (`ecaEvolve_14_seed` etc., checked by `ecaEvolve_eq_closed`), a one-sided
      invariant, or symmetry. So **among the 16 ways to combine `L` with `C or R`, XOR is the only one
      whose Problem 1 is open.**

      The surprise is `xnor` (wheel 225 = the complement of Rule 30): it is left-permutive like Rule 30,
      and its diagram looks irregular (`EMP`), but from time 5 on every cell at or left of the centre is black
      (`ecaEvolve_225_seed`: a black pair `L = C = 1` gives `xnor(1, 1) = 1`, so the black left half can
      never shrink). `outerRule_leftPermutive_iff`: the left-permutive outer alternatives are `xor`,
      `xnor`, `L`, `not L`; `leftPermutive_not_sufficient`: left-permutivity alone does not keep the
      centre column alive. The white (quiescent) background, `g(0, 0) = 0`, matters as much as the XOR.

      ### B2. Replace the OR: `L xor h(C, R)` for all 16 gates `h` (FORMAL + CERT)

      These 16 wheels are **exactly the left-permutive wheels** (`leftPermutive_iff_innerRule`).
      * **`inner_alternative_periodic`**: if `h` is not of *OR type* (OR type: exactly three of the four
        inputs give `true`: `or`, `nand`, `C ∨ ¬R`, `¬C ∨ R`), the centre column is eventually periodic.
        That settles the 8 affine gates (wheels 15, 60, 90, 105, 150, 165, 195, 240) and the 4 AND-type
        gates (120, 180, 210, 225).
      * The 4 OR-type gates give wheels 30, 45, 75, 135 (`innerRule_orType`). For all four,
        **`orType_no_small_period`** (CERT, `XorAlternativesData.lean`): no eventual period `p ≤ 500`
        starting at or before time `500`. The check runs a window simulator proved sound
        (`centreList_spec`).

      ### B3. The counting law belongs to the XOR (`RunCountGeneral.lean`, FORMAL + CERT)

      * **`runCountW_law`**: Round 23's exact counting law holds for **every** left-permutive wheel; so
        (`innerRule_runCount_law`) for every `L xor h(C, R)`, whatever `h`. The OR plays no role in it.
      * **`outer_runCount_law_iff`**: among the 16 wheels `g(L, C or R)`, the period-2 law holds exactly
        for the left-permutive ones; for the other twelve it fails already at `d = 3` or `d = 4`
        (`outer_law_fails`, CERT). E.g. AND gives 21 and OR gives 17 contexts instead of 16.
      * **`runCountW_law_right`**: for a *right*-permutive wheel the law holds for **every** time `T`, with
        no edge, because each test then reads the far-right cell `d + t`, and the right side of a
        left-white row is free for ever. For **Rule 86**, the mirror image of Rule 30 with the same centre
        column, `RunCountW 86 2 d T = 2^(d+1)` for all `T ≥ 1` (`runCountW_eightySix`). For Rule 30 the law
        breaks at the edge: `RunCountW 30 2 3 3 = 20` (`runCountW_thirty_edge`).

      ### The insight (as precise as the proofs allow)

      The two ingredients of Rule 30 do separate jobs, and neither is enough alone:
      * the **XOR** (left-permutivity) makes the observer's periodicity tests exactly fair, and it is the
        *whole* reason for the counting law: any `h` in place of the OR keeps the law, no non-permutive
        gate in place of the XOR keeps it;
      * the **OR type** (a gate with three `true` outputs) is what keeps the centre column from
        collapsing: every other `h` gives an eventually periodic column, and so does every other `g`,
        including `xnor`.

      Problem 1 is open exactly where the two meet: wheels 30, 45, 75, 135.

      **Perspective (the observer `Y`).** Rule 30 and Rule 86 have the same centre column, but in the
      same left-white frame the counting law is exact for ever for 86 and breaks at the edge for 30.
      What decides it is on which side of the column the XOR sits, relative to the side where the row is
      white. If `Y` faces the XOR side and that side is free, its tests stay fair for ever. If the XOR
      side runs into the black edge, the arrow runs out. This makes the Round 21–23 "arrow" reading a
      proved statement about the pair (permutive side, white side). It also makes the open core sharper:
      the post-edge behaviour of Rule 30 (To Do 1, 10, 12) is *exactly* what the mirror rule 86 avoids.

      ### To Do item 11 done: Kronecker's converse (`HankelKronecker.lean`, FORMAL)

      * **`eventuallyPeriodic_of_hankel_det_eventually_zero`**: if `det H_r ≠ 0` over `GF(2)` and every
        larger Hankel determinant vanishes, the sequence obeys a linear recurrence of order `r` for ever,
        hence is eventually periodic. Proof: solve `H_r c = (a(r), …, a(2r−1))`. If the recurrence first
        fails at `s`, multiply `H_{s+1}` by a unitriangular column operation (`recU`, `det_recU`,
        `hankel_mul_recU_apply`). Then the kernel is trivial (`hankel_det_ne_zero_at_first_error`), so
        `det H_{s+1} ≠ 0`, which is a contradiction.
      * **`hankel_infinitely_often_iff`**: a Boolean sequence is not eventually periodic iff infinitely
        many of its Hankel determinants are non-zero.
      * **`problem1IffHankelInfinitelyOften`**: the Round 23 statement `Problem1IffHankelInfinitelyOften` is
        now a theorem. Problem 1 now has at least four proved equivalent forms: unbounded linear complexity,
        complexity `p(n) ≥ n + 1` for every `n`, escape from all finite-state predictors, and infinitely
        many non-singular Hankel matrices.

      `frontier_round24` (`XorAlternativesData.lean`) collects the round.

      ### Where the prize problems stand after Round 24

      All three are still open. Round 24 adds no new sufficient target. It locates the difficulty: among
      the 32 one-gate variants of `L xor (C or R)`, the only ones not settled are the four OR-type
      left-permutive wheels, and the only proved structure (the counting law) comes from the XOR alone.
    subsections:
      - A. Implementation choice changes nothing (`XorAlternatives.lean`, FORMAL)
      - "B1. Replace the XOR: `g(L, C or R)` for all 16 gates `g` (FORMAL)"
      - "B2. Replace the OR: `L xor h(C, R)` for all 16 gates `h` (FORMAL + CERT)"
      - B3. The counting law belongs to the XOR (`RunCountGeneral.lean`, FORMAL + CERT)
      - The insight (as precise as the proofs allow)
      - "To Do item 11 done: Kronecker's converse (`HankelKronecker.lean`, FORMAL)"
      - Where the prize problems stand after Round 24
