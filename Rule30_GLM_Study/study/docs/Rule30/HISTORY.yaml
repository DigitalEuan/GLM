  - heading: "Round 17: spinning the triangle and the pyramid; spin as a multiplication factor"
    anchor: round-17-spinning-the-triangle-and-the-pyramid-spin-as-a-multiplication-factor
    body: |
      New files (all imported by `RequestProject/GLM/Rule30.lean`, no `sorry`, no added axioms):

      | File | Content |
      |---|---|
      | `SpinSweep.lean` | rotation as multiplication by `e^{iθ}`; what the spinning triangle and pyramid sweep; the helical (screw) sweep |
      | `SpinLattice.lean` | lattice points collected; the only lattice-preserving spins; the pyramid's lattice orbit; spinning Rule 30's plane (half turn = Rule 86) |
      | `SpinQuaternion.lean` | one-plane spins only add; 4D double rotations close iff the rate ratio is rational; quaternion rotations (3D has an axis, 4D multiplication has none) |
      | `RunBoundEighteen.lean` | the period-2 run bounds certified for `d = 17, 18` |

      ### A. The spinning triangle and pyramid (`SpinSweep.lean`, exact)

      Space is the complex plane, so a turn by `θ` about the time axis **is** the multiplication
      `z ↦ e^{iθ}·z` (`rot`, `spin`).

      * **`spin_sweep_triangle`**: spinning Rule 30's triangle `|s| ≤ t` about its time axis collects
        exactly the round cone `‖z‖ ≤ t` (apex angle `90°`).
      * **`spin_tri_moments`**: a point `z ≠ 0` inside that cone is collected exactly when
        `θ ∈ arg z + πℤ` — twice per turn, once by each half of the triangle
        (`spin_tri_two_moments`).  At those two moments the plane reads the cells `+‖z‖` and `−‖z‖` of
        the row: the spin folds the line onto itself.
      * **`spin_sweep_pyramid`**: the spinning square pyramid of a 2D rule sweeps the round cone
        `‖z‖ ≤ √2·t`, apex angle `2·arctan √2 ≈ 109.47°` (`cos = −1/3`, `sweep_cone_angles`).
      * **`spin_core_pyramid`**: the points inside the pyramid at **every** moment of the turn form
        exactly the round `90°` cone.  So spinning turns Round 16's range of slice angles `[90°, 109.47°]`
        into two nested round cones; `mem_spin_pyr_iff` says when a point of the shell between them is
        inside.  (Not formalised: a point at radius `ρ·t` with `1 ≤ ρ ≤ √2` is inside for the fraction
        `1 − (4/π)·arccos(1/ρ)` of each turn.)
      * **Helical sweep** (the plane turns by `ω` per time step):
        `helical_planes_distinct` — if `ω/π` is irrational the plane never returns to an earlier
        position; `helical_planes_dense` — its positions are dense among all planes;
        `helical_planes_periodic` — if `ω = π·p/q` it repeats with period `q`.

      ### B. On the lattice (`SpinLattice.lean`, exact)

      * **`lattice_collected_iff`**: the integer point `(t, a, b)` is collected by the spinning triangle
        iff `a² + b² ≤ t²`, by the spinning pyramid iff `a² + b² ≤ 2t²`.  `collected_counts` (`t ≤ 10`):
        `1, 5, 13, 29, 49, 81, 113, 149, 197, 253, 317` and `1, 9, 25, 61, 101, 161, 225, 305, 405, 509,
        633`, against `(2t+1)²` for the pyramid at rest.
      * **`rot_lattice_iff`**: only the four quarter turns map the integer grid to itself.  A spinning
        lattice object has four lattice snapshots per turn.
      * **`pyramid_orbit`**, `pyramid_spin_stabilizer` (any dimension `k`): lattice symmetries carry the
        light-cone pyramid onto each of the `2k` axis pyramids; those fixing its axis leave it in place.
        With `axisCone_fraction` (Round 16): turning the pyramid through its lattice positions collects
        all of space-time, `1/(2k)` per position (`1/6` for 2D rules).
      * **Spinning Rule 30's plane** (`spunDiagram`: the diagram planted in the plane `b = 0` and turned
        by `k` quarter turns):
        * **`spun_half_turn_read`**: after a half turn the reference axis shows **Rule 86**, the mirror
          wheel; `spunDiagram_add_four`: a full turn changes nothing.
        * **`spun_axis_invariant`**: the time axis, i.e. the **centre column**, reads the same at every
          angle.  This is the geometric reason the centre column cannot tell 30 from 86
          (`centre_column_class`, Round 10).
        * **`rule30_spin_readable`**: the turned diagram determines the number of quarter turns mod 4.
          Rule 30's chirality is an absolute compass for the observer's plane.
        * **`rule90_spin_halfturn_invisible`**: for the symmetric Rule 90 a half turn is invisible.
        * **`rule30_row_not_mirror`**: no row from `t = 2` on is mirror-symmetric; the asymmetry is within
          two cells of the edges (cell `t−1` against `1−t` for even `t`, `t−2` against `2−t` for odd
          `t`).  Hence **`spun_half_turn_visible_every_row`**: the half turn shows in every row from
          `t = 2`.  Rows `0`, `1` are symmetric (`rule30_rows_zero_one_mirror`).

      For the GLM: the observer's read angle `Y` is recoverable from Rule 30 — off the axis, in every row
      from `t = 2`, near the edges — but never from the axis (the centre column) itself.

      ### C. Spin as a multiplication factor (`SpinQuaternion.lean`, exact)

      * **`plane_spins_commute`**: spins in one plane multiply as `e^{ia}·e^{ib} = e^{i(a+b)}` — they add
        and commute, so combining spins in a single plane never adds a dimension.
      * **Two planes at once (4D double rotation `doubleRot`)**:
        **`double_rotation_closes_iff`** — the motion ever returns to its start iff the rate ratio
        `α/β` is rational; **`double_rotation_section_dense`** — if `β/α` is irrational, then each time
        the first spin completes a turn, the second angle is somewhere new, and these angles are dense.
      * **Quaternions**: `conj_comp` — 3D rotations `v ↦ q v q⋆` compose by multiplying quaternions;
        **`conj_fixes_axis`** — every one of them fixes an axis (`Im q`);
        `quaternion_spins_noncommute` — quarter turns about different axes do not commute;
        **`left_mul_no_fixed_vector`**, `norm_left_mul` — multiplication by a unit quaternion `p ≠ 1`
        keeps lengths and fixes **no** nonzero vector of `ℝ⁴`: a motion with no axis;
        **`left_right_double_rotation`** — `v ↦ e^{iα} v e^{iβ}` turns the plane `(1, i)` by `α + β` and
        the plane `(j, k)` by `α − β`, and every pair of plane angles is reached
        (`double_rotation_reachable`).  "Spin × rotation" as a left and a right multiplication factor is
        exactly a general 4D double rotation.

      Not formalised: a pyramid tumbling uniformly at random through all 3D orientations contains a
      given direction `1/6` of the time on average.  This would follow from `lightCone_ball_fraction`
      with `k = 3` and the rotation invariance of the sphere's area.

      ### D. Lead: the period-2 run bounds (`RunBoundEighteen.lean`)

      * **`runBound_two_upTo_eighteen`** (CERT): exact bounds `24` (`d = 17`) and `23` (`d = 18`) added to
        Round 16's list; **`runBound_two_witness18`** (CERT): attained by the rows with bit patterns
        `3112283` and `4328083`.  `runBoundTwoExt18_le_linear`: still below `2d + 7`.
      * EMP (computed outside Lean with an independent depth-first search in C,
        `scripts/period_two_search.c`; not verified): the values `B(d)` for `d ≤ 26` agree with Round
        16's list, and the search extends it to `B(27) = 33`, `B(28) = 33`.  The blocks of constant
        `d + B(d)` are now `8, 24, 41, 54, 55, 60 (d = 26, 27), 61 (d = 28)`, all still below `2d + 7`.  Reading `d + B(d)` as the distance from the moving left
        edge: every longest run ends on one of a few left diagonals.

      ### Where the prize problems stand after Round 17

      Unchanged: all three are open.  Period 2 is now certified exactly for `d ≤ 18`.  The spin geometry
      adds no new attack on P1–P3.  It does explain geometrically why the centre column is the one read
      that cannot see orientation.
    subsections:
      - A. The spinning triangle and pyramid (`SpinSweep.lean`, exact)
      - B. On the lattice (`SpinLattice.lean`, exact)
      - C. Spin as a multiplication factor (`SpinQuaternion.lean`, exact)
      - "D. Lead: the period-2 run bounds (`RunBoundEighteen.lean`)"
      - Where the prize problems stand after Round 17
