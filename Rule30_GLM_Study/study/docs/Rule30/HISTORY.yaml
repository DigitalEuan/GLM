      # Appendix B. "Where to push next" notes from `DEVELOPMENT.md`, Rounds 22–27 (kept as written)

      ### 6⁺. Where to push next (after Round 27)

      Round 27 analysed the period-2 machine as a machine (`PostEdgeSpec.lean`, `ProofRoutes.lean`,
      `ProofRoutesData.lean`; scripts `post_edge_witnesses.py`, `progress_measures.py`,
      `candidate_benchmark.py`). New To Do items 19–20. Suggested next steps:

      1. **Before any graph certificate, check the state.** The driven state grows by one cell per step
         (`halfStateD_width`), so full-state graphs never close (`halfStateD_strictMono`,
         `window_not_closed`). Use the prefix tree, or a quotient that provably determines the next step.
      2. **Inner survivors (To Do 19).** `inner_alternation_bound` turns an inner column that follows the
         drive into a narrower half-line problem. The data show recurring inner codes (`1601`). A uniform
         statement here would be a genuine width induction.
      3. **Credit the GLM honestly (To Do 18).** Run `candidate_benchmark.py --glm proposals.json` with
         proposals produced by the GLM, under the same budget as enumeration and repair, and report the
         non-dominated survivors, rejections, transfer to held-out words and cost. Supplied candidates
         are tagged and do not count.
      4. **Do not extend ranges for their own sake.** `Round27Open` (`AmortizedHalving 2 4 1`) has its
         smallest unresolved case at `d = 13`; extend only if a competing candidate would be separated.

      ### 6. Where to push next (after Round 26)

      Round 26 added the conjecture loop (`ConjectureLoop.lean`; run by `scripts/conjecture_loop.py`;
      verdicts certified in `ConjectureLoopData.lean`). New To Do items 17–18. Suggested next steps:

      1. **Use the loop as the round's first step.** Before proving, state the round's question as a
         graded family of `Prop`s (a constant, a slope, a window), run the loop to find its sharp
         frontier, certify the frontier and refute the member just below it. The frontier tells you which
         statement is worth proving; the refutation tells you which is not (as for `WindowHalving`).
      2. **Prove `AmortizedHalving 2 c e`** for some `c, e` (To Do 17). By `halfLineDies_two_iff` only the
         drive `1, 0` matters. The certified frontier is `(4, 1)` to `d = 12`.
      3. **Echo certificates scale**: `echoLogCheck` is a sort, so pushing past `n = 131072` costs mostly
         the centre column itself (`fastList`, quadratic). `ConjectureLoopData.lean` builds in about a
         minute.

      ### 6a. Where to push next (after Round 24, kept for reference)

      Round 24 tested alternatives to XOR (`XorAlternatives.lean`, `RunCountGeneral.lean`,
      `XorAlternativesData.lean`) and closed To Do 11 (`HankelKronecker.lean`). New To Do items 14–15.
      Suggested next steps:

      1. **Use the mirror as a control.** Rule 86 obeys the counting law for ever
         (`runCountW_eightySix`); Rule 30 does not after the edge. Any proposed post-edge statement for
         Rule 30 (items 1, 10, 12, 15) can be tested against the exact Rule 86 value `2^(d+1)` with
         `RunCountW`, which is defined for every wheel.
      2. **Widen the target class.** The four OR-type wheels 30, 45, 75, 135 are the only unsettled
         one-gate variants (item 14). A technique that works for one of them should be tried on all four.
         `centreList` (sound simulator for every wheel) makes the certificates cheap.
      3. The closed-form method (`ecaEvolve_eq_closed`: guess `F n c` as a `decide` of linear arithmetic
         in `n`, `c` and check one update step with `omega`) settles any wheel whose diagram from the
         seed is piecewise linear. Use it before trying anything heavier.

      Build-time note (Round 24): the new files add under a minute (`XorAlternativesData.lean` about
      20 s).

      ### After Round 23 (kept for reference)

      Round 23 worked through the user's concept file `Rule30PowerSeriesLadder.lean`
