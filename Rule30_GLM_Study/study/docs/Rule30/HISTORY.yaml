  - heading: "Round 12: different reads of the wobble, the theorem wheel, and a discussion with the GLM"
    anchor: round-12-different-reads-of-the-wobble-the-theorem-wheel-and-a-discussion-with-the-glm
    body: |
      **The three prize problems remain open.** This round reads the centre column through several
      mathematical *lenses* (ways for the observer to read it), proves how the lenses relate, and finds
      one genuine improvement: a **strictly weaker sufficient target** for Problems 1 and 2.

      | File | Contents |
      |---|---|
      | `WobbleLenses.lean` | the strobe (clock) lens: `strobe`, `APBalanced`, `SeedAPBalanced`; Problem 1 in the strobe lens; `FSTypical → APBalanced` and its failed converse |
      | `WobbleLensesData.lean` | *computation*: the phase wobbles for strides 2–6 to `10⁶`; the arrow does not flip on `(195112, 10⁶]`; a balanced sequence whose arrow never flips |
      | `ReadAngle.lean` | the read angle: every left diagonal is eventually periodic (power-of-two period); the one-bit transducer lemma |
      | `scripts/theorem_wheel_axioms.lean`, `.json` | the axiom footprint (`#print axioms`) of every spoke of the GLM theorem wheel |

      ### A. The strobe (clock) lens (`WobbleLenses.lean`)

      The strobe read of stride `p` and phase `r` is `t ↦ a(p·t + r)`: the observer `Y` with a clock and
      no memory of the data, reading at the rational "angle" `r/p`.

      * `wobble_strobe_sum`: `D(p·N) = Σ_{r<p} D_{p,r}(N)`. The plain wobble splits into `p` phase
        wobbles.
      * `hasFrequencyHalf_of_strobes`: if every phase of one stride is balanced, so is the sequence.
      * `eventuallyPeriodic_iff_strobes_const`, **`problem1_iff_strobes`**: Problem 1 holds **iff** for
        every stride `p ≥ 1` some phase of the strobe keeps changing colour. Stride 1 is the proved
        period-1 case (`centerCol_not_eventually_constant`).
      * **`problems_one_and_two_of_seed_apBalanced`**: if every arithmetic progression of the centre
        column has frequency `1/2` (`SeedAPBalanced`), then Problems 1 and 2 both hold.
      * **`apBalanced_of_fsTypical`**: `FSTypical → APBalanced`. A strobe is a finite-state observer whose
        state is only a clock (`clockObserver`); the difference of two clock observers' hit counts
        isolates one phase (`clock_wobble_diff`).
      * **`exists_apBalanced_not_fsTypical`**: the converse fails. A finite-state-typical sequence with
        every bit doubled (`doubled`) is still AP-balanced (`apBalanced_doubled`), yet the observer
        "at odd times repeat the last bit" (`repeatObserver`) is right 3/4 of the time
        (`not_fsTypical_doubled`).

      So **`SeedAPBalanced` is a strictly weaker target than `SeedFSTypical` (Round 5) and still settles
      Problems 1 and 2.** "Strictly weaker" is meant for general sequences. Whether the centre column
      satisfies either target is open.

      ### B. The arrow lens (`WobbleLensesData.lean`)

      * `arrow_last_flip_1e6` (CERT): `D(195112) = 0` and `D(N) > 0` for every `195112 < N ≤ 10⁶`. The
        observer's arrow `−sign D(N)` does not flip in that range. (`EMP`: still no zero up to `10⁷`,
        where `D = 4440`.)
      * `exists_balanced_persistent_arrow`: a sequence can have frequency exactly `1/2` with an arrow
        that never flips. So a persistent arrow is not evidence of bias. For a fair coin, the last
        return to zero falls in the first 2% of the run with probability about 9% (arcsine law), so the
        observed persistence is unremarkable.

      ### C. Exact readings (`WobbleLensesData.lean`)

      * `strobe_wobble_table` (CERT): all 20 phase wobbles `D_{p,r}(⌊10⁶/p⌋)`, `p = 2..6`. The largest
        is `D_{3,1}(333333) = 1583` (`strobe_three_one`), about 2.7 standard deviations of a fair coin.
        `EMP` (`rule30_round12/r12_lens_survey_output_10M.txt`): at `10⁷` bits it is back at 1.8, so it
        is a fluctuation and not a drift.

      ### D. The read angle (`ReadAngle.lean`)

      * `ldiag D t = a(t)(D − t)`, the cell `D` steps inside the always-black left edge.
        `ldiag_succ`: `ldiag D (t+1) = ldiag (D−2) t xor (ldiag (D−1) t ∨ ldiag D t)`.
      * `bool_transducer_periodic`: a one-bit machine driven by an input with period `Q` from time `T`
        has period `2Q` from time `T + Q`.
      * **`ldiag_eventually_periodic`**: every left diagonal is eventually periodic, with a power-of-two
        period. Together with `rdiag_periodic` (Round 4), **every read parallel to either edge is
        eventually periodic**. `centerCol_eq_ldiag`: the centre reads left diagonal `t` at time `t`.
      * `EMP` (`rule30_round12/r12_read_angle.c`): left periods stay at most 8 for `D ≤ 200`, but each
        left diagonal becomes periodic only after about `1.3·D` steps (preperiod `> D` for every
        `20 ≤ D ≤ 200`). Right diagonals are periodic from the start, but their periods exceed `D` (for
        every `D ≤ 200` except `D = 2`). So the centre column reads every diagonal before its
        regularity shows: inside the transient on the left, inside the first period on the right.

      ### E. Lenses that give no improvement

      These are recorded as results too:

      * the echo/radar lens (`Spectral.lean`, Round 6) and the reverse read (`Perspective.lean`) are
        **restatements** of Problems 1 and 2. Proving them is the same task.
      * the off-centre lens (Round 11): the chirality gap does not grow.
      * the Cesàro (smoothed) read is weaker than the plain wobble. `EMP`: the block counts (`k ≤ 12`),
        the 1023 Walsh window characters and the echoes at lags 1–64 to `10⁷` all look like a fair coin
        (`r12_lens_survey`).

      ### F. The GLM in this round (`rule30_round12/`, Python, outside Lean)

      The key theorems now form a **theorem wheel** (`reasoning/theorem_wheel.py`):

      * the statements are its quantities;
      * the Lean theorems are its spokes, each carrying its axiom footprint, so the axioms form the hub;
      * the proved non-implications are its negative controls.

      `tool discuss` reads a question about the dynamics in five stages, broad to narrow, and names
      `SeedAPBalanced` as the weakest sufficient open hypothesis for Problems 1 and 2. A scripted
      discussion (`r12_glm_discussion_output.txt`) records what the GLM can and cannot say.

      ### Where the prize problems stand after Round 12

      * Problem 1 is equivalent to the strobe statement `problem1_iff_strobes`. Stride 1 is proved.
      * Problems 1 and 2 follow from `SeedAPBalanced`, which is strictly weaker (in general) than
        `SeedFSTypical`. Both targets are open for the seed.
      * Problem 3 is unchanged.
    subsections:
      - A. The strobe (clock) lens (`WobbleLenses.lean`)
      - B. The arrow lens (`WobbleLensesData.lean`)
      - C. Exact readings (`WobbleLensesData.lean`)
      - D. The read angle (`ReadAngle.lean`)
      - E. Lenses that give no improvement
      - F. The GLM in this round (`rule30_round12/`, Python, outside Lean)
      - Where the prize problems stand after Round 12
