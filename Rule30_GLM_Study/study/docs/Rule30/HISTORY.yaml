  - heading: "Round 28: the GLM made operational on the package; local-rule induction for ARC; documentation"
    anchor: round-28-the-glm-made-operational-on-the-package-local-rule-induction-for-arc-documentation
    body: |
      **The request.** Continue the To Do list, make the documents clearer, use the GLM wherever
      possible, and check whether the Rule 30 work measurably improves the GLM's puzzle solving and
      reasoning.

      **Where the prize problems stand.** Unchanged: all three are open. This round adds no new rung of
      Problem 1. It probes two To Do items (both negative, EMP) and makes the GLM side current and
      measurable.

      ### 1. Lean: local-rule induction on any grid, with any reader (`LocalRuleInduction.lean`, FORMAL)

      Round 10 proved the GLM's induction discipline for the 256 one-dimensional wheels
      (`next_row_determined_iff`). This round proves it in the generality an ARC solver needs. The
      setting has any grid type with any set of cells and a **reader** `read g p : K` (what the observer
      sees at a cell). An output may be read relative to the reader through slots and a decoder
      (`dec : E → S → C`, e.g. "copy the colour seen to the west").

      * `reproduces_iff_keyOK`, `consistent_iff`: rules are chosen **key by key**, so the surviving rules
        form a product;
      * `determined_iff_keyDetermined`: all survivors agree at a query cell iff all consistent entries
        for its key decode alike;
      * `determined_iff_seen`, `answer_determined_iff_covered`: for plain tables over at least two
        colours, all survivors agree iff every key the query needs has been seen. So the refusal rule
        "refuse iff an unseen key is needed" is exact;
      * `survivor_correct` (lock-in): if the truth is a rule over the reader and the query is covered,
        every survivor is right;
      * `clash_refutes`, `not_consistent_mono`, `plain_consistent_iff`: a clash refutes a reader for
        good, and consistency is exactly the absence of clashes.

      All of these use only the standard axioms (C277).

      **Caution.** These guarantees hold **per reader**. A ladder that picks the first consistent reader
      can still answer wrongly when a coarser reader happens to fit the demonstrations. This happened
      once in 108 development puzzles (family `between`).

      ### 2. GLM: what now runs, and how it was measured

      Setup: `STUDY=… PKG=… sh rule30_round28/setup_round28.sh` on a fresh unzip of `glm_repo.zip`. It
      runs the Round 11/12 setups and the Round 13/16 overlays, then installs Round 28 and ends with
      `round 28: all checks pass`.

      * **Local-rule fallback** (`local_rule_induction.py`). `tool induce` and `tool arc` offer a task to
        a fixed ladder of 21 readers when the existing solvers refuse. The ladder runs from the cell
        itself, through the Rule 30 wheel neighbourhood along the row and the column, totalistic counts,
        colour-blind shapes and directional rays ("the first colour seen looking north"), to `5 × 5`
        blocks. A task is answered only when every surviving rule agrees.
      * **Theorem wheel, Round 28** (`theorem_wheel_round28.py`):
        * the Round 21–28 statements and spokes (`HalfLineDiesAll ⇒ P1`, `AmortizedHalving241 ⇒
          HalfLineDies2 ⇒ LeftWhiteAperiodic2`, the four routes, the tuning excess, the Hankel form);
        * the Problem 3 vocabulary (`P3Eventual ⇒ P3`; `LightConeCircuitBound =/=> P3`);
        * the narrowest open rungs (`tool theorem narrowest P1`);
        * the whole ledger as carriers (`tool theorem ledger …`, from `glm/r28_wheel.json`).

        This completes To Do 6 and 8 (C280).

      **Benchmark** (`rule30_round28/r28_benchmark.py`; all calls go through the GLM's own `run_tool`).
      *Before* is the archive plus the study overlays of Rounds 10–16; *after* adds Round 28.

      | Measurement | Before | After |
      |---|---|---|
      | A. stored ARC tasks (50) | 0 right, 0 wrong | **1 right** (`a85d4709`, by the Rule 30 row reader), 0 wrong |
      | B1. development local-rule puzzles (9 families × 12) | 0 right | 44 right, **1 wrong**, 63 refused |
      | B2. **held-out** local-rule puzzles (7 families × 12, written after the ladder was frozen, fresh seeds) | 0 right | **24 right, 0 wrong**, 60 refused; both non-local controls refused 24 of 24 |
      | C. Rule 30 knowledge alignment (10 questions fixed by the Lean package) | 0 / 10 | 10 / 10 |
      | D. Round 11 claim suite (regression) | frame 23/23, heldout 2/5, refuse 2/2 | unchanged |

      **What it means, measured honestly.**
      * The ARC gain on the stored set is small: 1 of 50. The GLM's own colour solver is not in this
        archive; the GLM's records give it 2 of 50, and the stored tasks are no longer held out.
      * The refusal rule pays its way on the stored ARC set. An unsound control that guesses unseen keys
        answers 17 tasks: 1 right and 16 wrong (`local_rule_arc.py`, C278).
      * On local-rule puzzles the gain is real and held out: 24 of 84 answered, none wrong. The limit is
        coverage (unseen keys), not errors.
      * Line C shows that the GLM's knowledge is now current. It does not measure reasoning power.
      * The reasoning suite (D) did not change, so this round neither improved nor broke claim
        reasoning (C279).

      ### 3. To Do probes (EMP)

      * **To Do 19, inner survivors** (`inner_survivors.py`, C281). Codes of length `d ≤ 22` (word `10`)
        survive past their edge for up to 20 steps. Their longest inner alternation is only 7–14 steps,
        and the slack grows. So the natural uniform form ("one inner column alternates for almost all of
        the post-edge life") is not supported, and a width recursion would need several inner stretches.
        New To Do 22 asks for a certified refutation.
      * **To Do 2, long black runs** (`word_lifetimes.c`, C282). For the words `1110`, `11110`, `111110`
        the excess `Lmax(d) − d` stays at most 10 up to `d = 24`, but it grows, so the period-1 forcing
        proof does not extend. The word `10` reproduces the certified values of `lmaxTwo_spec`
        exactly.

      ### 4. Documents

      * `PROJECT_DIRECTIVE.md` (new): the one-page brief. It covers the goal, the rules of evidence, the
        current focus F1–F5, what counts as progress, the observer/wobble idea, the fate of the original
        `VERIFICATION_DIRECTIVE.md` targets, and where everything lives.
      * `README.md` is now a short map: the documents, the status, the build, and a file index by topic
        covering all 86 files.
      * The round-by-round record moved here (`HISTORY.md`), re-ordered by round. The older "where to
        push next" notes are in Appendix B.
      * `DEVELOPMENT.md` makes the GLM hand-off a standing step of every round.
      * `AUDIT.md`: To Do 6 and 8 are done, 2, 18 and 19 are updated, and 21–22 are new.

      ---
