  - heading: "Round 40: settling times, the open bit, and the left side of every row"
    anchor: round-40-settling-times-the-open-bit-and-the-left-side-of-every-row
    body: |
      **Brief.** "Continue this Rule 30 project — see the To Do list, let's see if we can get through a
      few items. Keep the hypothesis engine running and hypothetical ideas tested, if it can help to
      push new directions." Items taken: To Do 45 and 46 (the white diagonals and their open bit).

      **Proved for every index** (`Transients.lean`, FORMAL, C374–C377).
      * *Settling times grow at most linearly* (`perFrom_step`, `perFrom_linear`): a diagonal settles at
        most one period after its two outer neighbours (a reset within one period, or white for ever).
        For the seed: for every `N` some `2^m` is a period of every left diagonal `D < N` from time
        `1 + D·2^m` (`ldiag_perFrom_linear`). So every eventual datum below `N` — whiteness, parity,
        the open bit — is a finite computation of size about `N²·2^m` (before: the trivial `2^N`).
      * *Odd white diagonals do not branch* (`odd_white_complement_is_shift`, `shift_sync`,
        `next_white_independent_of_odd_bit`, `ldiagOf_shift_sync_after_odd_white`): at a white diagonal
        whose outer neighbour has odd parity, the two possible next diagonals differ by a time shift,
        and the law commutes with time shifts, so everything up to the next white diagonal is the same.
      * *The doubling is read two diagonals out* (`doubling_read_two_out`): if diagonals `D+1`, `D+2`
        agree from time `T`, then for even `Q` the parity of `D+2` over a period equals the parity of
        diagonal `D` at the even offsets.
      * *Shift-equivalence extends* past non-white and odd white diagonals (`shift_equiv_extend`,
        `shift_equiv_extend_odd`).

      **Certified** (`TransientsData.lean`, CERT, C378). `left_edge_rows_agree_up_to_shift`: every row
      white on `(-∞, 0)` and black at `0` has, up to one time shift, the seed's eventual left diagonals
      for all `D ≤ 53207` — the white diagonals `2, 7, 28, 399` are all odd, and `53207` is the first
      even one.

      **Hypothesis engine** (study folder `rule30_round40/`, EMP, C379–C383). Hypotheses stated before
      the runs, then tested:
      * H1 (theorem prediction: rows agree to the first even white) — confirmed, then proved (above).
      * H2 (the open bit at an even white is a coin toss across rows) — **refuted**: 301 random rows
        and 20 fully random bands of width up to 99 999 all take the seed's branch at `53207` and
        `58286`. New direction: the bit is not set by the row but by the dynamics.
      * H3 (settling slope ≈ 1) — measured 1.3308–1.3331 for every row at `W = 100 000`.
      * H7 (the bit is the value forced by the certified reset recursion) — refuted (slope ≈ 2, wrong
        white at 72575). H8 (synchronisation deep in the transient) — refuted.
      * H9 (**run-up universality**): a stretch of diagonals driven at its outer edge by the true
        eventual patterns, from any filling, reproduces the true pattern after an even white diagonal
        once the run-up is long enough. Validated against the automaton at `53207` and `58286`
        (run-up ≥ 1000: 8/8). At odd white diagonals the phase is not reproduced, as the symmetry
        predicts (the two choices differ by a time shift that the driven stretch commutes with).
      * **Prediction for To Do 46.** At the even white diagonal `1420878968` all 24 runs (run-ups
        3000–100000, six fillings each) give Round 39's "bit 1" branch: the next white diagonal is
        `2107985254`, with odd outer parity, so the period becomes **64** at `2107985255`. By the
        theorem above, the bit there does not matter; the pattern law then runs at period 64 with no
        white diagonal in `2107985255 … 32107985254` (3·10¹⁰ diagonals, `fscan_q64.txt`).

      **Not achieved.** No prize problem is closed. To Do 45 (are periods unbounded?) is still open;
      H9 is validated but not proved, so the period-64 prediction is EMP.
