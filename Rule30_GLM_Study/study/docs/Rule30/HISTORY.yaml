  - heading: "Round 19: the triangle as the side view of a hole; the period-3 to period-6 rungs"
    anchor: round-19-the-triangle-as-the-side-view-of-a-hole-the-period-3-to-period-6-rungs
    body: |
      New files (both imported by `RequestProject/GLM/Rule30.lean`, no `sorry`, no added axioms):

      | File | Content |
      |---|---|
      | `Funnel.lean` | the user's question: is the triangle the 2D view of a curved surface, a hole pulled down to a point? Side views, round holes with any profile, the cone's flat metric and its angle deficit, Rule 30's triangle rolled up |
      | `RunBoundPeriods.lean` | *certificates*: exact run bounds for periods `3, 4, 5, 6` (to `d = 14, 12, 12, 12`), each attained by an explicit row |

      ### A. The question

      > Is the triangle 2D pattern we see perhaps on a curved surface, but we only see the 2D
      > perspective? Is the point pulled down into a deep hole stretching to the core?

      Space-time is `(t, z)` with `z` in the complex plane, as in Round 17. The **side view** keeps
      `(t, Re z)` and forgets the depth direction `Im z`. Every statement below is FORMAL.

      ### B. The side view cannot tell what it is looking at

      * `sideView_tri`, `sideView_roundCone`, `sideView_pyr`: the flat triangle, the round `90°` cone
        (a hole `‖z‖ ≤ t` with the seed at its tip) and the square pyramid of a 2D rule **all have the
        same side view**, Rule 30's triangle `|x| ≤ t`. `side_view_bodies_distinct`: the three bodies are
        different.
      * So the answer to "could it be a surface we only see in 2D?" is **yes, and the picture alone can
        never rule it out**: the depth is exactly what a side view throws away.

      ### C. If it is a round hole, its walls are straight

      * `funnel f` is the round hole whose radius at depth `t` is `f t`: a bowl, a gravity-well funnel, a
        horn, anything. `sideView_funnel`: its side view is `|x| ≤ f t`.
      * **`funnel_side_view_triangle`**: if the side view is Rule 30's triangle then `f t = t` for every
        `t ≥ 0`. The hole is the straight `45°` cone. A curved profile shows curved edges; for example the
        paraboloid bowl `f = √` does not give the triangle (`paraboloid_not_triangle`).
      * Rule 30's edges are exactly straight in every row (`seed_pattern_triangle`). So a round hole
        behind the triangle cannot be a curved funnel; it is a cone.

      ### D. A cone is flat except at its tip: all the curvature is in the point

      * `coneEmbed Θ s θ` rolls the flat sector of opening angle `Θ` (polar coordinates `s`, `θ`) into a
        cone in 3D. `coneEmbed_dist_apex`: the point is at distance `s` from the tip; `coneEmbed_closes`:
        going once round the sector goes once round the cone.
      * **`coneEmbed_metric`** (with `coneDs_hasDeriv`, `coneDθ_hasDeriv`, the actual derivatives): the
        two coordinate velocities have squared lengths `1` and `s²` and are perpendicular. That is the
        flat metric `ds² + s²dθ²` of the plane in polar coordinates. Away from the tip the cone is the
        plane bent without stretching, with **zero curvature**.
      * **`coneEmbed_circle_length`**: the circle at distance `s` from the tip has length `Θ·s`, short of
        the flat `2π·s` by `(2π − Θ)·s`. The angle deficit `2π − Θ` is all the curvature of the surface,
        and it sits in the single tip point. (We prove the deficit; "curvature" here is the standard name
        for it, not a separate Lean theorem.)

      So "the point is pulled down into a hole" has an exact reading: **a cone is a flat sheet with all
      its curvature concentrated at one point.** This is also the shape space takes around a point mass in
      2+1-dimensional gravity.

      ### E. Rule 30's triangle rolled into a hole

      * **`rolled_seam_black`**: the two edges of the triangle are black in every row, so gluing the left
        edge to the right edge never puts two colours on one cell. `rolledRow t` is row `t` drawn on a ring
        of `2t` cells (`ZMod (2t)`); `rolledRow_seam` checks the glued cell, `rolledRow_covers` that every
        cell of the row is on the ring.
      * `rolled_ring_card`: after gluing, row `t` is a ring of exactly `2t` cells at `t` steps from the
        seed. Circumference `2t` at distance `t` means sector angle `Θ = 2` radians.
        **`rule30_cone_deficit`**: the deficit is `2π − 2 ≈ 4.28`. **`rule30_cone_shape`**: the walls make
        the angle `arcsin(1/π) < 30°` (about `18.6°`) with the axis, and the hole is `√(π² − 1) ≈ 2.98`
        times as deep as its rim radius. Drawn with unit cells, Rule 30's triangle is a **narrow, deep
        hole**.
      * `spun_cone_angle`: the round cone of §B (the spun triangle of Round 17) is `coneEmbed` with
        `Θ = √2·π`: walls at `45°`, deficit `(2 − √2)·π`. It is a different, wider hole. Which hole one
        gets depends on what one keeps (the side view, or the cell count of each row). The rule fixes
        neither; it only fixes which cells are neighbours.
      * **`rolled_seam_visible`**: from row `2` on, the two cells on either side of the seam differ. The
        hole has a marked line down its wall and is not symmetric about it (this is Round 17's
        `rule30_row_not_mirror`, read on the rolled surface).
      * **`rolledRow_centre`**: the centre column sits at ring position `t`, exactly opposite the seam.
        **`ringAngle_column_tendsto`**: every fixed column winds onto that opposite line (angle `π`).
        **`ringAngle_right_diagonal_tendsto`**: every diagonal at fixed distance from the right edge winds
        onto the seam (angle `2π`). Those diagonals are exactly periodic, with period `2^D`
        (`rdiag_periodic`, Round 4).

      ### F. What this means for the study

      * **The picture on the hole.** The ordered part of Rule 30 (the periodic edge diagonals) gathers at
        the seam. The centre column, which is the object of Problem 1, runs straight down the opposite
        wall to the tip. Looking down into the hole, the observer `Y` sees the seam on one side and the
        centre line on the other. The seam is visible in every row, so it fixes a direction. This is the
        Round 17 compass (`rule30_spin_readable`) in the language of the hole.
      * **"Stretching to the core."** The tip of the hole is the seed. In ANF terms (Round 18), the seed's
        whole diagram is the degree-one slice (`seed_eq_linearCoeff`), and that slice evolves on its own,
        with nothing from higher degrees entering it (`linearCoeff_autonomous`). Reading the depth of the
        hole as ANF degree, from degree `2n − 1` at the rim of row `n` down to degree `1` at the core,
        Round 18 says the core is **sealed**: the top of the hole does not reach down to it. An argument for
        Problem 1 has to work at the core itself.
      * **What the geometry does not do.** None of B–E constrains the colours inside the triangle beyond
        the edges and the two cells next to the seam. The hole picture is an exact change of viewpoint, not
        a new constraint on the centre column. Problems 1–3 are untouched by it.

      ### G. Pushing the leads: the period-3 to period-6 rungs (`RunBoundPeriods.lean`, CERT)

      Problem 1 holds for period `p` if some bound `B_p(d)` limits how long the column at distance `d`
      from the edge of any left-white row can stay `p`-periodic (`leftWhiteAperiodic_of_runBound`). This
      is necessary too (`leftWhiteAperiodic_iff_runBound`). Rounds 16–17 took period 2 to `d = 18`. Round 6
      had periods `3–6` only to `d = 4`. Using the same verified search:

      | `p` | exact `B_p(d)` for `d = 0, 1, 2, …` | certified to |
      |---|---|---|
      | 3 | 4, 7, 9, 8, 8, 9, 13, 12, 16, 15, 14, 18, 17, 22, 23 | `d = 14` |
      | 4 | 7, 7, 9, 9, 10, 12, 13, 13, 16, 15, 18, 19, 19 | `d = 12` |
      | 5 | 5, 10, 9, 9, 10, 12, 12, 13, 15, 18, 17, 18, 20 | `d = 12` |
      | 6 | 6, 14, 13, 13, 12, 12, 15, 15, 17, 18, 18, 25, 24 | `d = 12` |

      * `runBound_three_upTo_fourteen`, `runBound_four_upTo_twelve`, `runBound_five_upTo_twelve`,
        `runBound_six_upTo_twelve`: the upper bounds, for every left-white row.
      * `runBound_periods_sharp`: each value is reached by an explicit row (found by a search, checked in
        Lean).
      * `runBoundPeriods_agree_small`: they agree with Round 6 for `d ≤ 4`.
      * `runBoundPeriods_le_linear`: every value is `≤ 2d + 12`. This fits a linear bound for each period,
        as period 2 fits `2d + 7`. A finite table cannot prove such a bound. The uniform bound remains
        the open target.

      ### Where the prize problems stand after Round 19

      Unchanged: all three are open. The hole picture is exact, but it is a change of viewpoint. The
      period-3 to period-6 run bounds are now known exactly to `d = 12–14`.
