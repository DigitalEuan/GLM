      # Appendix C. The former top-level `README.md` (Rounds 20–27 summaries, kept as written)


      Authors: the GLM study author (study, concept, GLM/UBP framework); Aristotle by Harmonic
      (Computational Implementation: Lean 4 formalisation, verification, exact computation).

      The deliverable is the self-contained Lean package in `RequestProject/GLM/Rule30/`
      (root module `RequestProject/GLM/Rule30.lean`). Read
      `RequestProject/GLM/Rule30/README.md` for the results, the evidence ledger `claims.csv`, the audit of the earlier study files,
      and the instructions for moving the package into the GLM repository.

      Build with:

      ```
      lake build RequestProject.GLM.Rule30
      ```

      Toolchain: Lean 4.28.0, Mathlib `v4.28.0`, as pinned in `lean-toolchain`, `lakefile.toml`,
      and `lake-manifest.json`.

      #### Start here: the audit (Round 20, updated through Round 27)

      `RequestProject/GLM/Rule30/AUDIT.md` defines the project, lists what has been tried and what came
      of it, what is still missing (in the GLM's own terms) and what is left to do, with suggested
      analysis directions. `RequestProject/GLM/Rule30/Frontier.lean` holds the same frontier as six
      checked Lean theorems, and `frontier_halfLine` (in `HalfLineMachineData.lean`) adds Round 21.

      **To continue the project**, follow `RequestProject/GLM/Rule30/DEVELOPMENT.md`: the round loop, the
      conventions, the checks (including `scripts/ledger_check.py`) and how to keep the To Do list in
      `AUDIT.md` §4 current.

      #### Round 27: post-edge witnesses, ranking functions and width reduction

      The period-2 half-line machine analysed as a machine. Proved for every drive
      (`PostEdgeSpec.lean`): the state grows by exactly one cell per step, so no state ever repeats and
      no fixed window determines the next step (graph-cycle certificates are vacuous here; the prefix
      tree is the sound finite object), and the column history determines the code. Width reduction in
      its sound form: an inner column that follows the drive is itself a half-line problem whose
      machine never fails (`inner_alternation_bound`). Four proof routes (individual termination,
      ranking, population, width induction) are each proved to give the period-2 rung
      (`ProofRoutes.lean`). Certified (`ProofRoutesData.lean`): exact longest lives for `d ≤ 32`; all 8
      declared progress measures fail for every window up to 20; width steps up to 17 fail; the longest
      survivors of lengths 11 and 19 share one inner survivor. `AmortizedHalving 2 4 1` remains the one
      surviving uniform candidate (`Round27Open`, open, smallest unresolved case `d = 13`). A harness
      (`scripts/candidate_benchmark.py`) measures candidate generation with supplied candidates tagged.
      Two audit claims are softened (`AUDIT.md` §5.4). All three problems remain open. Details:
      `RequestProject/GLM/Rule30/README.md`, section "Round 27".

      #### Round 26: the conjecture loop (the GLM proposes lemmas, tests them, narrows, loops)

      Round 25 tuned candidate laws for the data; this round tunes candidate *statements*
      (`ConjectureLoop.lean`). Candidate lemmas are proposed by seeds, analogy (transporting a proved
      theorem), narrowing, junction meets (two candidates the data cannot separate are combined) and
      repairs of refuted shapes; they are tested, narrowed and looped. Proved for every pool: pruning is
      sound, a loop with rising levels prunes every false candidate, a graded family's frontier settles
      exactly on the least true parameter (`narrow_eventually_eq`), a finite read splits a junction iff the
      two differ in truth (`junction_split`), and analogy alone proves nothing
      (`analogy_transport_unsound`). Run on Rule 30 (`scripts/conjecture_loop.py`, verdicts certified in
      `ConjectureLoopData.lean`): the tuning excess is exactly the longest echo (`excess_le_iff_not_echo`);
      `TuneExcessLog` holds for `n ≤ 131072` and its offset is sharp (`not_echoLogBound_2_1`); the To Do
      "window halving" statement is false (`not_windowHalving_two`) and its repair `AmortizedHalving`
      implies the period-`p` rung (`halfLineDies_of_amortized`), certified for `(c, e) = (4, 1)`, `d ≤ 12`;
      two analogies are refuted; `HalfLineDies 2` and `3` reduce to one and two drive words
      (`halfLineDies_two_iff`, `halfLineDies_three_iff`). All three problems remain open. Details:
      `RequestProject/GLM/Rule30/README.md`, section "Round 26".

      #### Round 25: tuning by ear (your iterative-search idea)

      Your loop — iterate candidate laws, prune those that disagree with what has been heard, prefer the
      simplest survivor — is made exact for every family of candidates (`TuningByEar.lean`). Pruning is
      permanent and sound; a finite family, or a family graded by size with finitely many candidates per
      size, settles iff the true law is in it (`finite_lockIn`, `graded_settles_iff`,
      `tuneIndex_eventually`); otherwise the guess drifts for ever (`tuneIndex_diverges`); and no finite
      amount of listening ever confirms a candidate (`no_finite_confirmation`). For Rule 30 the loop is an
      exact restatement of Problem 1: the best periodic tune never settles
      (`problem1_iff_tuneCost_unbounded`). New sufficient target `TuneExcessLog` (the best periodic tune
      predicts at most `2 log₂ n + 2` notes beyond its own size), certified for `n ≤ 2000`; the excess is
      at most 16 for `n ≤ 1000`, attained at `n = 448` (`TuningByEarData.lean`). All three problems remain
      open. Details: `RequestProject/GLM/Rule30/README.md`, section "Round 25".

      #### Round 24: alternatives to XOR; Kronecker's converse

      Changing *how* the XOR is computed changes nothing (`implementation_invariance`, seven XOR-free
      formulas). Changing the gate does: for every gate `g ≠ xor` the centre column of `g(L, C or R)` is
      eventually periodic (`outer_alternative_periodic`; even `xnor`, wheel 225), and for every gate `h`
      not of OR type the centre column of `L xor h(C, R)` is eventually periodic
      (`inner_alternative_periodic`). The only unsettled variants are the OR-type wheels 30, 45, 75, 135
      (no eventual period `p ≤ 500` from time `≤ 500` for all four, `orType_no_small_period`). The
      counting law of Round 23 comes from the XOR alone: it holds for every left-permutive wheel
      (`runCountW_law`), fails for every non-permutive replacement of the XOR (`outer_runCount_law_iff`),
      and holds for all times for the mirror rule 86 (`runCountW_law_right`). To Do 11 is done: the
      Hankel form of Problem 1 is exact (`problem1IffHankelInfinitelyOften`). All three problems remain
      open. Details: `RequestProject/GLM/Rule30/README.md`, section "Round 24"; new files
      `XorAlternatives.lean`, `RunCountGeneral.lean`, `XorAlternativesData.lean`, `HankelKronecker.lean`.

      #### Round 23: the power-series ladder

      Your concept file `Rule30PowerSeriesLadder.lean` was rebuilt inside the package as
      `PowerSeriesLadder.lean`, `RunCountLaw.lean` and `PowerSeriesLadderData.lean`. Proved: Problem 1
      is equivalent to unbounded `GF(2)` linear complexity (`problem1_iff_lcUnbounded`) and to
      `p(n) ≥ n + 1` for every `n` (Morse–Hedlund, `problem1_iff_complexity`); "not 2-automatic" and
      "infinitely many non-zero Hankel determinants" each imply Problem 1; the exact counting law
      `runCount_law`. Certified: linear complexity `≥ 10000` on the first 19999 centre bits, hence no
      eventual period with `τ + p < 10000`; 2-kernel `≥ 1023`; `p(n) = 2ⁿ` for `n ≤ 10`. Three draft
      statements were corrected (the finite-prefix complexity form is equivalent to `¬ Problem1`; the
      counting law fails at `T = d`; the deficit monotonicity is false). All three problems remain open.
      Details: `RequestProject/GLM/Rule30/README.md`, section "Round 23".

      #### Where the prize problems stood after Round 21

      All three problems are still **open**. Round 21 reduces Problem 1 to a statement about the **left
      half-line only**: if a column is periodic, the cells to its left form a deterministic machine driven
      by the column, with a test at each black time; if for every period no such machine passes its tests
      forever (`HalfLineDies p`), Problem 1 holds (`problem1_of_halfLineDies`). Period 1 is proved in this
      frame (`halfLineDies_one`); period 2 is certified for `d ≤ 24` (was 18) and periods 3–6 further out
      than before. The narrowest open rung is now `PeriodTwoHalfLineLinear`.

      #### Where the prize problems stood after Round 20

      All three problems are **open**. Proved towards P1: the centre column is not eventually constant;
      at most one column of the seed pattern is eventually periodic; the period-1 case holds for every
      left-white row. Proved for P2: equivalent to `D(n) = o(n)`. Both hold for almost every initial row.
      P3 is stated for Turing machines; no sufficient statement is known. Exact run bounds for
      periods 2–6 are certified on finite ranges. The narrowest open rung is the period-2 run bound
      `PeriodTwoLinearBound`; the weakest known sufficient target for P1 and P2 together is
      `SeedAPBalanced`. Round 20 also proves that the wobble arrow is logically independent of P2
      (`ArrowIndependence.lean`).

      The sections below are kept as the history of earlier rounds.

      #### Where the prize problems stand after Round 10 (unchanged since Round 9)

      | Problem | Proved | Precisely what remains |
      |---|---|---|
      | P1 | No column is eventually constant (period 1 excluded), with a window bound; at most one column of the seed pattern is eventually periodic; equivalent to unbounded lag-`p` mismatches for every lag `p`; holds for almost every row; the same question for wheels 30 and 86 (and 135 on the complemented impulse) | Exclude periods `p ≥ 2` for the centre column |
      | P2 | Equivalent to `D(n) = o(n)` and to total echo `o(N²)`; holds for almost every row | A seed-specific bound on `D(n)` |
      | P3 | Stated for Turing machines. **New (Round 9):** the light-cone map needs all `2t+1` inputs and at least `t` gates, for every `t` (`WholeCone.lean`) | A lower bound for `n ↦ a(n)` from the `log n` bits of `n` |
      | Degree `deg a(n) = 2n − 1` | Proved for all `n ≥ 2` (Round 8, `TopMonomial.lean`) | Nothing |

      **New (Round 9), the family:** `ElementaryCA.lean` states the three questions for any of the 256
      elementary cellular automata ("wheels"), proves they are P1–P3 for wheel 30 from the impulse row,
      proves the mirror/colour symmetries, and settles them for wheels 0, 90 and 204.

      See "Round 9" in `RequestProject/GLM/Rule30/README.md`. The GLM files of this round (the
      cellular-automaton register, its probe and outputs) are in `rule30_round9/` (user files, outside
      Lean).

      **New (Round 10), the observer and the induced wheel:**
      * `WheelInduction.lean` proves that inducing a wheel from rows of a diagram is sound and complete.
        Every wheel that fits rows `0..T` predicts the same next row iff that row uses only
        neighbourhoods already shown (`next_row_determined_iff`).
      * `Observer.lean` proves what Rule 30's rows and columns reveal:
        * rows `0..4` of the impulse run determine wheel 30 among all 256, and rows `0..3` do not
          (wheel 62);
        * the centre column determines exactly `{30, 86}` and never separates the two
          (`centre_column_class`), so the centre observer cannot tell left from right;
        * every column `1 ≤ |c| ≤ 5` determines wheel 30;
        * the wobble arrow `−sign D(N)` is unchanged by the mirror and reversed by the colour swap.

      See "Round 10" in `RequestProject/GLM/Rule30/README.md`. The GLM files of this round are in
      `rule30_round10/` (user files, outside Lean): step-by-step, induction, observer and perspective
      carriers and reports, the wheel family for `tool induce`, a self-test, a probe with its output,
      and `GLM_AVAILABILITY.md`, which lists what the supplied GLM archive is missing.

      **New (Round 12), lenses on the wobble and the theorem wheel:**
      * `WobbleLenses.lean` adds the strobe (clock) read `a(p·t + r)`.
        * Problem 1 is equivalent to: for every stride, some phase keeps changing colour
          (`problem1_iff_strobes`).
        * `SeedAPBalanced` (every arithmetic progression of the centre column has frequency 1/2)
          implies Problems 1 and 2.
        * `SeedFSTypical` implies `SeedAPBalanced`, and the converse fails for general sequences
          (`exists_apBalanced_not_fsTypical`). So `SeedAPBalanced` is a strictly weaker sufficient
          target.
      * `WobbleLensesData.lean` (certificates):
        * the phase wobbles for strides 2–6 to `10⁶`;
        * the arrow `−sign D(N)` does not flip on `(195112, 10⁶]`;
        * a balanced sequence whose arrow never flips, so persistence is not bias.
      * `ReadAngle.lean` proves that every left diagonal is eventually periodic. With Round 4's right
        diagonals, every read parallel to an edge is eventually periodic.

      The three prize problems remain open. See "Round 12" in `RequestProject/GLM/Rule30/README.md`.
      The GLM files are in `rule30_round12/` (user files, outside Lean):
      * the theorem wheel (`tool theorem`) and the broad-to-narrow discussion pipeline
        (`tool discuss`);
      * the Round 12 carriers;
      * a 26-question discussion with the GLM and an analysis of its limits;
      * the lens survey to `10⁷` bits.

      **New (Round 14), what a proof would take and shortcut paths** (`ShortcutNetwork.lean`,
      `ShortcutNetworkData.lean`; write-up `rule30_round14/README.md` among the user files):
      * Problem 1 is equivalent to "no shortcut rule `c(t) = f(c(t−j₁), …, c(t−j_k))` ever takes over"
        (`problem1_iff_no_jumpRule`, and the same with XOR rules). At look-back 1 only "flip the last bit"
        survives the proved facts (`centerCol_lookback_one`). Excluding eventual alternation (period 2)
        is the first unproved link.
      * A pattern in the GLM's lattice network is a pattern of the column (`evPeriodic_lensWalk`). A
        never-cycling network walk would prove Problem 1, and for lossless lenses it is equivalent to it.
        Under normality the network statistics are exactly the pattern-free ones
        (`lens_freq_of_blockNormal`).
      * In the Golay network every point is within 3 minimal hops of every other
        (`golay_octad_distance`), so every walk "jumps".
      * Over 4.2M steps the centre column's network statistics match the pattern-free prediction, while a
        planted LFSR shortcut is detected. This is computed outside Lean.

      **New (Round 16)** (write-up `rule30_round16/README.md` among the user files):
      * `WeightGrowth.lean`: for every `n ≥ 3` the top-degree part of `a(n)` is the single monomial
        `x_{2−n} ⋯ x_n`, of weight `2n − 2`, growing by `+2` per step (`topMonomial_unique`). This is a
        property of the map (E2), not of the seed.
      * `RunBoundSearch.lean`: a verified pruned search along left diagonals. It certifies the exact
        period-2 run bounds for every left-white row and every `d ≤ 16`, with explicit witnesses
        (`runBound_two_upTo_sixteen`, `runBound_two_witness`). The uniform target `B(d) ≤ 2d + 7` is
        stated (`PeriodTwoLinearBound`) and remains open.
      * `ConeGeometry.lean`, `LatticeConeFraction.lean`: the seed's triangle is exactly `|i| ≤ t`
        (`90°`). The influence triangle has a rigid right side and a variable left side. Slices of 2D
        lattice cones have apex angles from `90°` to about `109.47°`, and a lattice light cone fills
        exactly `1/(2k)` of all directions of `k`-dimensional space-time.
      * `WobbleNormalized.lean`: `Σ D² = N·2^N` over all words, so `z = D/√N` is the scale-free
        carrier.

      **New (Round 17), spinning the triangle and the pyramid** (`SpinSweep.lean`, `SpinLattice.lean`,
      `SpinQuaternion.lean`, `RunBoundEighteen.lean`; details in "Round 17" of
      `RequestProject/GLM/Rule30/README.md`):
      * Spinning Rule 30's triangle about its time axis collects exactly the round `90°` cone; the
        spinning square pyramid of a 2D rule sweeps the round cone of apex `2·arctan √2 ≈ 109.47°` and
        always contains the round `90°` cone.
      * On the lattice only quarter turns are symmetries.  Turning Rule 30's plane by a half turn shows
        Rule 86.  The centre column (the spin axis) reads the same at every angle.  The turned diagram
        determines the angle mod a full turn, and every row from `t = 2` is asymmetric.
      * Spin as a multiplication factor: spins in one plane only add; a 4D double rotation closes up iff
        its rate ratio is rational; multiplication by a unit quaternion is a motion with no fixed axis,
        and left × right multiplication gives every 4D double rotation.
      * Period-2 run bounds certified for `d = 17, 18` (`24`, `23`).

      **New (Round 18), the `C·R` injector** (`Injector.lean`, `InjectorAnalogies.lean`,
      `InjectorData.lean`): for every `n ≥ 1` the number of monomial pairs of `a(n)(0)·a(n)(1)` whose union
      is the top monomial `M_{n+1}` is odd. The seed diagram is the degree-one slice of the ANF, and no
      statement about coefficients of degree `≥ 2` can imply Problem 1.

      **New (Round 19), the triangle as the side view of a hole** (`Funnel.lean`,
      `RunBoundPeriods.lean`; details in "Round 19" of `RequestProject/GLM/Rule30/README.md`):
      * The flat triangle, the round `90°` cone and the square pyramid have the same side view, so the 2D
        picture cannot tell whether it is flat or the outline of a hole. A round hole whose side view is
        Rule 30's triangle has straight walls (radius `= t`); no curved bowl fits.
      * A cone is flat away from its tip (metric `ds² + s²dθ²`), and all its curvature is the angle
        deficit at the tip. Rolling Rule 30's triangle up (both edges are black in every row, so the seam
        is consistent) gives a ring of `2t` cells per row: a narrow, deep hole of deficit `2π − 2`. The
        seam is visible in every row from `t = 2`, and the centre column runs down the opposite wall.
      * Exact run bounds for periods `3, 4, 5, 6` certified to `d = 14, 12, 12, 12`, each attained.
