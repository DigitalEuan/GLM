  - heading: "Round 47: the 2-adic layer tower; the full `M₂₄` census; MOG subgroups"
    anchor: round-47-the-2-adic-layer-tower-the-full-m-census-mog-subgroups
    body: |
      The owner suggested a *layered, p-adic-like* reading of the escalation idea. Round 47 made it exact
      and finished two open `M₂₄` items. (The files were written in an interrupted run and completed and
      recorded in the following one.)

      **The 2-adic layer tower** (`AdicTower.lean`, FORMAL; `AdicTowerData.lean`, CERT).
      * Layer `n` of a column is the residue `x_n = ∑_{k<n} a(k)·2^k mod 2^n`; the layers form the chain
        `ℤ/2 ← ℤ/4 ← ℤ/8 ← ⋯` (`adicTrunc_dvd_sub`), whose limit is the 2-adic integers `ℤ₂`.
        Unlike the moduli `2, 4, 8, 144, 256` of the escalation sketch, this is a chain under refinement.
      * `eventuallyPeriodic_iff_adicRational` (C415): a column is eventually periodic iff one relation
        `q·x_n ≡ r (mod 2^n)` with `q ≠ 0` holds on every layer. The proof runs through the *carry*
        `(r − q·x_n)/2^n`, which eventually stays in `[−|q|, |q|]` for odd `q` (`rational_carry_bounded`):
        a finite-state machine, hence periodic.
      * `problem1_iff_not_adicRational`, `problem1_iff_padic_irrational` (C415): **Problem 1 is
        equivalent to the 2-adic integer `∑ centerCol(k)·2^k ∈ ℤ₂` being irrational.**
        `layers_of_padic_eq`: a relation in `ℤ₂` holds on every layer.
      * `centerCol_not_small_rational`, `centerCol_padic_ne_small` (C416, CERT): read on layer 256, the
        centre column is not `r/q` for any `1 ≤ |q| ≤ 2^16`, `|r| ≤ 2^200`.
      * **The layer ↔ period dictionary** (`AdicPeriod.lean`, FORMAL; C420). `period_of_dvd`: if every
        layer satisfies `q·x_n ≡ r`, `q ∣ 2^p − 1` (`p ≥ 1`) and `2^N > |r|`, then `a(n+p) = a(n)` for all
        `n ≥ N + p` — **the denominator fixes the period (the order of 2 mod `q`), the numerator bounds the
        preperiod (`log₂|r| + 1 + p`).** Conversely (`periodic_presentation`) period `p` from `N` gives
        `q = 2^p − 1` and `|r| < 2^(N+p)`. The proof is integer arithmetic on the carry over `p` layers,
        `t(n) = q·B(n) + 2^p·t(n+p)` (`carry_block`), scaled by `(2^p − 1)/q`.
      * `centerCol_not_fraction_of_period_cert`, `centerCol_not_fraction_500` (C421, CERT): the
        dictionary turns the old period certificate (`no_small_eventual_period`) into a fraction
        certificate — the centre column is not `r/q` for any `q ∣ 2^p − 1` with `1 ≤ p ≤ 500` (for
        instance `q = 2^500 − 1`) and `|r| < 2^500`; with the preperiod-30000 certificate (C410), none with
        `q ∣ 2^p − 1`, `p ≤ 64`, `|r| < 2^29936` (`centerCol_not_fraction_64`).
      * Reading for the GLM: each layer is an observer with a finite window; a rational column is one
        whose layer-to-layer carry lives in a bounded set. Problem 1 says the carry of the centre column
        is unbounded for every presentation `r/q`. This is a reformulation, not progress on P1.

      **The arrow, read on the tower.** The carry `t(n)` is the observer's state between layers: it
      moves one layer at a time in one direction (`2·t(n+1) = t(n) − q·a(n)`), and for a rational column
      it falls into `[−|q|, |q|]` and then repeats. This is one exact sense in which the run "converges
      towards" something: it does so iff the column is rational, i.e. iff Problem 1 fails.

      **`M₂₄` census** (`MathieuCensus.lean`, `MathieuCensusOrbits.lean`, CERT; To Do 31 done).
      * A forest certificate tool with byte tables, each table proved equal to its specification.
      * `census_49` (C417): the 49 representatives `reps49` reach every one of the `2^24` patterns, and no
        pattern is reached from two of them.
      * For 8–11 marked cells: 3 orbits each; for 12: 5 orbits; each with a test and a size
        (`orbit_…`, `card_…`; `sizes_sum`: sizes add to `C(24, k)`). Complements: `reach_compl` (C418).

      **MOG subgroups** (`MathieuMOG.lean`, CERT; To Do 33 partly done; C419).
      * Generators of the octad, sextet and trio stabilisers, each a code automorphism (`…_preserve`).
      * Octad stabiliser on the octads: 4 orbits by overlap 8/0/4/2, sizes 1/30/280/448
        (`octStab_octads_meet`, `octStab_octads_sizes`). Sextet: 15/384/360 (`sexStab_octads`). Trio:
        3/84/672 (`trioStab_octads`).
      * Not proved: that these generate the *whole* stabilisers, and `|M₂₄| = 244823040`.

      **Status.** No prize problem is closed.
