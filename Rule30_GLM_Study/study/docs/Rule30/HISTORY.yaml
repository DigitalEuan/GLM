  - heading: "Round 23: the power-series ladder (your concept file) and the exact counting law"
    anchor: round-23-the-power-series-ladder-your-concept-file-and-the-exact-counting-law
    body: |
      **Input.** The concept file `Rule30PowerSeriesLadder.lean` (Round 21 draft, written outside Lean).
      It proposed a ladder of characterisations of Problem 1 over `GF(2)` (rational ⊂ 2-automatic ⊂ all
      sequences), certificates by linear complexity and Hankel determinants, a Morse–Hedlund form, and a
      counting law for periodic runs with a "barrier entropy" corollary. The draft could not be compiled
      as written (several definitions were placeholders such as `lcProfileImpl`, `detGF2`,
      `RunCountImpl`), so every notion was re-defined from scratch and each target was proved, corrected
      or refuted. Nothing in this round settles a prize problem.

      ### What is proved (FORMAL, for every Boolean sequence)

      * **Automaticity rung** (`PowerSeriesLadder.lean`). `TwoKernel a` = all decimations
        `n ↦ a(2ᵏn + r)`; `IsTwoAutomatic a` = finite 2-kernel. `isTwoAutomatic_of_eventuallyPeriodic`;
        hence **`problem1_of_centreNotTwoAutomatic`** (`CentreNotTwoAutomatic → Problem1`).
        `not_isTwoAutomatic_of_kernelPath` is the draft's kernel criterion; `card_le_encard_twoKernel`
        turns pairwise distinct decimations into a lower bound on the kernel.
      * **Linear complexity** `lcProfile a m` (least order of a `GF(2)` recurrence generating
        `a(0..m−1)`; a specification, not Berlekamp–Massey). **`eventuallyPeriodic_iff_lcBounded`**, so
        **`problem1_iff_lcUnbounded`**: Problem 1 says exactly that `A(z) = ∑ a(n)zⁿ` is not a rational
        function over `GF(2)`. `noSmallPeriodicity_of_lcProfile` is the draft's certificate interface
        (`N ≤ L(m)` rules out `τ + p < N`), proved for every `N`, `m`.
      * **Hankel determinants.** `hankel_det_eq_zero_of_periodic`, `hankel_det_eq_zero_of_fits`,
        **`le_lcProfile_of_hankel_det`** (`det H_N ≠ 0 ⇒ L(m) ≥ N` for `m ≥ 2N − 1`) and
        `problem1_of_hankel_infinitely_often`. The converse (Kronecker's theorem) is stated as
        `Problem1IffHankelInfinitelyOften` and **not** proved.
      * **Morse–Hedlund.** `complexity a n` = number of distinct length-`n` blocks of the *infinite*
        sequence. **`eventuallyPeriodic_iff_complexity_le`** and **`problem1_iff_complexity`**:
        `Problem1 ↔ ∀ n, n + 1 ≤ complexity centerCol n`.
      * **Counting law** (`RunCountLaw.lean`). `RunCount p d T` counts the left-white contexts (black edge
        at 0, free cells `x 1 … x (d+T)`) keeping the column at distance `d` `p`-periodic through time `T`.
        **`runCount_law`**: `RunCount p d T = 2^(d+p−1)` for `p − 1 ≤ T < d`, every `p ≥ 1`; for `p = 2`,
        `2^(d+1)` for `1 ≤ T < d` (`runCount_two_law`). The proof is the two-sided version of Round 22's
        `survivors_card`: Rule 30 is left-permutive (`evolve_flip_left`), the test at time `t < d` reads
        the free cell `d − t` by `xor`, no earlier test reads it, and flipping it is an involution that
        toggles only that test (`card_tests_succ`).

      ### Corrections to the draft (error E9: "finite data inside an infinite characterisation")

      * The complexity form with blocks counted in the prefix of length `2²²` is **equivalent to
        `¬ Problem1`** (`draftComplexityForm_iff`): for `n` larger than the prefix there are no blocks at
        all. The correct statement uses the infinite sequence (`problem1_iff_complexity`).
      * The counting law with the endpoint `T = d` is **false**: `RunCount 2 3 3 = 20 ≠ 16`,
        `RunCount 2 4 4 = 20 ≠ 32` (`runCountTwoLawDraft_false`). At `T = d` the cell the new test would
        read is the black edge, which is not free; this is the same "edge" as in Round 22.
      * The deficit monotonicity `DeficitIncreasingAfterD` is **false** (`deficitIncreasingAfterD_false`):
        for `d = 1` the counts at `T = 3, 4` are `1, 2`, so the deficit stays at `4`. After the edge the
        counts are irregular (e.g. `d = 7`: `256, 286, 483, 172, 0` for `T = 6 … 10`; `scripts/run_count.py`).

      ### Certificates (CERT, `PowerSeriesLadderData.lean`)

      * **`hankel_centerCol_det_ne_zero`**: `det (hankel centerCol 10000) ≠ 0` over `GF(2)`. Checked by
        `hankel_det_ne_zero_of_check`: an unverified Gauss–Jordan elimination proposes an inverse and a
        verified bitwise checker confirms `B · H = I`.
      * **`lcProfile_centerCol_19999`**: the first 19999 centre bits have linear complexity `≥ 10000`
        (as large as a typical random sequence): no `GF(2)` linear recurrence of order `< 10000`, i.e. no
        rational function with denominator degree `< 10000`, generates them.
      * **`no_eventual_period_below_10000`**: no eventual period `p` from time `τ` with `τ + p < 10000`
        (previously `p ≤ 1000`, `τ ≤ 1000`, `no_small_eventual_period`).
      * `complexity_centerCol_eq`: all `2ⁿ` words of length `n ≤ 10` occur in the centre column.
      * `twoKernel_centerCol_ge`: the 1023 decimations with `k ≤ 9` are pairwise distinct, so the
        2-kernel has at least 1023 elements (an automaton reading `n` in base 2 needs `≥ 1023` states).
      * `frontier_powerSeries` collects the round.

      The draft's larger numbers (`LC(2²²) = 2²¹`, `p(n) = 2ⁿ` for `n ≤ 17`, kernel growth to depth 16)
      remain `EMP` (they were computed outside Lean).

      ### The perspective reading

      The counting law gives the observer `Y` on the column an exact rate in the two-sided picture too:
      while its left-facing view has not reached the black edge (`t < d`), each periodicity test it makes
      is a fresh fair coin, so after `T` steps the evidence against "this column is `p`-periodic" is
      exactly `T + 1 − p` bits. At the edge (`T = d`) the coin stops being fresh and the count jumps off
      the law (`20` instead of `16`). Read as an arrow: the direction in which the observer's fresh
      information comes from is the left (the xor side of Rule 30), and the edge is where that arrow
      runs out.

      ### Where the prize problems stand after Round 23

      All three are still open. Problem 1 has two new proved equivalent forms (unbounded linear
      complexity, `problem1_iff_lcUnbounded`; `p(n) ≥ n + 1` for every `n`, `problem1_iff_complexity`) and
      two new proved sufficient targets (`CentreNotTwoAutomatic`, infinitely many non-zero Hankel
      determinants). The finite evidence is stronger (`τ + p < 10000`), and, by
      `no_finite_certificate_problem1`, still cannot decide the problem.
    subsections:
      - What is proved (FORMAL, for every Boolean sequence)
      - "Corrections to the draft (error E9: \"finite data inside an infinite characterisation\")"
      - Certificates (CERT, `PowerSeriesLadderData.lean`)
      - The perspective reading
      - Where the prize problems stand after Round 23
