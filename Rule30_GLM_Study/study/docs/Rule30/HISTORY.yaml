  - heading: "Round 45: the Hypothesis Engine gate loop made to work (engine v17)"
    anchor: round-45-the-hypothesis-engine-gate-loop-made-to-work-engine-v17
    body: |
      The owner supplied `hypothesis_engine_v15.py` (TCT as gate inside the loop, transitive rollback)
      and `v16_implementation_report.md` (five layer-aware guards, clean dialogue). They asked for the
      engine to be fixed and built up into the full Master Equation structure.

      **Study folder `rule30_round45/`.**
      * `hypothesis_engine_v17.py` and `glm_layers.py`: engine v17.
      * `run_round45.py`: scored comparison of v15, v16 and v17.
      * `test_round45.py`: 28 checks.
      * `V17_REPORT.md`: the 12 defects found in v15/v16, what v17 does, the results and the caveats.

      **Defects found in v15/v16.**
      * The layer labels are size cut-offs.
      * "Explained at any layer" is vacuous on empty layers.
      * Layered coincidence mixes two samples.
      * Rollback ignores edge type and only fires on guard refutations.
      * Analogies are spoken as surviving.
      * H36's comparison is inverted.
      * H19 is spoken without escalation.
      * The seed-transport test uses seeds 1, 11 and 101, which give the same centre column.
      * H32 and H33 are implications refuted in Lean.
      * In quick mode, H20 is "refuted" when the data runs out.

      **Scores.** On the 24 statements whose answer was fixed in Round 44:

      | engine | right | wrong | overclaim | abstain |
      |---|---|---|---|---|
      | v16 | 4 | 5 | 15 | 0 |
      | v17 without the ledger | 20 | 0 | 0 | 4 |
      | v17 | 24 | 0 | 0 | 0 |

      The ledger and the ground truth share sources, and the claim classes were written by reading
      the same statements; see the caveats in the report.

      **Lean.**
      * `../HypothesisEngine/GateLoop.lean` (C406–C409, FORMAL):
        * layered reads on nested domains;
        * escalate before assert, and the arrow (`reads_sorted`);
        * typed transitive rollback as a least fixpoint, order independent, sound, with the engine's
          loop terminating at it;
        * soundness of the gate cascade;
        * v16's "survived, so true" is not a sound gate.
      * `../HypothesisEngine/GateLoopData.lean` (C410, CERT): no eventual period `p ≤ 64` with
        preperiod `≤ 30000`. This is v17's full-range H16.

      **Status.** No prize problem is closed.
