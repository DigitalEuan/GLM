  - heading: "Round 27: post-edge witnesses, ranking functions and width reduction"
    anchor: round-27-post-edge-witnesses-ranking-functions-and-width-reduction
    body: |
      **Input.** (1) Continue from `AUDIT.md`. (2) Outside feedback: concentrate on the period-2
      half-line machine; collect witnesses, not only counts; specify the finite-state transition before
      using graphs; try a ranking function, width induction and individual termination, not only
      population contraction; declare a small family of progress measures and refute it on small cases;
      make the GLM's candidate generation measurable; soften two audit claims. Nothing in this round
      settles a prize problem; the period-2 rung is still open.

      ### A. The transition specification (`PostEdgeSpec.lean`, FORMAL, standard axioms)

      The feedback proposed a graph on "the entire driven state and drive phase" and warned that the
      state must determine the next step. Proved, for every drive:

      * the state of a code of length `d` has length exactly `d + t` at time `t`
        (`halfStateD_width`): Rule 30 is left-permutive, so the far-left black cell always makes a new
        black cell to its left;
      * hence **no state ever repeats** (`halfStateD_strictMono`), even paired with the phase
        (`halfStateD_phase_ne`). The reachable graph of full states is an infinite simple path, so
        "no reachable cycle" certifies nothing and a cycle can never be found;
      * **no fixed window is closed** (`window_not_closed`): two states agreeing on their `w` cells next
        to the column can have different next windows; what is true is that `w + 1` cells determine `w`
        cells one step later (`halfStep_mod`). The sound finite object is the shrinking window, i.e. the
        prefix tree already used by the prefix search;
      * the cell next to the column at times `0 … n−1` determines the first `n` code bits
        (`colHistory_determines`): a finite quotient that keeps the whole column history is no quotient.
        A useful one must forget data, e.g. the untested odd times.

      **Width reduction in its sound form.** The cells beyond an inner column `c − k` form the same kind
      of machine, driven by that column (`halfStateD_shiftRight`), and that inner machine never fails its
      test (`inner_never_fails`, a Rule 30 identity). So if the inner column follows the alternating
      drive for `T` steps, the inner code survives `T` steps (`inner_alternation_bound`); an inner column
      cannot alternate longer than the inner code lives (`innerCol_breaks`).

      ### B. Four routes, each proved to reach the rung (`ProofRoutes.lean`, FORMAL)

      | Route | Needed lemma | Lean | Status after this round |
      |---|---|---|---|
      | individual termination | every surviving trajectory eventually fails | `WordDies (driveN 2 1)` | the target itself (`halfLineDies_two_iff`) |
      | ranking | a bounded measure drops over every surviving window | `Ranking`, `wordDies_of_ranking` | 8 declared measures refuted |
      | population | survivor counts obey a uniform decreasing bound | `AmortizedHalving`, `halfLineDies_of_amortized` | `(4, 1)` survives (to `d = 12` in Lean) |
      | width induction | a wider code dies soon after a narrower one | `WidthStep`, `wordDies_of_widthStep` | sizes `≤ 17` refuted |

      A ranking that may use the time and the width freely encodes any run bound (e.g. `B d − t`), so it
      is informative only when the measure is local to the state. Likewise a `WidthStep b` is equivalent
      to `Lmax(d+2) ≤ Lmax(d) + b` and implies a linear run bound; it is a different route, not a
      stronger statement.

      ### C. Experiments, with certificates (`ProofRoutesData.lean`, CERT; scripts EMP)

      **Experiment A — witnesses** (`scripts/post_edge_witnesses.py`, output in
      `scripts/post_edge_witnesses_output.txt`; both words, `d ≤ 22`): all longest witnesses, their edge
      states, populations after the edge, plateaus and the events ending them, and inner alternating
      columns. Findings:

      * `Lmax(d)` for the word `10` is certified exactly for `d ≤ 32` (`lmaxTwo_spec`): 2, 6, 4, 6, 8,
        10, 12, 10, 18, 14, 30, 16, 28, 32, 26, 30, 30, 30, 38, 30, 36, 40, 40, 42, 44, 44, 48, 48, 48,
        52, 66, 54. It is not monotone and its jumps are irregular.
      * Longest witnesses often coincide as trajectories: at `d = 11` both witnesses have the same state
        from time 2 (`witnesses_merge`); at `d = 22` six witnesses share one edge state. Lists of
        witnesses contain fewer mechanisms than codes.
      * **A shared inner survivor** (`shared_inner_survivor`): the longest survivors of lengths 11 and
        19 carry, during times 6–19, an inner column alternating at odd times, at depths 6 and 14, behind
        which sits the **same** inner code `1601`, which itself lives exactly 13 steps under the word
        `01`. The same inner code appears in longest witnesses of lengths 11, 13, 15, 19, 21 (word `10`)
        and 12, 14, 16, 20 (word `01`) (EMP, `d ≤ 22`). This
        is the concrete form of "a wide survivor contains a narrower survivor"; it explains part of the
        survival, not the death, and is not yet a uniform statement.

      **Experiment B — progress measures** (`scripts/progress_measures.py`): the declared family is
      width, black cells, adjacent changes, black run at the column, first white pair, white cells,
      black cells in the original window, alternating block at the column (`rankPot 0…7`). Each is
      refuted for every window `1 ≤ c ≤ 20` (`no_declared_ranking`), mostly at `d ≤ 11`. A window `c`
      longer than every observed post-edge survival cannot be refuted by data at all; such "survivors"
      are vacuous and get no credit.

      **Experiment C — width steps**: every code of length 29 fails by time 48, but one of length 31
      survives to 66, so `WidthStep (driveN 2 1) b` fails for all `b ≤ 17` (`not_widthStep_two`). EMP to
      `d = 44`: the needed step size is 18 (word `10`) and 12 (word `01`).

      ### D. The open statement

      `Round27Open := AmortizedHalving 2 4 1` is the one uniform candidate that survives all tests. It
      implies the period-2 rung and is **OPEN**; the smallest unresolved case is `d = 13` (certified for
      `d ≤ 12`). `frontier_round27` collects the round.

      ### E. Measuring the GLM's candidate generation (`scripts/candidate_benchmark.py`, GLM prototype)

      Every candidate record carries statement, quantifiers, origin (supplied / generated / repaired /
      analogy), target implication (a Lean theorem name), smallest counterexample, tested range, formal
      status and cost. The grammar is frozen (LIN, AMORT, WS, RANK); enumeration and
      counterexample-guided repair get the same oracle and the same budget of 60 calls; the training
      word is `10` and the held-out words are `100`, `110`, `1000`, `1100`, `1110`. At `d ≤ 18`
      (`scripts/candidate_benchmark_output.txt`): enumeration rejects 11 and keeps 49 (5 non-dominated,
      2 of them supplied by the developers); repair rejects 46 and keeps 14 (4 non-dominated, 3 survivors
      of repaired origin), reaching `WS 16`, but none of its survivors transfers to all held-out words.
      GLM-guided selection has a plug-in (`--glm proposals.json`) and was not run here. No candidate is
      proved by the harness; the formal status of each comes only from Lean.

      ### F. Two audit claims softened (`AUDIT.md` §5.4)

      "A proof must work at the degree-one level" now reads: high-degree facts alone do not give the seed
      result; a proof may still connect them to the seed through an additional theorem. "A proof must
      survive the mirror" now reads: the truth must transport correctly under the mirror; a proof may use
      Rule 30's left-permutive orientation and then transport to Rule 86. A blocked implication blocks
      that implication only.
    subsections:
      - A. The transition specification (`PostEdgeSpec.lean`, FORMAL, standard axioms)
      - B. Four routes, each proved to reach the rung (`ProofRoutes.lean`, FORMAL)
