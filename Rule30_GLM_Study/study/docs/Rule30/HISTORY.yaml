  - heading: "Round 39: the engine pushed further — white diagonals never stop; the engine off Rule 30"
    anchor: round-39-the-engine-pushed-further-white-diagonals-never-stop-the-engine-off-rule-30
    body: |
      **Brief.** "Push the hypothesis engine more and see if we can generate some theories to test and
      get closer to solving the Rule 30 questions. Show tests of the hypothesis engine on other puzzles
      and general reasoning; it may help the GLM through bottlenecks in other investigations." Guides:
      `HYPOTHESIS_ENGINE.md` §7–9, `../HypothesisEngine/README.md`.

      **Core v6** (study folder `rule30_round39/`). New steps: residue miner, closed-form miner
      (polynomial, linear recurrence, templates), junction resolution by a separating observation (and
      `implied` for ties with no possible separation), evidence classes FINITE / Pi1 / Pi2.

      **Theories generated on Rule 30, and what came of them.**
      * White-diagonal criterion. There were four tied laws on `D < 20000`. Two were refuted at the even
        white diagonal 53207, one was implied, and the remaining one was proved for every `D` and every
        left-edge row (`WhiteDiagonals.lean`, C362–C363).
      * Regime map. Between white diagonals, the patterns evolve by an injective map (left permutivity).
        The exhaustive statistics for `Q ≤ 16` refuted the random-permutation model (`Q = 8`) and
        "doubling begets doubling" (`Q = 16`) (C368).
      * Injectivity plus pigeonhole gave:
        * a finite check closes a regime;
        * finitely many white diagonals would make the left side periodic in `D`;
        * **there is no last white diagonal**, so Rule 30 has infinitely many eventually white left
          diagonals;
        * unbounded periods ⟺ odd-parity white diagonals for every `2^m` (C364–C367).
      * Law-driven scan (C program). The next white diagonal after 87866 is 1,420,878,968 (even). Past
        it one transient bit decides between a first period-64 diagonal at 2,107,985,255 and further even
        white diagonals (EMP, C369–C370; sorry-guarded in `r39_conjectures.lean.txt`).

      **The engine off Rule 30** (C371–C373). Eight problems with known answers: Euler's polynomial,
      Fermat numbers, two squares, circle regions, Josephus, Collatz, the gcd trap and a 16-bit
      midpoint bug.
      * 9 false statements were caught after passing development data.
      * The final law or form was correct on 8/8, and nothing false was asserted beyond its range.
      * Lean checks every verdict: `../HypothesisEngine/Benchmarks.lean` (FORMAL) and
        `BenchmarksData.lean` (CERT, `bv_decide`).
      * The gcd trap survives all sampling; the resultant reader found its 52-digit counterexample.

      **Corrections.**
      * AUDIT's Round 38 line said "bounded periods force finitely many white diagonals and
        conversely", and To Do 45 called the question "equivalent to infinitely many white diagonals".
        Both overstated: only "finitely many ⇒ bounded" was proved. Round 39 proves infinitely many white
        diagonals while unboundedness stays open. Both entries are corrected.

      To Do 44 partly done again; To Do 45 sharpened; To Do 46 added (the open bit). No prize problem
      is settled.
