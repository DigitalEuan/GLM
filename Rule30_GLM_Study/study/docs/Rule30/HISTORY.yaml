  - heading: "Round 11: the seed's right edge, the off-centre observer, the moving frame"
    anchor: round-11-the-seeds-right-edge-the-off-centre-observer-the-moving-frame
    body: |
      **The three prize problems remain open.** New results, all `FORMAL` unless marked otherwise:

      ### A. The seed's right edge (`RightDiagonalBalance.lean`)

      * `runningXor_periodic_or_antiPeriodic`, `rdiag_periodic_or_antiPeriodic`: if diagonals `D − 1`
        and `D − 2` are `Q`-periodic, diagonal `D` is `Q`-periodic or **anti-periodic**
        (`rdiag D (t + Q) = ! rdiag D t` for all `t`).
      * `wobble_antiPeriodic_bound`, `antiPeriodic_balanced`, `antiPeriodic_hasFrequencyHalf`: an
        anti-periodic sequence has `|D(N)| ≤ Q` for every `N`, exactly `Q` ones in its first `2Q` terms,
        and frequency `1/2`.
      * `exists_antiPeriodic_rdiag`, `infinitely_many_balanced_rdiag`: **for every `D₀` some right
        diagonal `D ≥ D₀` is anti-periodic**, so infinitely many right diagonals of the seed pattern are
        in the bounded-wobble regime with frequency exactly `1/2`.  (Proof: otherwise all diagonals
        from `D₀` on would share one period, against `rdiag_period_unbounded`.)
      * `rdiag_seven_antiPeriodic`, `rdiag_seven_bounded`: diagonal 7 is anti-periodic with half-period
        16, so `|D(N)| ≤ 16` for all `N`.
      * `wobble_rdiag_five`, `rdiag_five_not_half`: **not all diagonals are balanced** — diagonal 5 has
        `D(32k) = −8k`, frequency `3/8`.
      * `EMP` (`rule30_round11/r11_diagonals.c`): to `D = 39` the anti-periodic diagonals are
        `1, 2, 3, 4, 6, 7, 9, 15, 16, 24, 25, 27, 29, 34, 36, 37, 39`; `8, 10, 17, 18` are balanced
        without being anti-periodic; the rest are unbalanced.  Least periods to `D = 39` are
        `1, 2, 2, 4, 8, 8, 16, 32, 32, 64, 64, 64, 64, 64, 64, 128, 256, …, 65536` (far below `2^D`).

      What this does **not** do: the centre column `a(t) = rdiag t t` crosses every diagonal once, so
      balance on diagonals does not decide Problem 2.  The proposed "right-edge zero boundary forces
      `D(N) = o(N)`" is false as stated: `exists_row_with_biased_column` (Round 4) gives a right-white
      row whose centre column has frequency `1/3`.

      ### B. The off-centre and moving observers (`ChiralLeak.lean`)

      * `chiralGap c N = D_c(N) − D_{−c}(N)`; `wobble_mirror_column`,
        `chiralGap_eq_thirty_sub_eightySix`: it equals the wobble of wheel 30 minus that of wheel 86,
        both at column `c`.  `chiralGap_centre`: 0 at the centre for every `N`; `chiralGap_neg`: odd in
        `c`.
      * `chiralGap_first`: the gap is first non-zero at `N = 3, 6, 5, 9, 7` for `c = 1, …, 5`.
        (`EMP`: to `N = 10⁶` it stays within `±886 … ±2918`, random-walk size, no drift.)
      * `rdiag_moving_frame`: **the observer riding the right edge sees wheel 86 (the mirror image of
        30) with its frame moving one cell per step**: `rdiag D (t+1) = rule86(rdiag (D−2) t,
        rdiag (D−1) t, rdiag D t)`.  A perspective is an orientation *and* a velocity.
      * `offCentre_pair_problem1`: of the observers at columns `0` and `c ≠ 0`, at least one sees a
        sequence that is not eventually periodic.

      ### C. The parity count

      Already settled in Round 8 for **every** `n ≥ 2` (`whiteDiagonalCount_odd`,
      `topMonomialConjecture_holds`); the GF(2) recurrence behind it is `triQ_succ`.

      ### GLM side

      `rule30_round11/` (Python): the GLM command line now runs (`GLM.py -q`, `--ask`, `tool induce`,
      `tool claim`, `--verify-tct`) with your Round 11 attachments plus four labelled stand-ins;
      carriers `r30_seed_right_edge_zero`, `r30_rdiag_D`, `r30_rdiag_balanced`,
      `r30_wobble_D_N_column_c`, `r30_chiral_gap_c_N`, `r30_chiral_gap_first_c`,
      `r30_white_diagonal_parity`; reports `report wheel diagonals / chirality / claims`; the
      moving-frame induction family; and `tool claim` with a 30-item benchmark (frame 23/23, held-out
      2/5 with every miss a refusal, out-of-frame 2/2).
