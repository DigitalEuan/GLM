  - heading: "Round 32: `M₂₄` orbits of seed patterns, and how much of `M₂₄` Rule 30 keeps"
    anchor: round-32-m-orbits-of-seed-patterns-and-how-much-of-m-rule-30-keeps
    body: |
      **Request.** The action of `M₂₄` (or its subgroups visible in the MOG) can be applied to any seed
      pattern to produce an orbit of symmetrically related binary lattices; use it to enumerate
      candidate defect arrangements that maximise combinatorial symmetry before mapping them back onto
      a geometric (diamond) supercell.

      **Set-up.** A seed pattern is a 24-bit word (a set of marked cells, "defects"). `M₂₄` is the
      automorphism group of the GLM's own Golay code (the twelve rows of `ShortcutNetworkData`,
      repeated in `MathieuOrbits.lean` so that the new files stand alone). `pmask σ x` moves cell `i` of
      `x` to cell `σ i`. The user-facing guide is `M24_ORBITS.md`.

      **Lean, exact (`MathieuOrbits.lean`, FORMAL, C304–C307).**
      * The action: `pmask` is XOR-linear, keeps the number of marked cells and composes
        (`pmask_xor`, `weight_pmask`, `pmask_mul`). The 12 generator rows decide membership of `M₂₄`
        in both directions (`preservesCode_iff_rows`), and the inverse of an automorphism is an
        automorphism (`PreservesCode.symm`, a counting argument).
      * The enumeration tool: `Reach gens x y` (words in the generators), `reach_invariant`,
        `reach_mem_closure`, and a checkable breadth-first orbit certificate (`certOK`,
        `certOK_reach`) for any seed and any generators.
      * **Only rotations commute with Rule 30** (`commutes_iff_rot`): a permutation of the 24 cells of
        the ring commutes with one Rule 30 step on every pattern exactly when it is a rotation.
        Reflections fail because Rule 30 is chiral (`reflect_not_commutes`). `transport_iterate`,
        `rot_transport`: a symmetry commuting with one step carries whole futures.
      * `shared_card_le_of_not_one`: once the one-cell turn is excluded, at most 12 permutations are
        both code automorphisms and Rule 30 symmetries (pigeonhole in `ℤ/24`).

      **Lean, certificates (`MathieuOrbitsData.lean`, `MathieuRule30Data.lean`, CERT, C308–C312).**
      * Two automorphisms `gM0`, `gM1` of the GLM code (`gens_preserve`). Their words act
        5-homogeneously (`orbit_weight_five`), so by classical group theory they generate `M₂₄` (cited,
        not re-proved).
      * Orbits, each proved equal to an explicit set: 1–5 cells one orbit each (`orbit_weight_one` …
        `orbit_weight_five`); the 759 octads (`orbit_octads`); the 2576 dodecads (`orbit_dodecads`);
        6 cells two orbits, inside an octad (21252) or not (113344) (`orbit_hexads_special`,
        `orbit_hexads_umbral`, `hexad_types_distinct`); 7 cells two orbits, 6072 and 340032
        (`orbit_heptads_special`, `orbit_heptads_umbral`).
      * **`no_rot_one`**: for every labelling of the ring by the code coordinates, the one-cell turn is
        not a code automorphism (`M₂₄` has no 24-cycle). Only 423 eight-cell patterns pass the test every
        octad of a rotation-invariant code would pass (`survivors_count`); there are 759 octads.
      * **`shared_card_le_twelve`**: for every labelling, at most 12 of the `24!` permutations are
        shared symmetries. **`shared_card_tau0`**: 12 is attained by an explicit labelling.
        `shared_card_glm`: in the GLM's own labelling exactly 2 (identity and the half-turn).
      * `octad_rule30_weights`: the 759 octads (one orbit) have one-step Rule 30 images of every weight
        from 6 to 21; `octad_futures_differ` gives two of them; `octad_cycles` certifies three octads that settle into repetitions of lengths dividing 5448, 102 and 185040. `single_cell_futures`: Wolfram's
        single-cell seed is the exception, because its `M₂₄` orbit is its rotation orbit.

      **EMP (`scripts/m24_search.py`, `scripts/m24_orbit_census.c`).** The deterministic searches
      that found `gM0`, `gM1` and `tau0`, and the full census: the 2²⁴ patterns fall into 49 orbits
      (the classical count), listed by number of cells with representatives and stabiliser orders
      `244823040 / size`. The most symmetric arrangement for 8 defects is an octad (stabiliser order
      322560), for 12 a dodecad (95040), for 6 a hexad inside an octad (11520). In the Rule 30 ring of
      24 cells the 759 octads reach three different cycles, of lengths 185040 (712 octads), 5448 (8)
      and 102 (39), after transients of 0 to 8963 steps (`scripts/m24_rule30_octads.c`,
      EMP; one representative of each is certified in `octad_cycles`).

      **What it means.** The `M₂₄` orbit is a sound and complete way to enumerate the combinatorial
      symmetry types of seed patterns, and the package now does it with checked certificates. But the
      symmetry does not carry over to Rule 30: at most 12 of `M₂₄`'s 244823040 elements can be Rule 30
      symmetries under any labelling, in the GLM's labelling only 2, and seeds in the same orbit have
      different futures. The same holds for any geometry: only the symmetries of the target (for
      example a diamond supercell's site permutations) that also lie in the laid-out `M₂₄` are carried
      across (`transport_iterate`). No prize problem is affected: `M₂₄` symmetry gives no route to P1,
      P2 or P3 by itself.
