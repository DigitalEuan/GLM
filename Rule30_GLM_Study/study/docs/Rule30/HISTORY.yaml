  - heading: Round 2 results
    anchor: round-2-results
    body: |
      * **Right-edge derivative formula** (`booleanDerivative_right_edge`):
        `∂a(n)(c)/∂x_{c+n} = ∏_{k<n} ¬a(k)(c+n−1−k)`. The rightmost variable matters exactly when
        the diagonal just inside the right edge of the light cone is all white. This explains the
        "spatial asymmetry" of Round 5: by translation invariance (`anfCoeff_evolve_shift`) every
        cell has the same degree, and the drop to `2n−2` at position `+1` only appears after the
        rightmost variable `x_{n+1}` is fixed to `0`.
      * **Counting form of the degree conjecture** (`anfCoeff_topMonomial_eq_count`,
        `topMonomialConjecture_iff`): `deg a(n)(0) = 2n−1` holds iff, for every `n ≥ 2`, an odd
        number of rows `T ⊆ [2−n, n−1]` produce an all-white diagonal `(k, n−1−k)`, `k < n`.
      * **ANF representation theorem** (`anf_representation`): the Möbius coefficients really
        are the ANF, so "degree" has its usual meaning.
      * **Adjacent-column theorem** (the result usually attributed to E. Jen, 1986), proved here for
        every row that is white far to the left and contains a black cell, using only cone
        separation. Without that hypothesis it fails (`periodic_columns_exist`).
