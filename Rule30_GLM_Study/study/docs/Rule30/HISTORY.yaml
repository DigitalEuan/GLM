  - heading: "Round 33: the observer's clock (test-count and halving laws), period 2 read sideways, the GLM grown to match"
    anchor: round-33-the-observers-clock-test-count-and-halving-laws-period-2-read-sideways-the-glm-grown-to-match
    body: |
      **Request.** Continue the To Do list efficiently. Keep using the GLM and its three columns
      (language / mathematics / script) to choose each step, and grow the GLM's abilities where the
      puzzle needs them.

      **How the round was steered.** The GLM was asked first (`rule30_round33/glm_consult_before_output.txt`).
      It still answered from its Round 28 vocabulary: alignment 0/8. Its Round 30 planner had
      proposed a *reclock* step: count the half-line machine's life in **tests** (black drive times,
      the moments when the column "reads" the cell next to it) instead of wall-clock steps. That is
      the observer `Y`'s proper time, which is the user's wobble/perspective idea made exact. The round
      took that step (To Do 30) and then followed the GLM's own `tool next` ranking: To Do 34 first,
      then To Do 29.

      **Lean, exact (`TestCountLaw.lean`, FORMAL, C313–C315).**
      * `testsBefore`, `FailsWithinTests`. Bridges to the time-based checks in both directions
        (`failsWithinTests_of_dDiesBy`, `not_failsWithinTests_of_dDiesBy`). A word of period `p` tests at
        least once every `p` steps (`testsBefore_mul_ge`).
      * **The uniform law is false** (`not_testCountBound`). No slack function of `d` alone works for
        all periods: a *steered* drive passes every check of a given code, and its cut to period
        `2m+1` lets the code `1` pass `m` tests. So a per-period slack needs `c ≥ m − 1`
        (`testCountLinear_slack_ge`).
      * The per-period law `TestCountLinear p c` gives `HalfLineDies p` and `HalfLineLinear p p (p·c)`.
        For every period it gives Problem 1 (`problem1_of_testCountLinear`). Period 1 holds with slack 2
        (`testCountLinear_one`).

      **Lean, certificates (`TestCountLawData.lean`, CERT, C316, C323).** On `d ≤ 22` the least slack is
      exactly 5, 8, 5 for periods 2, 3, 4. Each slack one smaller is refuted *for all d* by a single
      code (`frontier_round33`). **Correction found within the round:** for period 4 the range
      `d ≤ 22` is too short. The code `974520100` of length 30 passes the first 36 tests of the word
      `0111` (`not_testCountLinear_four_six`), so period 4 needs slack at least 7. The GLM's reclock
      Occam check had already flagged the period-4 slack as unstable (it fails later at 12 of 13
      training ranges).

      **Lean, halving (`TestHalving.lean` FORMAL C321; `TestHalvingData.lean` CERT C322).** To Do 34:
      the counting form "after `n` tests at most `2^(d−1+e)/2^n` codes of length `d` are alive"
      (`TestHalving p e`). It gives the test-count law with the same constant
      (`testCountLinear_of_testHalving`), and for every period it gives Problem 1. The bound is free
      for `n ≤ e`, and it follows from `n = d + e` for larger `n`. Certified: excess 6 for every
      period-2 word on `d ≤ 18` and every period-4 word on `d ≤ 16`. Excess 5 is false for period 2,
      and excess 6 is false for period 4 (by the code of length 30).

      **Lean, sideways (`SidewaysPeriodTwo.lean`, FORMAL, C318).** To Do 29, partly. Under the drive
      `10`, columns 2–5 of the reconstruction are given in closed form in the free bits, and a survivor
      has bit 0 black, bit 2 = not bit 1 and bit 4 = bit 2. As exact GF(2) polynomials the columns
      grow in degree from column 4 on (C319, EMP).

      **EMP (C317, C324).** `scripts/word_lifetimes33.c` gives exact longest lives: every word of
      period ≤ 4 to `d = 32`, the words 1, 10, 100, 110 to `d = 44`, and periods 5–8 to `d = 30`. The
      per-period maximum of tests − `d` is 2, 5, 8, 7, 4, 7, 8, 11. `scripts/test_halving34.c` gives
      exact halving excesses 2, 6, 11, 6 for periods 1–4 on `d ≤ 24`.

      **GLM (C320, `rule30_round33/`).**
      * The theorem wheel now covers Round 33.
      * It has one new inference rule: an `All` statement gives each period instance. This was found
        because the wheel could not derive `HalfLineDiesSideways => HalfLineDies2`.
      * `tool discuss` has a lens reader.
      * `tool clock` runs the machine on both clocks in three columns. It flags codes beyond the
        certified range as refutation candidates. This is how the period-4 code was presented.
      * `tool next` ranks the To Do list. After this round it picks To Do 35: does period 4 have a
        finite slack at all?
      * Consultation alignment is 9/9 on the corrected development set. One frozen expectation was
        wrong: `TestCountLinear2 => P1` must be *refused*. The Round 28 benchmark is unchanged.

      **What it means.** On the observer's clock the half-line machine has a clean shape: it dies after
      about `d` reads of the cell next to the column, whatever the word. But the excess over `d` is
      not uniform across periods (FORMAL), and even within one period a short range can understate
      it (period 4). Halving is a counting form that would give the rung, and for period 2 it holds
      with excess 6 as far as checked. No prize problem is settled. P1, P2 and P3 remain open.
