  - heading: "Round 49: the tidy-up — the journey written up, the package prepared for the GLM"
    anchor: round-49-the-tidy-up-the-journey-written-up-the-package-prepared-for-the-glm
    body: |
      **Request.** Tidy the project up: one document that records the journey and keeps the best of the
      findings, a package that is easy to navigate and to continue, an answer to whether it can be merged
      into the GLM repository, and preparation for the GLM's next project, which turns every study
      document into a YAML file.

      **Documents.** `RULE30_STUDY.md` (top of the project, in the GLM's study format) is the one document
      to read first: the journey of Rounds 1–49, the best findings, the map of the package, the merge,
      the YAML preparation and the open questions. `MERGE_INTO_GLM.md` is the practical merge guide. The
      top-level `README.md` is now a short front door; its round summaries (Rounds 28–48) are kept,
      unchanged, in Appendix D below. Every Markdown document of the package now opens with a tier-0
      block (question, verdict, deciding figure, recomputed by), the format the GLM's corpus check
      requires of every document that is not archive.

      **Lean.** No new theorems and no changed statements. `Rule30Study.lean` is the single package root:
      it imports `Rule30`, `HypothesisEngine` and the six escalation modules directly, so it does not
      collide with the GLM's own `Escalation.lean`; `GLM.lean` now imports it. One docstring in
      `TopMonomial.lean` was reworded so that the GLM's hole counter, which greps the word, counts no
      hole.

      **Tools** (`tools/`, Python standard library only): `glm_study_yaml.py`, the study YAML
      parser/creator (Markdown ↔ YAML, lossless; `new`, `validate`, `index`, `query`); `build_study_yaml.py`,
      which regenerates the package's YAML copy in `study/`; `tier0_check.py`, the GLM's tier-0 contract;
      `lean_decls.py`, a declaration lister; and `merge_into_glm.py`, the merge itself (dry run by default).

      **Merge findings.** The GLM snapshot uses the same Lean toolchain, Mathlib commit and library name;
      no folder and no declaration clashes; the one file-name clash (`GLM/Escalation.lean`) is avoided.
      After a merge the GLM's build, `corpus --refresh`, `corpus --check` and `signoff --close` must be run
      once (`MERGE_INTO_GLM.md` §6).

      **Status.** No prize problem is closed.

      # Appendix D. The former top-level `README.md` (Rounds 28–48 summaries, kept as written)

      Until Round 48 the top-level `README.md` carried a paragraph for each round. In Round 49 it became a
      short front door, and the paragraphs moved here unchanged. Paths in them are relative to the
      project root.

      All three Wolfram Rule 30 prize problems (non-periodicity of the centre column, equal
      frequency of 0 and 1, and computing the n-th centre cell in less than O(n) work) remain
      **open**. The package proves many exact partial results in Lean, with no `sorry` and only the
      standard axioms; the frontier is stated as checked theorems in `Frontier.lean`.

      Round 28 added `LocalRuleInduction.lean` (namespace `GLM.LocalRule`): learning a local rule
      from examples on any grid with any neighbourhood reader — exact characterisations of when a
      learned table reproduces the examples, when an answer is determined, and when a clash refutes
      a reader. Its use in the GLM (a reader ladder for ARC-style puzzles) and the measured
      before/after benchmark are described in `AUDIT.md` ("What Round 28 added") and `HISTORY.md`
      Round 28.

      Round 29 added `PlanSearch.lean` (namespace `GLM.PlanSearch`): puzzles are solved by a
      **pipeline of steps** rather than one step. It proves what the GLM's stepwise planner guarantees
      when it is run over chains of grid steps: merged breadth-first search loses no plan; the planner
      answers only when every cheapest consistent chain agrees; it is correct when the truth is a
      cheapest explanation and can be wrong otherwise; and when chains disagree, the separating example
      refutes one of them. The GLM-side planner and its benchmarks are in the study folder
      `rule30_round29/` (held-out multi-step puzzles: 96 of 132 right, 0 wrong; stored ARC: 10 of 50
      right, 0 wrong; both measured, not proved). `InnerSurvivorData.lean` refutes the uniform
      inner-survivor form (To Do 22).

      Round 30 joined the open GLM items into **one pipeline** — plan (fitted middle steps, goal-shape
      pruning), ask (the deciding cell), gate (Occam check for few demonstrations), statements (the same
      planner over candidate Rule 30 statements). `Pipeline.lean` (namespace `GLM.Pipeline`) proves what
      each stage guarantees, including the honest negatives (`gate_can_drop_truth`);
      `PipelineData.lean` certifies the statement frontier the planner generates (30 sharp points,
      `frontier_round30`). The GLM side is the study folder `rule30_round30/` (`pipeline.py` runs it all;
      fresh held-out puzzles 56 → 96 of 132 right, 106 with at most five questions; measured, not
      proved). No prize problem is closed.

      Round 31 read the half-line machine **sideways** — the observer standing on the periodic column
      and reading outwards, using that Rule 30 can be solved for its left input. `SidewaysView.lean`
      proves that `HalfLineDies p` (the one-sided target whose truth for every `p` gives Problem 1) is
      exactly the statement that no admissible first column reconstructs a finite non-empty row
      (`halfLineDies_iff_sideways`), re-proves period 1 in one line (`halfLineDies_one_sideways`), and
      shows that rows with infinitely many black cells survive every drive forever, so finite-window
      quotients cannot prove the target (`infinite_row_survives`, To Do 20).
      `BarrierDiagonalsData.lean` certifies exact longest lives for five more drive words up to
      `d = 20` and answers To Do 3: the diagonal on which the longest life ends depends on the word
      (`barrier_depends_on_word`). All scripts now use exact integer/rational arithmetic only.
      No prize problem is closed.

      Round 34 followed the GLM's own pick (To Do 35: does period 4 have a finite observer-clock slack?).
      An exact search finds no period-4 word above slack 7 far beyond the old range, and Lean certifies
      that the least period-4 slack on `d ≤ 30` is exactly 7 (`frontier_round34`).
      `TestCountPeriods.lean` proves that per-period statements pass to divisors of the period
      (`testCountLinear_of_dvd`, `halfLineDies_of_dvd`) and refutations to multiples, and that starting
      the observer's clock one step later changes the slack by at most 2 (`testSlack_of_shift`, an exact
      form of the wobble-as-perspective idea). The GLM side (study folder `rule30_round34/`) adds
      `tool slack` and the divisor rule (fixed consultation 1/7 → 7/7). Guide: `TEST_COUNT.md`.
      No prize problem is closed.

      Round 38 rebuilt the owner's **Hypothesis Engine** (study folder `rule30_round38/`; guide
      `HYPOTHESIS_ENGINE.md`). It now proposes statements, refutes them on held-out exact data, mines
      laws from the counterexamples and predicts. On Rule 30 its proposals led to
      `LeftDiagonalPeriods.lean` (the period law of the left diagonals and seed-forgetting, proved for
      every diagonal) and `LeftDiagonalPeriodsData.lean` (two natural conjectures refuted, at `D = 400`
      and at the engine-predicted `D = 87867`; the centre column reads every left diagonal
      `20 ≤ D < 20000` inside its transient). No prize problem is closed.

      Round 39 pushed the engine further (study folder `rule30_round39/`; `HYPOTHESIS_ENGINE.md` §7–9).
      * On Rule 30 the engine proposed a new law: a left diagonal is eventually white iff the two
        diagonals outside it eventually coincide. Its regime statistics exposed a one-to-one map, and
        from these `WhiteDiagonals.lean` proves:
        * **Rule 30 has infinitely many eventually white left diagonals;**
        * the left-diagonal periods are unbounded iff odd-parity white diagonals keep occurring.
      * A law-driven scan found the next white left diagonal, 1,420,878,968 (measured, not proved).
      * Off Rule 30, the same core ran on eight problems with known answers. Every verdict is checked in
        `RequestProject/GLM/HypothesisEngine/`, the portable module for the GLM; its `README.md` includes
        a playbook for GLM bottlenecks.
      * No prize problem is closed.

      Round 40 took To Do 45 and 46 (the white left diagonals and their "open bit").
      `Transients.lean` proves that the settling times of the left diagonals grow at most linearly
      (`ldiag_perFrom_linear`), that at an **odd** white diagonal the open bit does not matter
      (`next_white_independent_of_odd_bit`), and that the doubling of the period is read two diagonals
      further out (`doubling_read_two_out`). `TransientsData.lean` certifies that every row with a left
      edge has the single cell's eventual left side, up to a time shift, through `D = 53207`
      (`left_edge_rows_agree_up_to_shift`). The hypothesis engine (study folder `rule30_round40/`,
      measured, not proved) found that the bit at the even white diagonals is the same for every row
      tried, validated a run-up method for computing it, and predicts that the period becomes 64 at
      diagonal `2107985255`. No prize problem is closed.

      Round 41 reviewed the owner's `hypothesis_engine_v10.py` (the "self-dialogue" engine). The idea is
      kept. The script itself cannot run in this project: its `hypothesis_engine_v8` module is missing.
      Most of its answers are fixed sentences, and two of them are mathematically wrong, as shown in
      Lean in `HypothesisEngine/DialogueChecks.lean`:
      * "every left diagonal is read inside its transient" does **not** imply Problem 1
        (`transient_read_does_not_imply_aperiodic`);
      * an aperiodic sequence **can** be computed by a two-state automaton reading `n` in binary
        (Thue–Morse: `aperiodic_but_automatic`), so Problem 1 alone would not settle Problem 3.

      The rebuilt dialogue (study folder `rule30_round41/`, measured, not proved) answers every question
      by running a check, or by citing a checked implication. Starting from diagonals `D < 400` only, it
      refuted the finite white list at 53207 and the period bounds at 400 and 87867 by itself. It then
      re-mined the two proved left-side laws, and showed that one tie between mined laws can never be
      split by data (`doubling_law_tie_unsplittable`). No prize problem is closed.

      Round 42 checked the owner's `hypothesis_engine_v13.py`. It is self-contained and runs, and its
      answer to its own question is right: TAX defects do not explain the period doublings. Five of
      its sentences are wrong or overstated and are settled in `HypothesisEngine/TaxChecks.lean` and
      `TaxChecksData.lean`. TAX conservation is the same for every `Y`, and it is the condition
      `3c² − 2c(a+b) + ab = 0`, not `c ∈ {0, a, b}`. Every period doubling is TAX-conserved, so "a defect
      is necessary for a jump" is false. Conservation also happens away from the white diagonals. The
      study folder `rule30_round42/` adds five portable reasoning guards (identity, explained-away, exact
      coincidence test, exclusivity, consistency) and builds v14 = v13 + guards. No prize problem is
      closed.

      Round 43 checked the owner's concept sketch `GLM_Escalation_Boundaries_Exploration.md` and
      rebuilt it as `RequestProject/GLM/Escalation/MASTER_VIEW.md`, anchored in the GLM layer stack
      that ships. Kept and proved: the state is (carrier, layer), the snap is the only place the layer
      changes, and escalation is a least-resolving-layer search. Corrected: the 2/4/8/144/256 modulus
      table (`8 ∣ 144`; mod 256 does not refine mod 144; no residue view can sit above an exact
      layer); the half-unit example (no floor-residue filter resolves it; the mod-4 step has an
      arithmetic error); "a fixed syndrome table is stable" (no complete lattice decoder is
      continuous); and "roll-back on TCT failure" (with a fixed target it deadlocks). New: the arrow,
      meaning escalation-only snaps give a monotone, eventually constant layer (the owner's
      Observer/direction idea at the layer level). Also new: a certificate of exactly where the GLM's
      Golay substrate decoder is ambiguous (a six-way tie on the 1,771 weight-4 cosets), and the
      parity law of Rule 30, `parity(next) = parity + #(11 pairs)` mod 2, which shows that Rule 30
      does not descend to the substrate layer. No prize problem is closed.

      Round 44 corrected the escalation sketch (`RequestProject/GLM/Escalation/GLM_Escalation_Boundaries_Exploration_CORRECTED.md`)
      and measured the owner's needs wheel (study folder `rule30_round44/`; Lean `NeedsWheel.lean`,
      `WheelChecksData.lean`, `Niemeier.lean`, `LeechResidue.lean`).

      Round 45 made the owner's Hypothesis Engine gate loop work: engine v17 (study folder
      `rule30_round45/`, report `V17_REPORT.md`). v17 runs a cascade of gates after every stage:
      claim class, recomputation, refutation audit, escalation before assertion, implication edges,
      and the Lean ledger. It reads guards at five layers with their real scales, and the verdict rule
      depends on the kind of claim. Rollback follows dependency edges only and is computed as a
      fixpoint. Every hypothesis carries its read trajectory (the arrow). It speaks only backed claims.
      On the 24 statements whose answer was fixed in Round 44:
      * v16 scores 4 right, 5 wrong and 15 overclaims;
      * v17 without the Lean ledger scores 20 right and 4 abstentions;
      * v17 scores 24 right.

      New Lean: `RequestProject/GLM/HypothesisEngine/GateLoop.lean` (FORMAL), the contract of the gate
      loop, covering layered reads, escalation and the arrow, typed rollback, and the soundness of the
      cascade. Also `GateLoopData.lean` (CERT): the centre column has no eventual period `p ≤ 64` with
      preperiod `≤ 30000`. Ledger rows C406–C410. No prize problem is closed.

      Round 46 added the wheel contract for engine v18 (`HypothesisEngine/Wheel.lean`): only the KNOWS
      ring makes assertions, a wheel turn of two sound wheels is sound, and every refutation in the
      conjecture loop lifts the bound strictly.

      Round 47 took up the owner's *layered, p-adic-like* idea. The layers `mod 2, 4, 8, …` of a column form
      a chain whose limit is the 2-adic integers (`Rule30/AdicTower.lean`):
      * a column is eventually periodic iff a single relation `q·x ≡ r` holds on every layer, so
        **Problem 1 is equivalent to the 2-adic irrationality of the centre column**
        (`problem1_iff_padic_irrational`);
      * the denominator fixes the period and the numerator bounds the preperiod
        (`Rule30/AdicPeriod.lean`, `period_of_dvd`, `periodic_presentation`);
      * through this dictionary the period certificates exclude explicit fractions: the centre column is
        not `r/q` for any `q ∣ 2^p − 1` with `p ≤ 64` and `|r| < 2^29936`, nor for `p ≤ 500` and
        `|r| < 2^500` (`Rule30/AdicTowerData.lean`, CERT).
      The same round completed the `M₂₄` census (all 49 orbits, `census_49`) and the MOG stabilisers
      (`Rule30/MathieuCensus*.lean`, `Rule30/MathieuMOG.lean`). No prize problem is closed.

      Round 48 took up the owner's observations about lines and white triangles
      (`Rule30/Triangles.lean`, `Rule30/TrianglesData.lean`; guide `Rule30/TRIANGLES.md`):
      * every white triangle is fixed by its top row and is born from a black run in the row before
        (`white_triangle`, `white_run_parent`);
      * a black line continues left-down when one cell is white, right-down only when two are; infinitely
        many left-down black lines never end, and no right-down line inside the pattern is endless
        (`ldiag_infinitely_many_black`, `rdiag_not_eventuallyBlack`);
      * the pattern prints from the right side in (`column_from_right`); the right edge repeats in bands of
        length `2^k`, each starting with a white triangle with top at least `k`, so triangles of every size
        sit one cell inside the right edge (`right_band_copy`, `arbitrarily_large_right_triangles`);
      * near the left edge the triangles stay small: after settling, no white run longer than `10` in the
        first 400 left diagonals and `16` in the first 20000 (CERT).
      No prize problem is closed.
