  - heading: "Round 8: the degree formula `deg a(n) = 2n − 1` is proved for all `n ≥ 2` (`TopMonomial.lean`)"
    anchor: round-8-the-degree-formula-deg-an-2n-1-is-proved-for-all-n-2-topmonomiallean
    body: |
      Feedback track A asked for an involution behind `Odd (whiteDiagonalCount n)`. One was found,
      and the whole argument is machine-checked for every `n ≥ 2` (no `sorry`; only the standard axioms
      `propext`, `Classical.choice`, `Quot.sound`). `TopMonomialConjecture`, open since Round 1, is now
      the theorem `topMonomialConjecture_holds`.

      | Lean name | Statement |
      |---|---|
      | `whiteDiagonalCount_odd` | `Odd (whiteDiagonalCount n)` for every `n ≥ 2` |
      | `topMonomialConjecture_holds` | `TopMonomialConjecture` |
      | `center_anfDegree_eq` | `AnfDegreeEq (fun x => evolve x n 0) (2n − 1)` for every `n ≥ 2` |
      | `anfDegree_eq_at` | the same at every cell `c` |
      | `triQ_eq` | the triangle parity law (below), for every size `m ≥ 2` |
      | `evolve_update_second_left` | the second-cell derivative formula (below) |

      ### How the proof goes

      Take the light-cone triangle of size `m` over the row segment `[a, a+2m−2]`. Its **left side** is
      `l_s = a(s)(a+s)` and its **right side** is `r_s = a(s)(a+2m−2−s)`, for `s < m`. The apex is shared:
      `l_{m−1} = r_{m−1}`. Of the `2^{2m−1}` rows, exactly `2^{m−1}` have a white right side.

      **Triangle parity law (`triQ_eq`).** Let `m ≥ 2`. Restrict to the rows whose right side is white.
      Then for every choice of coefficients `β_s, γ ∈ GF(2)`,

        `Σ_rows (γ + Σ_s β_s l_s) ≡ β_0   (mod 2)`.

      So, mod 2, the left side of such a triangle has a fixed statistic: every linear test of `l` that
      uses `l_0` has an odd number of successes, and every test that avoids `l_0` has an even number.

      The proof is by induction on `m`. Each step removes the two leftmost cells `x_a`, `x_{a+1}`. That
      pair is the involution the feedback asked for:

      1. *Right side.* The cells `r_s` with `s < m−1` do not see `x_a` or `x_{a+1}`. With those two
         cells removed, the rest of the row is a triangle of size `m−1` anchored at `a+2`, and it has
         the same right side.
      2. *Flipping `x_a`* flips every `l_s`, because `x_a` is the left edge of each of their cones (cone
         separation). Summing over `x_a` uses up the apex condition `l_{m−1} = 0`.
      3. *Flipping `x_{a+1}`* changes `l_s` by `D_s = Σ_{s'<s} (1 + l'_{s'})`, where `l'` is the left side
         of the smaller triangle (`evolve_update_second_left`, proved for every row). Summing over
         `x_{a+1}` therefore leaves an affine function of `l'`. The new coefficients are prefix sums,
         `w_j = β_0 + … + β_j`, so `w_0 = β_0` (`triQ_succ`, `sum_change_coeffs`).

      The base case is `m = 1`, where the sum equals `γ` (`triQ_one`). The rows counted by
      `whiteDiagonalCount n` are exactly the triangles of size `n` anchored at `1−n` that have a white
      right side and `l_0 = x_{1−n} = 0` (`whiteDiagonalCount_eq_triQ`). Taking `β = δ_0` and `γ = 1`
      in the law shows that this count is odd.

      ### What this does and does not give

      * It closes the study's degree track. The ANF degree of every cell after `n ≥ 2` steps is exactly
        `2n − 1`, and the coefficient of `x_{c+2−n}⋯x_{c+n}` is `1`. The earlier evidence (`n ≤ 20` in
        Lean, `n ≤ 36` in C) is now a special case.
      * It does **not** settle a prize problem. The degree is a property of the `n`-step *map*, and
        `map_properties_cannot_decide_periodicity` (error E2) still applies: the all-white row has the
        same maps and a periodic centre column. In the GLM's own terms, the "Boolean regime" of the
        wobble is now fully understood at the top degree. The open questions sit entirely in how the
        seed's initial data `rdiag D 0 = [D = 0]` interacts with that map (`SeedFSTypical`, `D(n) = o(n)`).
      * The method may carry further. Peeling two cells and following an affine functional of a
        smaller triangle's boundary is a general way to compute GF(2) statistics of light-cone
        triangles. Applying it to boundary conditions other than "right side white" is a natural next
        step for near-top ANF coefficients.

      ### The GLM in this round (`rule30_round8/`, outside Lean)

      The `reports/__init__.py` you supplied is the real package file. It imports
      `LatticeGeometryReports` from a module `reports/lattice_geometry.py`. That module is not in
      `glm_repo.zip`, and `session.py` only imports the class without defining it. So one file is still
      missing. `rule30_round8/lattice_geometry_standin.py` defines the class with the 14 `_report_*`
      methods the session dispatcher calls (deep holes, facets, fusion, hole
      classifier/configuration/failures/ladder, lattices, llvq, monster stack, multiresolution, shells,
      subalgebra, transform decoder). Each one refuses with an error that names the missing file. With
      your `__init__.py` and this stand-in, `GeometricSession` imports and answers. Its Rule 30 answers
      are unchanged: it has no cellular-automaton carrier, so it refuses
      (`rule30_round8/glm_probe_output_round8.txt`).

      ### Where the prize problems stand after Round 8

      | Problem | Proved (all rounds) | Precisely what remains |
      |---|---|---|
      | P1 | Period `1` excluded. At most one column is eventually periodic. Holds for almost every row | Exclude every period `p ≥ 2` for the centre |
      | P2 | Holds for almost every row. Equivalent to `D(n) = o(n)` | A seed-specific bound on `D(n)` |
      | P3 | Stated for Turing machines. Circuit lower bound for the light-cone map | A lower bound exponential in the input length |
      | Degree `deg a(n) = 2n − 1` | **Proved for all `n ≥ 2` and every cell (Round 8)** | Nothing |
