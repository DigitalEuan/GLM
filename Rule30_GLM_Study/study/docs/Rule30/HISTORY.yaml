  - heading: "Round 7: two new partial results on Problem 1"
    anchor: round-7-two-new-partial-results-on-problem-1
    body: |
      Both are `FORMAL` (Lean proofs for all parameters, standard axioms only, no `native_decide`).
      They hold for every row that is white on `(-∞, ℓ)` and black at `ℓ`, and in particular for
      Wolfram's single black cell.

      ### A. The period-1 case of Problem 1 (`NoConstantColumn.lean`)

      * `column_not_eventually_constant`, `seed_column_not_eventually_constant`: **no column is
        eventually constant.**
      * `centerCol_not_eventually_constant`, `centerCol_changes_infinitely_often`,
        `centerCol_infinitely_many_true`, `centerCol_infinitely_many_false`: the centre column
        changes colour infinitely often, and both colours occur infinitely often. In the language of
        Round 6 (`problem1_iff_lag_mismatch`), the lag-`1` mismatches are unbounded. This is the
        first lag for which that is proved.
      * Proof: with the rule `L xor (C or R)`:
        * if column `c` is eventually black, then `C or R = 1`, which forces column `c − 1` to be
          eventually white;
        * if column `c` is eventually white, column `c + 1` obeys `new = C or R`, so it can switch
          from white to black but never back, and is eventually constant.

        Either way two adjacent columns would be eventually constant, against Jen's theorem.
      * **Quantitative form.** `adjacent_run_bound` is a finite-window version of Jen's theorem: if
        columns `c` and `c+1` are both constant on `[N, N+L]` then `L ≤ c − ℓ + N + 1`.
        `column_run_bound` gives: if column `c` is constant on `[N, N+L]` then
        `L ≤ 3(c − ℓ + N) + 5`. `centerCol_change_in_window`: **every window `[N, 4N+6]` contains a
        colour change of the centre column.** (`EMP`, not machine-checked: the longest run up to
        `t = 20000` is 14, so the linear bound is far from tight; see `rule30_round7/`.)

      ### B. At most one column is eventually periodic (`OnePeriodicColumn.lean`)

      * `not_both_columns_periodic`: two **distinct** columns `c ≠ d` are never both eventually
        periodic. This extends Jen's theorem from adjacent columns to any pair.
      * `seed_at_most_one_periodic_column`: so **at most one column of the seed pattern is eventually
        periodic.**
      * `problem1_iff_centre_not_the_exception`: Problem 1 says exactly that the centre is not that
        one exceptional column. `problem1_of_other_periodic_column`: if any off-centre column were
        shown to be eventually periodic, Problem 1 would follow.
      * Proof: if columns `c` and `c + m + 2` are eventually periodic, the `m + 1` columns between
        them form a finite register driven by an eventually periodic input (`windowTransducer`).
        By `Transducer.output_eventuallyPeriodic` (Round 6), column `c + 1` is then eventually
        periodic. Columns `c` and `c + 1` together contradict Jen's theorem.
      * For the GLM's observer `Y`: a finite observer that sits on two columns sees a finite
        register in between. Periodicity cannot be confined to the two columns it watches. The
        remaining question, whether the single centre column can be periodic on its own, is Problem 1.

      ### C. The full GLM (`rule30_round7/`)

      With the added `parser.py`, `session.py` and `tct_engine.py`, the GLM session runs after one
      shim. The archive lacks `runtime/reports/__init__.py` and the class `LatticeGeometryReports`.
      The shim is `rule30_round7/glm_reports_init_shim.py`; its `LatticeGeometryReports` is an empty
      placeholder. The session has no cellular-automaton concept and refuses the Rule 30 queries
      rather than answering them. Its Golay report confirms the decoder used in Round 6.
      `corpus --ask` retrieves GLM prose by word overlap, not Rule 30 content. The `GLM.py` CLI still
      needs two more missing modules (`respell`, `sinter`). Details and outputs are in
      `rule30_round7/README.md`.

      ### Where the prize problems stand after Round 7

      | Problem | Proved (all rounds) | Precisely what remains |
      |---|---|---|
      | P1 | Period `1` excluded, with a linear window bound. At most one column is eventually periodic. Holds for almost every row. Equivalent to unbounded lag-`p` mismatches for every `p` | Exclude every period `p ≥ 2` for the centre, i.e. show the centre is not the one possible exceptional column |
      | P2 | Holds for almost every row. Equivalent to `D(n) = o(n)` and to total echo `o(N²)`. Both colours occur infinitely often (Round 7) | A seed-specific bound on `D(n)` |
      | P3 | Stated for Turing machines (`Problem3`, `Problem3Eventual`). Circuit lower bound for the light-cone map | A lower bound exponential in the input length |
