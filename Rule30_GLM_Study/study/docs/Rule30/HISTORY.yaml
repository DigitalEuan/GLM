  - heading: "Round 14: what a proof would take, and shortcut paths"
    anchor: round-14-what-a-proof-would-take-and-shortcut-paths
    body: |
      **The three prize problems remain open.** This round asks two questions. What exactly would a proof
      take? And could the centre column be following hidden "shortcut paths", either through its own past
      or through the GLM's Golay/Leech lattice network? The write-up is `rule30_round14/README.md`.

      | File | Contents |
      |---|---|
      | `ShortcutNetwork.lean` | jump rules (shortcuts through the column's past) and lattice lenses; Problem 1 restated through both; the look-back-1 rung; the statistical form under Seed Typicality and under normality |
      | `ShortcutNetworkData.lean` | *computation*: the GLM's Golay network (hop-norm census, every point within 3 minimal hops, the network is a group); jump-rule certificates for the centre column |

      ### A. Jump rules (`ShortcutNetwork.lean`)

      * `JumpRuleFrom a J f N`: `a t = f (a (t-1), …, a (t-J))` for all `t ≥ N`. `parityRule S` is the
        linear rule (XOR of the taps in `S`).
      * `eventuallyPeriodic_iff_jumpRule`, `eventuallyPeriodic_iff_linearJumpRule`: eventual periodicity
        holds iff some jump rule eventually takes over, and iff some linear one does. (A jump rule is a
        finite-state observer, `jumpObserver`, and Round 5's `eventuallyPeriodic_of_fsObserver` applies.)
      * **`problem1_iff_no_jumpRule`, `problem1_iff_no_linearJumpRule`**: Problem 1 says that no shortcut
        rule ever takes over the centre column.
      * **`centerCol_lookback_one`**: at look-back 1 there are four rules. The proved period-1 case leaves
        only "flip the last bit", so any look-back-1 rule that takes over makes the column alternate.
        Excluding alternation (period 2) is the narrowest open rung.
      * `FSObserver.transport`, `FSTypical.hits_half`: `FSTypical` covers observers with any finite state
        type. `jumpRule_hits_half_of_seedFSTypical`: under `SeedFSTypical`, every jump rule is right
        exactly half the time.

      ### B. Lattice lenses (`ShortcutNetwork.lean`)

      * `lensWalk F s a t = F (a (s t), …, a (s t + k - 1))`. With `k = 24`, `s = 24` this is the GLM's
        block lens; with `s = 1` it is the sliding lens. `F` can be the Golay snap or any other map.
      * `evPeriodic_lensWalk`: a lens cannot create aperiodicity.
        **`problem1_of_lensWalk_not_evPeriodic`**: a lens walk that never cycles would prove Problem 1.
      * `eventuallyPeriodic_of_lensWalk`, **`problem1_iff_lensWalk_not_evPeriodic`**: for a lossless lens
        (injective `F`, `1 ≤ s ≤ k`) the walk form is equivalent to Problem 1.
      * `BlockNormal a k`: every `k`-bit word has frequency `2^-k`. **`lens_freq_of_blockNormal`**: then
        each network point occurs with frequency `#{w | F w = v} / 2^k`.
        `hasFrequencyHalf_of_blockNormal_one`: the case `k = 1` gives Problem 2's condition.

      ### C. Finite facts (`ShortcutNetworkData.lean`)

      * `golayWord_xor` (`FORMAL`): the hop between two network points is again a point.
        `hop_twice`: making a hop twice returns to the start, so there are no straight lines.
      * `golayWord_nodup`, `golay_weight_census` (CERT): 4096 distinct points; the hop norms `d²` are
        `0, 8, 12, 16, 24`, with multiplicities `1, 759, 2576, 759, 1`.
      * **`golay_octad_distance`** (CERT): a `d² = 12` or `16` hop is exactly two minimal (octad) hops,
        and the `d² = 24` hop exactly three. Every point is within three minimal hops of every other, so
        every walk on this network "jumps".
      * `no_linearRule_of_certificate` (`FORMAL`) and **`centerCol_no_linear_rule_128`** (CERT): no linear
        jump rule with taps in `1..128` reproduces the centre column on times `128..256` (a 67-equation
        infeasibility certificate).
      * `no_tapRule_of_conflict` (`FORMAL`) and **`centerCol_no_tap_rule`** (CERT): no rule with 2 taps
        `≤ 64`, 3 taps `≤ 32` or 4 taps `≤ 24`, with any Boolean function, holds on even 64 consecutive
        bits.

      ### D. Experiments (`rule30_round14/`, EMP)

      * Over 4,194,304 steps and three lenses (block, block+Gray, sliding), the network statistics of the
        centre column match the exact pattern-free prediction: all |z| ≤ 1.6, and ≤ 2.1 with the GLM's own
        tie-break.
      * A planted hidden shortcut (an LFSR) is detected on every lens, and the structured controls are
        detected trivially.
      * The best k-tap shortcut (k ≤ 4) is no better than on a fair coin, and so are shortcuts that vary
        from segment to segment. The linear complexity stays within 6 of `n/2` up to `n = 20,000`.
      * One transient: the first `2^17` steps contain 125 near-white or near-black 24-bit windows, against
        a fair-coin mean of 36.4 (maximum 103 over 5,000 sequences). The other 31 segments are normal.
        This statistic was chosen after looking at the data, so it is a lead to explain, not a result.

      ### Where the prize problems stand after Round 14

      * **P1** asks that no shortcut rule ever takes over. The first unproved instance is "the centre
        column does not eventually alternate".
      * **P2** needs a balance theorem for the seed. Normality would fix every network statistic, and the
        statistics agree with normality over 4.2M steps.
      * **P3** needs a lower-bound method for all algorithms. The finite certificates rule out only short
        shortcuts on short stretches.
    subsections:
      - A. Jump rules (`ShortcutNetwork.lean`)
      - B. Lattice lenses (`ShortcutNetwork.lean`)
      - C. Finite facts (`ShortcutNetworkData.lean`)
