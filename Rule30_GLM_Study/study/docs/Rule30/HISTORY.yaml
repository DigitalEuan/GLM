  - heading: "Round 3: the 32-state phase space and the wobble certificate"
    anchor: round-3-the-32-state-phase-space-and-the-wobble-certificate
    body: |
      This round followed the push directive (finite phase space, exact arithmetic, evidence
      ledger, error record). Results, with evidence classes:

      ### Track 1 — the 32-state phase space (`PhaseSpace32.lean`)

      * `LocalPhaseSpace := Fin 5 → Bool` (32 states) and `r30_local_update` (Rule 30 applied twice
        inside the window). `evolve_two_eq_local` (`FORMAL`): for every row and cell,
        `a(2)(c) = r30_local_update (window x c)`.
      * `local_anf` (`EXH`, all 32 states): the exact ANF is
        `x₋₂ + x₁ + x₋₁x₁ + x₀x₁ + x₂ + x₋₁x₂ + x₀x₂ + x₁x₂ + x₋₁x₁x₂ + x₀x₁x₂`. Degree `3 = 2·2 − 1`,
        with **two** top monomials (`local_degree`). `localCoeff_eq_anfCoeff` (`FORMAL`) shows
        these are the global ANF coefficients of `a(2)(0)`.
      * `local_left_permutive`, `local_right_derivative` (`EXH`): the 32-state versions of cone
        separation and of the right-edge derivative.
      * `depends_exactly_on_cone` (`FORMAL`, all `n`): `a(n)(c)` depends on both `x_{c−n}` and
        `x_{c+n}`. The **support** grows by one cell on each side per step.
      * **The bridge lemma, audited** — `phaseSpace_does_not_determine_growth` (`FORMAL`, by
        computation): Rule 30 and Rule 180 (`L xor (C and not R)`) have the **same** 32-state
        profile (both left-permutive, two-step degree 3, both edge cells essential), but their
        three-step degrees are 5 and 4. Over `n = 1, …, 5` their degrees are `2,3,5,7,9` and
        `2,3,4,5,6`. So the 32-state space cannot force "+2 degree per step". The degree of a
        composition is not determined by a local window. What the window *does* give for all `n`
        is the support growth, cone separation and the right-edge derivative.
      * What carries the global degree is the reduction `deg a(n)(0) = 2n − 1 ⟺ whiteDiagonalCount n`
        is odd. `DegreeData.lean` turns that count into a verified bit-parallel loop. In that frame
        the whole diagonal is the single bit column `2n − 3` (`diagOK_spec`,
        `whiteDiagonalCount_eq_fast`). The check then gives **`deg a(n)(0) = 2n − 1` for
        `2 ≤ n ≤ 14`** (`anfDegree_eq_upto14`, `EXH`), up from `n ≤ 7`. The general case
        (`TopMonomialConjecture`) was proved in Round 8 (`TopMonomial.lean`). It does not give P1 or P3
        (`map_properties_cannot_decide_periodicity`, note 2 below).

      ### Track 2 — the wobble certificate (`WobbleCertificate.lean`)

      * `wobbleBoundedness_implies_normality` (`FORMAL`): `|D(N)| ≤ C√N` for all `N ≥ 1` implies
        frequency → 1/2. `freq_dev_of_wobble_le` gives the rate `|f(N) − 1/2| ≤ C/(2√N)`.
      * `sqrt_bound_two_fails` (`CERT`): the proposed constant **`C = 2` is false** for the centre
        column. At `N = 1462`, `|D| = 80` and `80² = 6400 > 4·1462 = 5848`.
      * `wobble_sq_ratio_cert` (`CERT`): for `1 ≤ N ≤ 10⁶`, `D(N)²/N ≤ 175561/24979`, with
        equality at `N = 24979` (`|D| = 419`). The best constant on this range is exactly
        `√(175561/24979) ≈ 2.651`, and every smaller `C` fails (`sqrt_bound_fails_below`).
        Also `D(10⁶) = 1536` (`wobble_1e6`). The script `scripts/wobble_certificate.py` reproduces
        these numbers independently, using integers and `Fraction` only.
      * `no_finite_certificate_problem2`, `no_finite_certificate_problem1` (`FORMAL`): **no finite
        certificate can prove Problem 2 or Problem 1.** Any finite prefix of bits extends both to
        a sequence with frequency `1/2` and to one without, and both to a periodic sequence and to a
        non-periodic one. A `CERT` up to any `N` is evidence about that range only. It can never
        be promoted to a proof of P1/P2.

      ### Track 3 — provenance ledger

      `claims.csv` lists 35 claims with class, status and Lean reference. Following the directive's
      rule, no claim is called a theorem unless its class is `FORMAL`, or `EXH`/`CERT` for exactly
      the stated finite range.

      ### Track 4 — error record (institutional memory)

      | Defect | What happened | Correction |
      |---|---|---|
      | E1 Inconsistent axioms | `wobbleBoundedness_sqrt` / `_LIL` (all sequences) and `r30_complexity` (free `cost`) prove `False` | Replaced by `Prop`s; refutations `not_forall_sqrt_bound`, `unconstrained_cost_refutes` |
      | E2 Map-vs-seed confusion | Degree, cone and weight are properties of the map from *all* rows; they cannot decide the seed's centre column | `map_properties_cannot_decide_periodicity` |
      | E3 Local-to-global degree | "32-state window guarantees +2 per step" | False as an inference: `phaseSpace_does_not_determine_growth` (Rule 180) |
      | E4 Combinatorial bulk | Tracking near-top monomials of the global ANF | Quarantined by the exact reduction to one parity count (`topMonomialConjecture_iff`) and a verified fast loop |
      | E5 `C = 2` wobble constant | Proposed certificate constant | Refuted at `N = 1462`. The best constant up to `10⁶` is `2.651…`. The law of the iterated logarithm predicts no constant works |
      | E6 Finite certificate ⇒ prize | Promoting a finite `CERT` to P1/P2 | Impossible: `no_finite_certificate_problem1/2` |
      | E7 Two top monomials at `n = 2` | Uniqueness of `M_n` claimed generally | Holds for `3 ≤ n ≤ 6` (checked); at `n = 2` there are two |

      ### Where this leaves the prize problems

      | Prize problem | Directive's route | Verified outcome |
      |---|---|---|
      | P1 non-periodicity | 32D phase space ⇒ `deg → ∞` | Route invalid (E2, E3). Partial result proved: adjacent columns are never both periodic. P1 `OPEN` |
      | P3 complexity | 32D phase space ⇒ `deg = Ω(n)` | Route invalid (E2: different function). P3 `OPEN`, not formalised (needs a machine model) |
      | P2 normality | exact wobble certificate | Certificate computed exactly to `10⁶`. `C = 2` refuted. No finite certificate suffices (E6). P2 `OPEN`, and it is equivalent to `D(n) = o(n)` |
      | Diagnostics | Golay/Leech | `DEF`, kept outside the proof track (not formalised here) |

      ### For the GLM (perspective and arrow)

      The verified facts that transfer directly as GLM operators are these:
      * the **wobble arrow** `−sign D(n)` (`deviation_decreases_iff`) as the observer's direction
        of convergence;
      * the **reading direction** in space (`columns_determine_left`: information flows leftwards;
        the mirror observer sees Rule 86 with the same centre column);
      * the exact **32-state phase-space map** with its ANF, as a finite local operator;
      * the **exact-arithmetic carrier** `D(N)` with squared-ratio certificates (`scanOK`) as a
        finite, checkable diagnostic, with the formal caveat that no finite prefix decides the
        limit.
