  - heading: "Round 48: white triangles, left-down vs right-down lines, bands printed from the right"
    anchor: round-48-white-triangles-left-down-vs-right-down-lines-bands-printed-from-the-right
    body: |
      The owner observed that left-down lines run on while right-down lines end, that large white
      triangles sit on the right and not near the left edge, and suggested reading the triangles as
      operators in bands printed from the right. Guide: `TRIANGLES.md`.

      **The triangle law** (`Triangles.lean`, FORMAL; C422). A white run `[a, b]` of any row is the top of
      the white triangle `[a+k, b−k]` (`white_triangle`); with black ends it is outlined in black
      (`maximal_white_triangle`); tips: `odd_tip_white`, `even_tip_closes`. **Birth** (C423): above a white
      run the cells `[a−1, b−1]` have one colour, all black (a triangle is born from a black run) or all
      white (inside a larger triangle) (`white_run_parent`); a black run `[a, b]` gives the white run
      `[a+1, b]` (`black_run_child`).

      **The two line directions** (C424). A black cell continues right-down iff both cells to its right
      are white (`rightDown_continues_iff`), left-down iff the one cell two to its left is white
      (`leftDown_continues_iff`). Right-down lines are the left outlines of white triangles.
      `column_from_right`: columns `c, c+1` fix column `c−1` — the pattern prints from the right in.

      **Lines that never end** (C425). For `D ≥ 2`, left diagonal `D` is eventually black iff `D − 2` is
      eventually white (`ldiag_eventuallyBlack_iff`); so infinitely many left-down black lines never end
      (`ldiag_infinitely_many_black`; `0, 1, 4, 9, 30, 401, 53209, …`). Every right-down black line other
      than the right edge breaks within `2^D` steps (`rdiag_black_segment_short`,
      `rdiag_not_eventuallyBlack`).

      **Bands at the right edge** (C426). The first `k` right diagonals repeat with period `2^k`
      (`right_band_copy`); at every row `n·2^k` the `k` cells inside the right edge are white
      (`right_edge_white_run`, `right_edge_triangle`); white triangles of every size occur one cell inside
      the right edge (`arbitrarily_large_right_triangles`).

      **The left edge** (`TrianglesData.lean`, CERT; C427). Inside the first `400` left diagonals no white
      run of length `16` ever (`left400_no_window_16`); after `t = 501` the longest is exactly `10`; inside
      the first `20000`, after `t = 26834`, exactly `16` (`left20000_settled_no_window_17`,
      `left20000_settled_window_16`). The method packs the strip into one number and reads windows with a
      shifted `and`; one equality of packed rows extends a one-period check to all later times.

      **Measured** (EMP, `scripts/r48_triangles.py`; C428). Runs of length `≥ 20` by eighths of the row,
      left to right, rows `< 10000`: `0, 0, 0, 7, 1, 4, 1, 119`. Record right-edge triangles exactly at the
      rows `2^k`, tops `≈ 2.6k`. Mean finished line lengths: left-down `1.99`, right-down `1.33`.

      **Corrections.** Not every left-down line is continuous (most break after about two cells), but
      infinitely many never break, and no right-down line inside the pattern is endless. Triangles are not
      absent near the left edge, they are small (≤ 10 in the settled first 400 diagonals); whether they stay
      bounded as the strip widens is open (To Do 52).

      **Housekeeping.** The ledger checker (`scripts/ledger_check.py`) now follows nested namespaces and
      imports the whole Hypothesis Engine, so the 27 names of C411–C419 that it could not resolve are
      found; all 428 rows resolve.

      **Status.** No prize problem is closed.
