  - heading: "Round 5: finite-state observers, the diagonal bridge, and a machine model"
    anchor: round-5-finite-state-observers-the-diagonal-bridge-and-a-machine-model
    body: |
      This round tested the proposed Round 5 "bridges": (A) seed typicality via the diagonal-predictor
      coupling for P1/P2, (B) a machine model and diagonal incompressibility for P3, (C) dropping the
      `O(√n)` wobble target in favour of `D(n) = o(n)`. **The prize problems remain open.** What is now
      proved is listed below, all `FORMAL` unless marked otherwise.

      ### A. The Seed Typicality Theorem, stated exactly (`FiniteState.lean`)

      A *finite-state observer* (`FSObserver`) keeps a state from a finite set, guesses the next bit from
      its state, and updates the state with the bit it reads. This is the GLM observer `Y` with bounded
      memory.

      * `eventuallyPeriodic_iff_exists_fsObserver`: a sequence is eventually periodic **iff** some
        finite-state observer is eventually always right on it.
      * `problem1_iff_fsObservers_fail`: so **Problem 1 is equivalent to**: every finite-state observer
        makes infinitely many mistakes on the centre column. This is an exact restatement, not a proof.
      * `FSTypical a`: every finite-state observer is right on `a` with frequency exactly `1/2`.
        `SeedFSTypical := FSTypical centerCol` is the precise **Seed Typicality target**.
      * `problems_one_and_two_of_seed_fsTypical`: `SeedFSTypical ⇒ Problem1 ∧ Problem2`.
      * `ae_fsTypical`, `exists_fsTypical_column`: almost every row is finite-state typical, for all
        observers at once. Unlike typicality for *all* causal predictors (which no row has), this target
        is consistent. `not_fsTypical_const` shows it is a real restriction.
      * The wobble-arrow observer is *not* finite-state (it needs the unbounded counter `D(t)`).

      ### B. The diagonal bridge does not work as stated (`DiagonalCoupling.lean`)

      The proposal was that the centre column, which runs through diagonals with unbounded periods
      `2^D` coupled by the triangular running-XOR recursion, cannot be locked onto by a finite-state
      predictor or compressed by an algorithm. The Lean results show that this structure is not
      specific to the seed:

      * `rdiagOf_succ`: the triangular recursion holds for the diagonals of **every** row.
      * `rdiagOf_periodic`: for **every** row that is white on `(0, ∞)`, every right diagonal has period
        `2^D`. `centre_eq_rdiagOf`: the centre column always reads diagonal `t` at time `t`.
      * `diagonal_coupling_does_not_decide_problem1`: a row with all of this structure has centre column
        `1,0,1,0,…`. That column is periodic, a 2-state observer predicts it perfectly, and it can be
        computed in constant time.
      * `diagonal_coupling_does_not_decide_problem2`: another such row has a centre column with frequency `1/3`.
      * `unbounded_periods_do_not_force_aperiodicity`: abstractly, sequences with least periods exactly
        `2^D` can have a constant diagonal read-out.
      * `seed_is_unique_initial_data`: what singles out the seed is its **initial data**
        `rdiag D 0 = [D = 0]`. Any proof of P1/P2/P3 along this route has to use that data, not just
        the recursion and the periods.

      ### C. Machine models for Problem 3 (`MachineModel.lean`, `MachineModelData.lean`)

      * Circuits: `Circuit`, `card_essential_le`. A function that depends on `k` inputs needs at least
        `(k−1)/2` fan-in-2 gates.
      * The light-cone map `(x_{−t},…,x_t) ↦ a(t)(0)` always depends on `x_{−t}` and `x_t`
        (`centreWindow_essential_left/right`). `WholeConeDependence` (all `2t+1` cells matter) is open in
        general and checked for `t ≤ 6` (`wholeCone_le_6`, `EXH`). Under it, every circuit for the
        light-cone map has at least `t` gates (`circuit_size_ge_of_wholeCone`). This concerns the
        *generic map*, not Problem 3.
      * `nonuniform_trivial`: for a fixed `n`, `a(n)` is a constant, so per-`n` circuits are trivial.
        Problem 3 needs one machine for all `n`.
      * `fuel_model_trivial`: in Mathlib's step-bounded evaluator (`Nat.Partrec.Code.evaln`) the fuel
        always exceeds the input, so "Ω(n)" holds there for **every** function. That model is useless
        for Problem 3.
      * `Problem3` (open): stated for Mathlib's multi-tape Turing machines (`TM2ComputableInTime`), with
        `n` in binary. No machine computing the centre column has a running-time bound that is `o(n)`.
        Since the input has about `log₂ n` bits, this asks for a time lower bound of `2^{Ω(length)}`
        for a specific explicit function. Current lower-bound methods cannot prove bounds like that.
        The diagonal argument cannot either: by B, the same coupling holds for rows whose centre
        column takes constant time to compute.

      ### D. The wobble target

      The `O(√n)` wobble bound is dropped as a target. The law of the iterated logarithm predicts it is
      false for random-like sequences, and the exact certificate refutes `C = 2` up to `10⁶`. The target
      for P2 is `D(n) = o(n)` (`problem2_iff_wobble`). The "Birkhoff" step suggested in feedback is
      already proved in the form needed: for almost every row, every column is an i.i.d. fair-coin
      sequence, so `D(n)/n → 0` almost surely (`ae_column_frequency_half`, by the strong law). As in
      Round 4, the remaining gap is the seed itself (`measure_theory_boundary`).

      ### Where the prize problems stand after Round 5

      | Problem | Proved this round | Precisely what remains |
      |---|---|---|
      | P1 | P1 ⟺ every finite-state observer errs infinitely often on the centre column. The diagonal coupling alone cannot decide it | Show that no finite-state observer is eventually always right on the seed's centre column, using the seed's initial data |
      | P2 | `SeedFSTypical ⇒ P1 ∧ P2`. `SeedFSTypical` holds for almost every row. The diagonal coupling alone cannot decide it | Prove `SeedFSTypical`, or only its constant-observer case |
      | P3 | Formal statement `Problem3` in a uniform model. Circuit lower bounds for the generic map (conditional, and checked for `t ≤ 6`). Two models shown to be trivial | A super-polynomial time lower bound in the input length for one explicit function. This is beyond current techniques |
    subsections:
      - A. The Seed Typicality Theorem, stated exactly (`FiniteState.lean`)
      - B. The diagonal bridge does not work as stated (`DiagonalCoupling.lean`)
      - C. Machine models for Problem 3 (`MachineModel.lean`, `MachineModelData.lean`)
      - D. The wobble target
      - Where the prize problems stand after Round 5
