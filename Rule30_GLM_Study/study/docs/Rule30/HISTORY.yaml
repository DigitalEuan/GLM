  - heading: "Round 25: tuning by ear — pruned, directed search for an unknown law"
    anchor: round-25-tuning-by-ear-pruned-directed-search-for-an-unknown-law
    body: |
      **Input.** "If we don't know the axiom required at the fundamental level and we can't sweep for it
      brute force, can we iterate through plausible symbol arrangements — pruning and directing, looping
      the resolution closer and closer? Like trying to get a note just right by ear without knowing
      music." This round turns that loop into exact Lean statements and proves what it can and cannot do.
      Nothing in this round settles a prize problem.

      ### The loop, made exact (`TuningByEar.lean`, FORMAL, standard axioms only)

      A *candidate law* `h` predicts a whole sequence `pred h`. Listening to the first `n` notes of the
      true sequence `s` prunes every candidate that disagrees with them (`Survives pred s n h`). For
      **every** family of candidates:

      | Theorem | Meaning |
      |---|---|
      | `pruned_forever` | pruning is permanent: a wrong note heard once is never un-heard |
      | `survives_of_eq` | pruning is sound: the true law, if it is in the family, is never pruned |
      | `eq_of_survives_all` | surviving all listening = being exactly right |
      | `finite_lockIn` | a **finite** family locks in after finite time: every survivor is exactly right (this is why rows `0..4` single out wheel 30 among 256, `Observer.lean`) |
      | `graded_settles_iff` | give candidates a size with finitely many of each size: the size needed to stay consistent stays **bounded iff the true law is in the family** |
      | `tuneIndex_eventually` | the directed loop "take the first surviving candidate" of an enumeration settles for ever on a correct law, if one exists (identification in the limit) |
      | `tuneIndex_diverges` | if none is correct, the guess drifts for ever: every fixed block of candidates is eventually pruned for good |
      | `no_finite_confirmation` | **no finite amount of listening confirms a candidate**: the loop refutes, it never certifies, and it cannot know when it has converged |

      ### The periodic instrument and Problem 1

      `tuneCost s n` = least `τ + p` (transient + period, `p ≥ 1`) of an eventually periodic law consistent
      with the first `n` notes: the size of the best periodic tune after `n` notes (Occam-directed: the
      loop always prefers the smallest tune).

      * `tuneCost_mono`, `tuneCost_le_succ`, `tuneCost_congr` (a listening quantity: it reads only the
        first `n` notes), `tuneCost_le_of_periodFits`.
      * **`periodic_of_tuneCost_bounded`** (compactness): if every prefix has a tune of size `≤ B`, a single
        tune of size `≤ B` is exactly right.
      * **`resolution_iff`**: each resolution level is settled by finite listening: "no eventual period
        with `τ + p ≤ B`" holds iff some prefix forces `tuneCost > B`.
      * **`problem1_iff_tuneCost_unbounded`**: Problem 1 ⟺ the tuning loop never settles (its resolution
        climbs past every bound). This is a further equivalent form of Problem 1.
      * `lcProfile_le_tuneCost`: the linear-recurrence instrument of Round 23 (Berlekamp–Massey's
        quantity) is at least as fine as the periodic one.
      * `TuneExcessBound g`, `problem1_of_tuneExcessBound`: the *excess* `n − tuneCost(n)` is how many
        notes the best periodic tune actually predicts beyond what it memorises. Any sublinear bound on
        it proves Problem 1; `TuneExcessLog` (excess `≤ 2 log₂ n + 2`) is the open target recorded here
        (`problem1_of_tuneExcessLog`).

      ### Certificates (`TuningByEarData.lean`, CERT)

      * `tuneExcess_le_16`: for every `n ≤ 1000`, `n ≤ tuneCost centerCol n + 16`;
        `tuneExcess_16_sharp`: `tuneCost centerCol 448 = 432` (tune `τ = 282`, `p = 150`), so 16 is attained.
      * `tuneExcessLog_upto`: `TuneExcessLog` holds for every `n ≤ 2000`.
      * `tuneCost_centerCol_19999`: after 19999 notes every consistent periodic tune has size `≥ 10000`.
      * `frontier_round25` collects the round.
      * The checker (`noTuneBelow`, `le_tuneCost_of_noTuneBelow`) tests, for each period `p`, only the
        positions that matter, so the certificate is quadratic, not quartic.

      **Experiment** (`scripts/tuning_by_ear.py`, EMP, outside Lean): up to `n = 3000` the best periodic
      tune changes about every second note (1584 changes), the excess never exceeds 22, and
      `TuneExcessLog` holds with no slack to spare (the maximum of `excess − (2 log₂ n + 2)` is exactly 0).

      ### What this says about the input

      1. **Yes, the loop is sound and, for finite or graded families, it is guaranteed to converge**
         — *if the law you are tuning towards is in the family you search*. That is
         `finite_lockIn`, `graded_settles_iff`, `tuneIndex_eventually`.
      2. **It can never tell you that it has converged** (`no_finite_confirmation`): every finite run of
         listening is consistent with some other law. The ear can rule tunes out; it can never certify
         the last one. This is the same wall as `no_finite_certificate_problem1`.
      3. **For Rule 30 the loop is an exact restatement of Problem 1**: Problem 1 says precisely that the
         periodic tuning loop never settles (`problem1_iff_tuneCost_unbounded`). The data: the best tune
         never predicts more than 16 notes beyond its own size up to `n = 1000`; the note is never found.
      4. **Where the loop can help find the axiom.** Tuning on *data* can only prune. To *prove* Problem 1
         one has to tune on *statements*: iterate candidate lemmas (the "symbol arrangements"), prune each
         one that a finite check refutes (the round loop in `DEVELOPMENT.md` §2 does exactly this:
         EMP, then certificates, then proofs), and direct the search towards statements that imply the
         problem. Each resolution level of Problem 1 is finitely checkable (`resolution_iff`); the axiom
         that is missing is a statement covering all levels at once, which no finite listening reaches.
         A concrete next candidate produced by this round is `TuneExcessLog`: it is a *quantitative*
         statement about how fast every periodic tune goes out of tune, it implies Problem 1, and it
         holds as far as checked.

      ### Where the prize problems stand after Round 25

      All three are still open. Problem 1 has a further proved equivalent form (the periodic tuning loop
      never settles) and a further sufficient target (`TuneExcessLog`, certified for `n ≤ 2000`).
    subsections:
      - The loop, made exact (`TuningByEar.lean`, FORMAL, standard axioms only)
      - The periodic instrument and Problem 1
      - Certificates (`TuningByEarData.lean`, CERT)
      - What this says about the input
      - Where the prize problems stand after Round 25
