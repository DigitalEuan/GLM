  - heading: "Round 4: ascending to measure theory and seed-specific structure"
    anchor: round-4-ascending-to-measure-theory-and-seed-specific-structure
    body: |
      The question for this round was whether measure/ergodic theory (for P2) and seed-specific
      algebra (for P1/P3) find the pathway that the finite and map-level tools could not. Everything
      below is `FORMAL` (a Lean proof for all parameters) unless marked otherwise.

      ### A. Measure and ergodic theory (`Ergodic.lean`, `Invariance.lean`)

      Give every row the fair-coin product measure `bernoulliRow` (each cell independently black with
      probability 1/2).

      * `column_law`: for a random row, **every column `t ↦ a(t)(c)` is exactly a sequence of independent
        fair coin flips**. Its law is the Bernoulli(1/2) product measure on `ℕ → Bool`.
        (`column_iIndep`: mutual independence; `column_bit_fair`; `column_prefix_law`: every column word
        of length `n` has probability `2^{-n}`.)
      * `ae_column_frequency_half`: **Problem 2 holds for almost every row**, in every column (strong law of
        large numbers, Etemadi's version, from Mathlib).
      * `ae_column_not_eventuallyPeriodic`: **Problem 1 holds for almost every row**, in every column.
        `ae_problems_one_and_two` packages both.
      * `step_measurePreserving`, `evolve_measurePreserving`: Rule 30 preserves the fair-coin measure. So
        `(rows, bernoulliRow, step)` is a measure-preserving dynamical system, and the fair-coin measure is
        an invariant measure.

      The mechanism is cone separation, read probabilistically:
      `a(t)(c) = x_{c−t} xor F(x_{c−t+1}, …, x_{c+t})` (`evolve_eq_xor_inner`). The new cell `x_{c−t}` is a
      fair coin independent of everything the earlier column bits depend on (`col_step`).

      ### B. Where measure theory stops (`ColumnInverse.lean`)

      * `bernoulliRow_seed_null`: the seed has probability `0`.
      * `column_inverse_exists`, `column_inverse_unique`: for **any** right half (cells `> 0`) and **any**
        target sequence there is exactly one row with that right half and that centre column.
      * `seed_unique_preimage`: the seed is the only right-white row whose centre column is Rule 30's.
      * `exists_row_with_periodic_column`, `exists_row_with_biased_column`: right-white rows (like the seed)
        realise the periodic column `1010…` and a column with frequency `1/3`.
      * `measure_theory_boundary` packages this. Problems 1 and 2 hold almost surely, but the seed is a
        null point, and rows with the seed's right half realise every behaviour. **No argument that only
        uses "almost every row" can reach the seed.** The missing ingredient is a reason why the seed is
        *generic*.

      ### C. Perspective: observers, arrows and typicality (`Unpredictability.lean`)

      The user's suggestion was that the wobble defines a perspective, an "arrow" for the observer `Y`.
      In this round it is formalised as a *causal predictor*: a rule `pred t a` that guesses bit `t`
      from bits `< t`.

      * `ae_predictor_hits_half`: for **every** causal predictor, on almost every row it is right with
        frequency exactly `1/2`. `ae_arrow_followed_half`: in particular the wobble arrow is followed half
        the time. This matches the seed's measured `4968/9964` (`arrow_stats_10000`).
      * `problem2_iff_const_typical`: Problem 2 ⟺ the seed is typical for the constant predictor.
      * `problem1_of_lag_typical`: Problem 1 follows if the seed is typical for every *lag predictor*
        ("bit `t` repeats bit `t−p`"). `ae_typical_const_and_lags`: almost every row is typical for all of
        these at once.
      * `no_row_typical_for_all_predictors`: **no row at all, the seed included, is typical for every
        causal predictor.** An observer that already knows the answer is always right. The seed's
        column is computable, so it is not typical for every computable predictor either.

      For the GLM, the observer `Y` has to be **resource-bounded**. A perspective is a class of
      admissible predictors, and "the run converges" means "the seed is typical for that class". For P2
      the class is a single constant predictor. For P1 it is the lag predictors, which use finite memory.
      Normality in full (all block frequencies) corresponds to finite-state predictors. That
      correspondence is a classical result, not formalised here.

      ### D. Seed-specific structure (`Diagonals.lean`)

      Write `rdiag D t = a(t)(t − D)` for the cell `D` steps inside the right edge of the seed pattern.

      * `rdiag_succ`: `rdiag D (t+1) = rdiag D t xor (rdiag (D−1) t ∨ rdiag (D−2) t)`. Over GF(2) each
        right diagonal is the running sum of an expression in the two diagonals outside it. This
        triangular recursion exists only because of the seed: the diagonals with `D < 0` are white.
        *(Corrected in Round 5/6: it holds for every row that is white on the right; the seed-specific
        ingredient is the initial diagonal data.)*
      * `rdiag_periodic`: **every right diagonal is periodic from `t = 0`, with period `2^D`.**
        `rdiag_mod`: a cell at depth `D` is a lookup on `t mod 2^D`. For fixed depth this is a fast
        algorithm, the kind of shortcut that Problem 3 asks about.
      * `rdiag_not_periodic`, `rdiag_period_unbounded`: the least period of diagonal `D` is a power of two
        in `(⌈D/2⌉, 2^D]`, so the periods are unbounded. (`EMP`, not machine-checked: the least periods for
        `D = 0..8` are `1,2,2,4,8,8,16,32,32`, roughly `2^{2D/3}`.)
      * `centerCol_eq_rdiag`: the centre column is `a(t) = rdiag t t`. It moves one diagonal inwards per
        step, and the diagonal it reads at time `t` has least period `> t/2`. So each diagonal is
        periodic, but the centre never stays on one long enough to see it. The right-side shortcut
        (`rdiag_mod`) needs a table of size `2^t` at the centre, so it gives no speed-up there.
      * Orientation (`EMP`): Rule 30's visible regular stripes are on the left. Left diagonals
        `a(t)(−t+E)` for `E ≤ 57` are eventually periodic with period `≤ 8` (simulation to `t = 4000`). They
        satisfy a *nonlinear* recursion, so the running-XOR argument does not apply. The centre column
        lies in the wedge between the two regular zones.

      ### Where the prize problems stand after Round 4

      | Problem | What is now proved | What remains (precisely) |
      |---|---|---|
      | P1 | Holds for almost every row (`ae_column_not_eventuallyPeriodic`), and for each column of a typical row. Follows from lag-predictor typicality of the seed (`problem1_of_lag_typical`). Adjacent columns are never both periodic (Round 2). Every right diagonal is periodic, with unbounded periods | Show the seed is typical for the lag predictors, or show that the column inverse of an eventually periodic sequence is never the seed (`seed_unique_preimage`) |
      | P2 | Holds for almost every row (`ae_column_frequency_half`). Equivalent to `D(n) = o(n)` and to constant-predictor typicality of the seed | Show the seed is generic for the invariant measure along the centre column. No finite certificate (Round 3) and no a.e. argument (`measure_theory_boundary`) can do this alone |
      | P3 | Fixed-depth cells near the right edge have a lookup algorithm (`rdiag_mod`). At the centre the period exceeds `t/2`, so the lookup is useless there | A machine model, then a lower bound. Not formalised *(superseded: stated in Round 5 as `Problem3`)* |

      **What the GLM needs next.** The ascent to measure theory gave the complete *typical* picture.
      Every column of a typical row is a fair coin process, and Rule 30 preserves the coin measure. The
      ascent also located the gap exactly: the seed is one point, and every behaviour is realised by
      rows that look like it on the right. The seed-specific algebra gave exact structure on the right
      (periodic diagonals with periods that double) and showed that the centre escapes it. The pathway
      that remains is a **genericity theorem for the seed**: some property of the specific row `seed` that
      forces typicality for the constant predictor (P2) or the lag predictors (P1). Every formal piece
      needed to state such a theorem and to use it is now in the package.
    subsections:
      - A. Measure and ergodic theory (`Ergodic.lean`, `Invariance.lean`)
      - B. Where measure theory stops (`ColumnInverse.lean`)
      - "C. Perspective: observers, arrows and typicality (`Unpredictability.lean`)"
      - D. Seed-specific structure (`Diagonals.lean`)
      - Where the prize problems stand after Round 4
