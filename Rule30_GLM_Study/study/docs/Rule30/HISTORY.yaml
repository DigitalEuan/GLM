  - heading: "Round 6: the full feedback push (waves, boundaries, rule spaces, the parity count)"
    anchor: round-6-the-full-feedback-push-waves-boundaries-rule-spaces-the-parity-count
    body: |
      This round took the three pieces of feedback in `rule30_push.txt` (#1 the "NLFSR bridge", #2 the
      "continuous-wave radar", #3 the reviewer's checklist) and the stance that *randomness is only
      undiscovered rule space*. Every directive that can be stated precisely was formalised. The Lean
      results are `FORMAL` unless marked. The GLM-side experiments (observer benchmark, Golay census,
      reasoning test suite, C parity program) are in the companion folder `rule30_round6/` of the study
      tree; their numbers are `EMP`.

      ### A. The continuous wave, made exact (`Spectral.lean`, feedback #2)

      The observer emits the wave `w(n) = ±1` and listens to its echo at lag `k`,
      `echo(N, k) = Σ_{n<N−k} w(n)·w(n+k)`.

      * `wobble_sq_eq_echo`: **`D(N)² = N + 2 Σ_{1≤k<N} echo(N, k)`** (the radar identity: the squared
        wobble is exactly the total echo).
      * `problem2_iff_totalEcho`: **P2 ⟺ total echo `= o(N²)`.** "No spectral atom at frequency 0" in the
        Cesàro sense *is* Problem 2. The wave picture is therefore a faithful restatement, not a
        shortcut. Proving the absence of the atom for the seed is the same task as P2.
      * `echo_resonance`, `problem1_of_no_resonance`: periodicity with period `p` makes the normalised
        lag-`p` echo tend to `1` (a resonance). If no lag resonates fully, P1 holds.
      * `problem1_iff_lag_mismatch`, `problem1_iff_mismatches_unbounded`: **P1 ⟺ for every lag `p ≥ 1`
        there are arbitrarily late mismatches `a(t+p) ≠ a(t)`** (feedback #3 C). Excluding one period at
        a time is genuine partial progress. Excluding all of them is P1.

      ### B. The boundary data of the seed (`SeedBoundary.lean`, feedback #1)

      * `evolve_seed_right_edge`, `rdiag_zero_eq_true`: the right edge `a(t)(t)` is **always black**,
        not white as the NLFSR proposal assumed. `rdiag_one_eq`: the first inner diagonal is
        `0,1,0,1,…`. The right-diagonal system is autonomous (`rdiag_succ`): diagonal `D` is driven only
        by `D−1`, `D−2`. No "left input" enters it.
      * `seed_value_eq_linear_coeff`: `a(n)(c)` **is** the ANF coefficient of `x₀`. True, but it is the
        evaluation at the unit vector, so it carries no new information. It is a different coefficient
        from the top one counted by `whiteDiagonalCount` (Track B conflated the two).
      * `Transducer.output_eventuallyPeriodic`: **a finite-state machine driven by an eventually periodic
        input has an eventually periodic output.** Hence `problem1_no_finite_driven_register`: if P1 is
        true, no fixed-size register fed by periodic edge stripes produces the centre column. The
        register must be unbounded, and with an unbounded register it is the diagonal read-out, whose
        limits were settled in Round 5.

      ### C. Rule spaces: randomness relative to a declared class (`RuleSpace.lean`)

      * `not_escapes_allRules`, `centerCol_captured`: **every sequence is captured by some rule**. The
        centre column is captured by Rule 30 itself. "Random relative to all rules" is empty, which is
        the formal content of "randomness is undiscovered rule space".
      * `problem1_iff_escapes_lag`, `problem1_iff_escapes_fs`, `escapes_lag_iff_escapes_fs`: **P1 ⟺ the
        centre column escapes the lag rules ⟺ it escapes all finite-state rules.** For exact eventual
        prediction, finite memory adds nothing beyond "repeat with lag `p`".
      * `problem2_iff_typical_const`, `seedFSTypical_iff`: P2 is typicality for the one-rule space
        {always black}. `SeedFSTypical` is typicality for the finite-state space.
      * `exists_rightWhite_row_captured_by_lag`: escape is seed-specific. A right-white row exists whose
        centre column is captured by a lag-2 rule.

      The ladder for the GLM: lag rules (P1) = finite-state rules (P1, exact form) ⊂ counter rules (the
      wobble arrow) ⊂ all computable rules (nothing escapes). P2 and `SeedFSTypical` are typicality,
      not escape, statements on the lower rungs. The wobble's role as the observer's *arrow*
      (`Perspective.lean`) is the first rung above finite state.

      ### D. The parity count: a proved halving (`ParityReduction.lean`, `ParityReductionData.lean`, feedback #3 A)

      * Cone separation makes every cell at even distance `n−1−2k` from the right end of the window
        **forced** by the constraint at time `k`. Only the `n−1` cells `n−2, n−4, …, 2−n` are free.
        The last constraint would force the outside cell `1−n` and becomes the only real condition.
      * `whiteDiagonalCount_eq_reduced`: **`whiteDiagonalCount n = #{g < 2^(n−1) : reducedPhi n g = 0}`**.
        This is a count over `2^(n−1)` patterns instead of `2^(2n−2)` rows.
      * `topMonomialConjecture_iff_reduced`, `reduced_zeros_odd_iff_ones_odd`: the top-monomial
        conjecture ⟺ the `(n−1)`-variable function `reducedPhi n` has an odd number of ones for every
        `n ≥ 2` (equivalently, full algebraic degree `n−1`).
      * `anfDegree_eq_upto20` (*computation*, `native_decide`, via the proved fast scan
        `whiteDiagonalCount_eq_fastReduced`): **`deg a(n)(0) = 2n − 1` for every `2 ≤ n ≤ 20`**
        (previously `n ≤ 14`).
      * `EMP`: the same scan in C (`rule30_round6/r6_parity_reduction.c`) finds the count odd for every
        `n ≤ 36`. The values match brute force for `n ≤ 7` and the Lean function for `n ≤ 21`.

      ### E. Ledger reconciliation (feedback #3, section 1)

      * **Frequency 1/2 is not normality.** `HasFrequencyHalf` / P2 is *balance* (`D(n) = o(n)`). Full
        binary normality needs every `k`-block at frequency `2^{-k}`. Earlier wording ("normality ⇔
        `D(n)/n → 0`") means balance. `claims.csv` C18 is reworded.
      * **Finite certificates.** `no_finite_certificate_problem1/2` say that *prefix data alone* cannot
        decide P1/P2. A finite certificate combined with a structural theorem can prove statements about
        infinite sequences (`rdiag_periodic` is an example). C23/C24 are reworded.
      * **The diagonal recursion is not seed-exclusive.** Round 4 said the triangular recursion "exists
        only because of the seed". Round 5 (`hasDiagonalStructure_of_rightWhite`) shows it holds for every
        right-white row. The seed-specific ingredient is the *initial data* (only diagonal 0 black at
        time 0).
      * **Problem 3 is formalised** (Round 5, `MachineModel.Problem3`), so the Round 4 row "Not
        formalised" is superseded. Its quantifier is "not `o(n)`", which only means `≥ ε n`
        *infinitely often*. `Problem3Quantifiers.lean` adds the eventual form `Problem3Eventual`
        (`n = O(time)`) and proves `problem3_of_eventual : Problem3Eventual → Problem3`.
      * **Trust boundaries.** `native_decide` results (`EXH`/`CERT`) also trust Lean's compiler.
        `EMP` results trust only the scripts. The table in `claims.csv` keeps the three apart.
      * **Geometry.** The Leech/Lorentzian lift adds no evidence about Rule 30 (the reviewer retracted
        the earlier suggestion). Golay/Leech structures stay outside the proof track. They are used here
        only as one more observer (`rule30_round6/r6_golay_census.py`).

      ### F. The GLM in this round (companion folder `rule30_round6/`)

      The uploaded `glm_repo.zip` does not contain the GLM runtime front-end (`runtime/parser.py`,
      `session.py`, `tct_engine.py`), so `python -m glm_universal.corpus --ask` cannot run from it. The
      substrate modules import and run, and the experiments use them directly (`golay_decode`).

      * **Observer benchmark** (`r6_observer_benchmark.py`, results `.md/.json`; `EMP`). The predictors
        are frozen after training, scored on two disjoint later segments, and each sequence carries its
        proof label. Lag rules (p ≤ 64), context rules (order ≤ 16), the GLM Golay-24 observer, the
        wobble arrow and an online context learner capture every structured control: period 7, bias 1/3, the binary
        Champernowne sequence (lag-14 at 0.857), and two right-white Rule 30 rows built by column
        inversion with centre columns `1,0,1,0,…` and frequency 1/3. These rows have black density ≈ 0.51
        and look like noise. On the seed's centre column (131072 bits) the best of ~100 predictors
        scores 0.5058 (z ≈ 2.1, the size expected for the maximum of ~100 chance scores), the same as on
        a SHA-256 counter stream (0.5067). The result is **no pattern found at this budget**, which is
        not a proof of escape.
      * **Golay census** (`r6_golay_census.py`; `EMP`): the distance to the Golay code of 41666
        non-overlapping 24-bit blocks. The centre column gives χ² = 3.5 (4 dof), SHA-256 gives 6.1, and
        period 7 gives 3567. The Champernowne sequence, which is provably normal, gives **47**. That is a
        concrete reminder that a finite test is not an asymptotic statement in either direction.
      * **Reasoning test suite** (`r6_reasoning_suite.json`, grader `r6_grade.py`): 23 paired
        claims (9 held out). Each has a verdict, the missing hypothesis, a Lean or data reference, and the
        next admissible test. This is the "category error" benchmark proposed in feedback #1 C and #3 §4.

      ### Where the prize problems stand after Round 6

      | Problem | Proved this round | Precisely what remains |
      |---|---|---|
      | P1 | P1 ⟺ every lag `p` has unbounded mismatches ⟺ escape from lag rules ⟺ escape from finite-state rules. No finite periodically-driven register produces the column (if P1 holds) | A seed-specific identity giving arbitrarily late lag-`p` mismatches, first for some infinite family of `p` |
      | P2 | P2 ⟺ total echo `o(N²)` (spectral form). Every proposed route is either equivalent to P2 or provably insufficient | A seed-specific bound on the total echo (equivalently on `D(n)`) |
      | P3 | Quantifiers made explicit (`Problem3Eventual ⇒ Problem3`) | A lower bound exponential in the input length, beyond current techniques |
      | `TopMonomialConjecture` (map-level, not a prize problem) | Reduced to an `(n−1)`-variable parity. Machine-checked for `n ≤ 20`, `EMP` to `n ≤ 36` | A recurrence or involution for `reducedPhi n` valid for all `n` |
    subsections:
      - "A. The continuous wave, made exact (`Spectral.lean`, feedback #2)"
      - "B. The boundary data of the seed (`SeedBoundary.lean`, feedback #1)"
      - "C. Rule spaces: randomness relative to a declared class (`RuleSpace.lean`)"
      - "D. The parity count: a proved halving (`ParityReduction.lean`, `ParityReductionData.lean`, feedback #3 A)"
      - "E. Ledger reconciliation (feedback #3, section 1)"
      - F. The GLM in this round (companion folder `rule30_round6/`)
      - Where the prize problems stand after Round 6
