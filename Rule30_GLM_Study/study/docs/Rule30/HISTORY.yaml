  - heading: "Round 35: a faster verified checker, the slacks further out, and black runs as window reads"
    anchor: round-35-a-faster-verified-checker-the-slacks-further-out-and-black-runs-as-window-reads
    body: |
      **Brief.** "Continue — take some of the To Do items; the aim is providing and proving answers for
      the Rule 30 questions using the GLM system." Taken: To Do 37 (faster checker), To Do 35 (period-4
      slack, further range), To Do 36 (the per-test mechanism for words with adjacent black cells).

      **To Do 37 — the diagonal search** (`DiagonalSearch.lean`, FORMAL, C332). By the light cone, bit
      `k` of a code enters the space-time picture of the half-line machine along one anti-diagonal
      (cells `(t, k − t)`). The new diagonal is a running xor of the two previous diagonals (shifted)
      seeded with the new bit; `pxor` computes a prefix xor in `⌈log₂ k⌉` shift-xor rounds, and
      `nextDiag_spec` proves the result exact. `diagSearch` walks the same tree as the Round 22 prefix
      search but reads each check off the new diagonal; after the top bit it walks the zero tail the same
      way (`diagTail`). Soundness: `diagSearch_sound`, `dDiesBy_of_diagSearch`. Measured (C337): about
      2–2.5× faster than the prefix search under Lean's evaluator (93 s → 38 s for word `0001`, `d = 28`).
      The node count is unchanged (≈ `2^(k − tests)`), so this is a constant factor.

      **To Do 35 — the slacks further out** (`DiagCert*.lean`, `DiagonalSearchData.lean`, CERT, C333).
      New certificates cover only the new code lengths and are joined to Round 34's by
      `testCountLinearUpTo_extend`: slack 5 for period 2 on `d ≤ 42` (was 34), slack 8 for period 3 on
      `d ≤ 32` (was 28), slack 7 for period 4 on `d ≤ 32` (was 30). With the refutations of Round 33
      these slacks are exactly least on those ranges. All values agree with the Round 34 exact search
      (C328). The question of a slack for all `d` is unchanged.

      **Back to the original setting** (C334, C335). `drivenRunBoundUpTo_of_testCountLinearUpTo` turns an
      observer-clock certificate into a statement about Rule 30 itself: in every left-white row, a
      non-white periodic column at distance `d` from the left edge follows its pattern for at most
      `2(d + 5)` steps (period 2, `d ≤ 42`), `3(d + 8)` (period 3, `d ≤ 32`), `4(d + 7)` (period 4,
      `d ≤ 32`) (`runBound_two_upTo_42`, …, `frontier_round35`).

      **To Do 36 — a black run is one window read** (`BlackRunWindow.lean`, FORMAL, C336). If the drive is
      black at `r` consecutive times `t, …, t + r − 1`, the machine passes those `r` tests iff the `r`
      cells next to the column at time `t` show one particular word (`blackRun_window`); one step of
      Rule 30 under a black boundary maps windows with a fixed first cell bijectively onto shorter windows
      (`window_step`, by left-permutivity). The word is explicit (`blackRun_word`): the period-1 pattern
      `0101…` with its last cell flipped iff the run is followed by a white time — found by computing the
      passing windows for `r ≤ 10` first, then proved for all `r`. Consequences: for two adjacent black
      cells the two tests read the two cells next to the column (`blackPair_window`); for **every** drive,
      a black run of length `≥ d + t + 3` starting at time `t` kills every code of length `d`
      (`dDiesBy_of_long_blackRun`; period 1 is the infinite run). What this does not give: after the edge,
      whether the windows of the surviving codes stay spread out (new To Do 38). In the user's terms: the
      observer at the column reads a window whose width is the length of the black run, and the
      direction of reading is outwards from the column.

      **Not done.** The GLM-side study folder is not part of this round's environment, so no GLM overlay
