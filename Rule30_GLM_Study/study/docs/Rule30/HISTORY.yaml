  - heading: "Round 30: one pipeline (plan, ask, gate, statements) for the GLM Rule 30 investigation"
    anchor: round-30-one-pipeline-plan-ask-gate-statements-for-the-glm-rule-30-investigation
    body: |
      **Request.** To Do 18 and 21 were partly done; To Do 23 (fitted middle steps, goal regression), 24
      (ask and measure), 25 (planner over statements) and 26 (Occam failures) are related and should run
      as one pipeline. Build it and use it.

      **Design.** One search, one hard gate, one refusal rule, four stages: (1) *plan* — the Round 29
      planner with 13 new fitted middle steps (recolour by object property, scale by a count read from the
      grid, lines between objects, falling objects, …) and goal-shape pruning from the back; (2) *ask* —
      when the cheapest consistent plans disagree, ask the oracle for the cell they disagree on, filter,
      re-plan, up to a question budget; (3) *gate* — leave-one-out from plan depth 1 when there are at
      most two demonstrations, from depth 2 otherwise; (4) *statements* — the same planner over candidate
      statements about the period-p half-line problem (families LIN and AMORT; steps *steeper*,
      *analogy*, *implies*), with the level data as hard gate and Lean as the certifier.

      **Lean (`Pipeline.lean`, FORMAL, C289–C291).** Backward runs (`runBack`,
      `run_append_eq_some_iff_runBack`); a fitted middle step is its fitted map (`semMid_eq_some_iff`);
      shape pruning loses no consistent plan (`shapePrune_sound`, `shapePrune_skip`). Each answer of the
      ask loop keeps the truth and removes a plan (`truth_mem_askFilter`, `askFilter_card_lt`); fewer
      questions than plans (`askLoop_questions_lt`); when it answers, the answer is the truth's
      (`askLoop_correct`). A wrong answer means a cheaper consistent rival (`minAgree_wrong_imp`); a gate
      can fix a wrong answer (`gate_can_fix`) and can also drop the truth (`gate_can_drop_truth`).

      **Lean (`PipelineData.lean`, CERT, C292).** The frontier that stage 4 generates is certified: 30
      points `SharpLinear p a b D` / `SharpAmortized p c e D` (bound holds on `d ≤ D`, offset − 1 refuted
      by a witness), collected in `frontier_round30`. LIN p = 2: (1,20) (2,9) (3,5) (4,4) (5,3) (6,2).

      **GLM (study folder `rule30_round30/`, EMP, C293–C296).** Fresh held-out set (132, frozen first):
      Round 29 planner 56 right / 6 wrong → pipeline 96 / 4 → 106 / 5 with ≤ 5 questions; controls refused
      24/24. Ask loop on Round 28 held-out 48 → 77 right (0 → 1 wrong), about 2–2.7 questions per answered
      puzzle. Occam failures are almost all at k ≤ 2 demonstrations (dev k = 1: 13 wrong; k ≥ 3: none);
      the depth-1 gate removes most at a cost in right answers, hence the automatic setting. The planner
      over statements reaches 8 non-dominated survivors in 42 oracle calls (Round 27: enumeration 5,
      repair 4 at 60); its fitted statements transfer 0/16 to held-out levels (Occam for statements:
      offsets fitted on small d fail later). GLM regression suite unchanged.

      **What it means for the prize problems.** No prize problem is closed. The pipeline makes the
      conjecture loop generate and certify the finite frontier of the period-2 rung (To Do 1); a uniform
      proof of any of its statements remains open (To Do 28).
