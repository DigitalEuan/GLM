  - heading: "Round 9: the light cone is fully essential, and the family of wheels"
    anchor: round-9-the-light-cone-is-fully-essential-and-the-family-of-wheels
    body: |
      The aim of this round was to push on the three questions, to give the GLM a cellular-automaton
      carrier ("the Wheel"), and to state the questions so the object is carried inside them.
      Everything below is proved in Lean with no `sorry`, using only the standard axioms.

      ### A. Whole-cone dependence for every `t` (`WholeCone.lean`)

      `wholeConeDependence_holds`: for every `t`, the centre cell `a(t)(0)`, read as a Boolean function of
      the `2t + 1` cells `x_{-t}, …, x_t`, depends on every one of them. Until now this was checked only
      for `t ≤ 6`. The proof uses three ingredients, one per kind of cell:

      * `x_{-t}` (left edge): cone separation.
      * `x_{1-t}` (second cell): the second-cell derivative formula of Round 8. On the all-white row,
        turning on `x_{1-t}` changes `a(t)(0)` by `t mod 2`; on the row with one black cell at `x_t`, by
        `(t − 1) mod 2`. One of the two is odd (`essential_second`).
      * `x_j` for `2 − t ≤ j ≤ t`: the top monomial `x_{2−t} ⋯ x_t` has coefficient 1 (Round 8), and a
        monomial containing `x_j` can only appear if the function depends on `x_j` (`essential_interior`).

      Consequence: `circuit_size_ge`. Every fan-in-2 Boolean circuit computing
      `(x_{-t}, …, x_t) ↦ a(t)(0)` has at least `t` gates, for every `t`. This settles Qwen's Track C
      ("essential inputs = 2n + 1") for all `n`. It does **not** settle Problem 3: as before (error E2),
      it concerns the `t`-step map, with `2t + 1` input bits, not the sequence `n ↦ a(n)` computed from
      the `log n` bits of `n` (`wholeCone_compatible_with_periodicity`).

      ### B. The family of wheels, and questions that carry their object (`ElementaryCA.lean`)

      * `ecaRule r L C R` is bit `4L + 2C + R` of `r`, and `ecaEvolve r x n c` is the run. Wheel 30
        is Rule 30 (`ecaRule_30`, `ecaEvolve_thirty`). (`ecaRule` was already used in `PhaseSpace32.lean`;
        it now lives here and that file imports it.)
      * `WheelProblem1 r x c`, `WheelProblem2 r x c` and `WheelProblem3 r` are the three questions for any
        wheel `r`, initial row `x` and column `c`. `problem1_iff_wheel`, `problem2_iff_wheel` and
        `problem3_iff_wheel` say that for `(30, seed, 0)` they are exactly `Problem1`, `Problem2` and
        `Problem3`. `problem1_selfContained` and `problem2_selfContained` write P1 and P2 using only the
        number `30`, the impulse row `c ↦ [c = 0]` and `ecaEvolve`. Nothing in the statement depends on the
        name "Rule 30".
      * **Symmetry.** `mirrorNum` and `complementNum` act on wheel numbers, with `ecaEvolve_mirror` and
        `ecaEvolve_complement`. The questions are invariant (`wheelProblem{1,2}_{mirror,complement}_iff`).
        So P1 and P2 for 30 are the same questions as for 86 on the impulse
        (`problem{1,2}_iff_eightySix`), and as for 135 on the complemented impulse
        (`problem{1,2}_iff_oneThirtyFive`). The questions belong to the class `{30, 86, 135, 149}`, not to
        one name.
      * **Census.** The 256 wheels form 88 classes (`card_equivalence_classes`). Sixteen are
        left-permutive (`card_leftPermutive`).
      * **Family theorem.** Cone separation holds for every left-permutive wheel
        (`ecaEvolve_flip_left_edge`), not only for 30.
      * **Settled wheels.** Wheel 90 (`L xor R`) on the impulse has centre column `1, 0, 0, …`
        (`ecaColumn_ninety_centre`), so both questions answer *no* (`not_wheelProblem1_ninety`,
        `not_wheelProblem2_ninety`). Wheel 90 is left-permutive too, so this is a concrete case where cone
        separation holds and the answers are *no*. Wheels 0 and 204 are also settled
        (`not_wheelProblem1_zero`, `not_wheelProblem1_identity`). Wheel 90 differs from 30 in its light
        cone: its centre depends only on cells of matching parity (the GLM register computes `[-5,-3,3,5]`
        at `t = 5`), whereas 30 depends on all of them.

      ### C. "Stare at the seed" (Qwen's point 4)

      The impulse row has measure zero, so the almost-every-row theorems (`ae_fsTypical`) do not reach it.
      `SeedFSTypical` is still open, in both directions. What is now proved about the impulse
      specifically:

      * its edges: the left edge and right edge are always black, the first inner diagonal alternates,
        and the right diagonals have period `2^D`;
      * at most one of its columns is eventually periodic, and no column is eventually constant;
      * the questions for it are unchanged under mirror and colour symmetry.

      Every map-level fact (degree `2n − 1`, cone separation, whole-cone dependence) also holds for rows
      whose centre column is periodic. A proof of `SeedFSTypical`, or of its negation, must use the
      impulse row itself, in the way `OnePeriodicColumn.lean` does. No such argument was found this round.

      ### D. The GLM in this round (`rule30_round9/`, outside Lean)

      * The supplied `lattice_geometry.py` works. It needs one more module that is not in the archive,
        `reasoning/frozen_path.py` (imported by `lattice_completion.py`); a stand-in for it is provided.
        The lattice reports now answer (`lattice_geometry_check_output.txt`).
      * A new enabled domain `automata` (the Wheel) holds the 256 wheels, each named by its truth table
        (`wheel_00011110`), and exact carriers for the wheel-30 impulse run (`r30_wobble_D_N`,
        `r30_anf_degree_n`, `r30_essential_inputs_n`, `r30_cone_separation_derivative`,
        `r30_lag_predictor`, and the three questions). Each carrier records its statement, its evidence
        class and its Lean theorem. `describe`, `compare`, `real` and `report wheel` answer from it. An
        OPEN carrier refuses to supply a value. See `rule30_round9/README.md`.

      ### Where the prize problems stand after Round 9

      | Problem | Proved (all rounds) | Precisely what remains |
      |---|---|---|
      | P1 | Period `1` excluded. At most one column is eventually periodic. Holds for almost every row. Same question for wheels 30, 86 (and 135 on the complemented impulse) | Exclude every period `p ≥ 2` for the centre |
      | P2 | Holds for almost every row. Equivalent to `D(n) = o(n)` | A seed-specific bound on `D(n)` |
      | P3 | Stated for Turing machines. **Light-cone map needs all `2t+1` inputs and `≥ t` gates, for every `t` (Round 9)** | A lower bound for `n ↦ a(n)` from the `log n` bits of `n` |
