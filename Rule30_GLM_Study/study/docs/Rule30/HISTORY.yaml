  - heading: "Round 31: the sideways observer; barrier diagonals; exact arithmetic throughout"
    anchor: round-31-the-sideways-observer-barrier-diagonals-exact-arithmetic-throughout
    body: |
      **Request.** Continue from the To Do list and complete what can be completed; keep to exact
      arithmetic (no floating point, no random operators, no hashing inside computations), because
      drift and disruptive operations obscure the fidelity the study needs.

      **Lean (`SidewaysView.lean`, FORMAL, C297–C300).** Rule 30 is left-permutive, so two neighbouring
      columns determine the column to their left: `recon bd u` reconstructs every column of the
      half-line from the drive `bd` and the first column `u`. This is the observer `Y` turned through
      90° — standing on the driving column and reading outwards along the rows.
      * `survives_iff_sideways`: the machine started from code `S` never fails iff some *admissible*
        `u` (`u t = !bd (t+1)` at black drive times, free at white drive times) reconstructs `S` as the
        time-0 row. Hence `halfLineDies_iff_sideways`: `HalfLineDies p` says exactly that no admissible
        first column reconstructs a row with finitely many (and at least one) black cells.
      * `halfLineDies_one_sideways`: with no white drive times the admissible column is forced and the
        forced row is `0101…`, so period 1 follows in one line. Every other word has one free bit per
        white drive time; controlling that freedom is the open content of the rung.
      * `infinite_row_survives` (blocked route, To Do 20): with infinitely many black cells allowed,
        the machine survives forever under **every** drive. Any argument that does not use the
        finiteness of the row — in particular a finite quotient that keeps a bounded window next to the
        column and treats the far cells as free — cannot prove `HalfLineDies p`.
        `survivor_for_every_horizon`: for every drive and horizon `T` some positive code of length
        `T + 2` survives `T` steps (no death time independent of the code length).

      **Lean (`BarrierDiagonalsData.lean`, CERT, C301–C302).** To Do 3 answered. Exact longest lives
      `Lmax d` for the words `100, 110, 1000, 1100, 1110`, `d ≤ 20` (`lmaxWord_spec`; `10` is
      `lmaxTwo_spec`, `d ≤ 32`). The diagonal `d + Lmax d` on which the longest life ends depends on the
      word (`barrier_depends_on_word`: at `d = 8` the six words give `18, 32, 20, 36, 20, 24`), and for
      the word `10` it takes 28 distinct values for `d ≤ 32` (`barrier_set_not_small_two`). The small
      "barrier" set seen in the two-sided run bound is not a property of the machine. The growth of
      `Lmax` also depends on the word (`lmax_ratio_word`: `Lmax 16 = 72` for `1000`, `20` for `1110`).
      `frontier_round31` collects the round.

      **EMP (`scripts/barrier_diagonals.c`, output to `d = 28`).** Word `100` reaches `Lmax 22 = 87`
      and `1000` reaches `Lmax 28 = 96`: the words with few tests per period live longest, and no word
      shows a small fixed set of ending diagonals.

      **Exact arithmetic (C303).** Every script in the package's `scripts/` folder and the Round 28–30
      study overlays were checked for floating point, random numbers and hashing. Two uses touched a
      computation: the ratio column of `scripts/post_edge_halving.c` (now printed as the exact reduced
      fraction `a/2^e`; output regenerated, counts unchanged) and `floor(log2 n)` in
      `scripts/tuning_by_ear.py` (now `n.bit_length() - 1`; output unchanged). An unused `math.h`
      include was removed from `scripts/echo_profile.c`. The study-side GLM scripts use SHA-256 only to
      fingerprint benchmark files, outside any computation, and floating point only for wall-clock time
      budgets. The earlier study rounds (`rule30_round6`–`16`) were not re-audited.

      **What it means for the prize problems.** No prize problem is closed. The period-`p` rung of
      Problem 1 is now stated as a statement about the sideways reader, period 1 has a one-line proof
      in that frame, and the "finite window" and "barrier diagonal" routes are closed off with proofs
      and certificates.
