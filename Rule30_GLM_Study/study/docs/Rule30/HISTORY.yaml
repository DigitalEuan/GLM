  - heading: "Round 38: the hypothesis engine — statements, held-out falsification, laws, a prediction"
    anchor: round-38-the-hypothesis-engine-statements-held-out-falsification-laws-a-prediction
    body: |+
      **Brief.** "Continue this Rule 30 project — let's see if we can get the GLM to solve these puzzle
      questions. I have attached my concept 'Hypothesis Engine' … see if you can improve on my concept
      and get this working properly with strong application results here." Guide: `HYPOTHESIS_ENGINE.md`.

      **The v4 audit** (C360). The attached `glm_hypothesis_engine_v4.py` returns "passed" on Rule 30's
      centre column, an LFSR m-sequence, a period-7 word, the word `10` and a constant word alike. Its
      hypotheses are parameter triples, not statements, and its check uses floats and `hash` (rule 7).
      Its architecture (cheap guess → rigorous check → failure-guided refinement → loop) is kept.

      **The v5 engine** (study folder `rule30_round38/`, C361). Statements with exact per-instance
      tests and Lean renderings; development range, held-out ranges, controls; cut, narrow, mechanism
      mining; junctions with a named separating observation; a law-driven predictor; credit against the
      ledger after generation; a `sorry`-guarded hand-off file for the prover. The generic core is
      `glm_hypothesis_core.py`.

      **What it found, and what Lean proved.**
      * `LeftDiagonalPeriods.lean` (FORMAL, C351–C353): the one-bit machine with a reset; the period
        law of the left diagonals; unbounded periods force infinitely many eventually white left
        diagonals; seed-forgetting for every left-white row.
      * `LeftDiagonalPeriodsData.lean` (CERT, C354–C358): the packed-row certificate; period 8 for
        `D < 400` and its refutation at 400 (white 399, odd 398); period 16 for `D < 87867` and its
        refutation at the engine-predicted 87867; the white list below 87868; the first possible seed
        differences; the centre column reads every left diagonal `20 ≤ D < 20000` inside its transient.
      * Open (C359): are the left-diagonal periods unbounded?

      **Scorecard.** 22 hypotheses; 4 false generalisations caught on held-out data; 7 ledger facts
      rediscovered without reading the ledger; 1 junction separated; 1 prediction made and confirmed.
      To Do 44 (the GLM proposes spokes) is partly done. No prize problem is settled.

