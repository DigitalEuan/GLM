  - heading: "Round 41: the self-dialogue engine — v10 reviewed, v11 rebuilt"
    anchor: round-41-the-self-dialogue-engine-v10-reviewed-v11-rebuilt
    body: |+
      The owner supplied `hypothesis_engine_v10.py`. After generating hypotheses, it questions itself
      about each one: state it, ask what would refute it, what it implies, how it connects, what next.

      **Review** (`rule30_round41/v10_audit.py`, EMP, C387).
      * The script imports `hypothesis_engine_v8`, which is not in the project. It also calls four stage
        methods that the Round 38 engine does not have.
      * 15 of its 24 utterances are mostly fixed text chosen by keywords.
      * Two of them carry numbers not in the ledger (the "275 million" estimate is superseded by
        C370/C381).
      * Two of its fixed implication sentences are wrong or overstated, and are now settled in Lean.

      **Proved** (`../HypothesisEngine/DialogueChecks.lean`, FORMAL).
      * "Read inside the transient ⟹ the centre column is aperiodic" does **not** follow
        (`transient_read_does_not_imply_aperiodic`, C384). This matters because the premise is certified
        for Rule 30 (`centerCol_read_in_transient`).
      * "Aperiodic ⟹ no finite automaton generates it" is true only for automata that read the
        sequence. Thue–Morse is aperiodic and computed by a two-state automaton reading `n` in binary
        (`aperiodic_but_automatic`, C385). So Problem 1 alone would not settle Problem 3.
      * Two doubling laws mined by the new dialogue are equivalent, so no data can split them
        (`doubling_law_tie_unsplittable`, C386).

      **Built** (`rule30_round41/`, EMP, C388): the v11 dialogue. Every answer is an executed action, or
      a citation of a checked edge in `knowledge.json`. A guard checks every number it utters. From
      Rule 30's diagonals `D < 400` alone, it did the following by itself:
      * refuted the white list at 53207 and the period bounds at 400 and 87867;
      * mined the white criterion and the doubling law (both proved earlier);
      * refuted the one-conjunct law at 53208, and reported the remaining tie as an equivalence;
      * produced 0 ungrounded numbers in 266 utterances.

      On the eight benchmarks it extended every survivor, and proposed "Collatz stopping times are
      unbounded" after four refuted bounds.

      **Not achieved.** No prize problem is closed; To Do 45–49 are unchanged.

