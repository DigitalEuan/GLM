  - heading: "Round 42: engine v13 checked; reasoning guards; the TAX route closed"
    anchor: round-42-engine-v13-checked-reasoning-guards-the-tax-route-closed
    body: |+
      The owner supplied `hypothesis_engine_v13.py`. It is self-contained, runs here in about 20 s, and
      adds a TAX tool and a three-way test of "TAX defects explain the period doublings".

      **Lean** (`../HypothesisEngine/TaxChecks.lean`, FORMAL; `TaxChecksData.lean`, CERT).
      * `tax_conserved_iff_defect_zero`: TAX conservation is independent of `Y`, which can be any real
        number. `tax_defect_eq` gives the defect as `−2(3c² − 2c(a+b) + ab)`. `docstring_criterion_wrong`
        shows that v13's criterion `c ∈ {0, a, b}` fails in both directions (C389).
      * `tax_conserved_at_doubling`: wherever the doubling law applies, the pair `(D−1, D)` is
        TAX-conserved. So "a defect is necessary for a jump" is false, and v13's "positive finding" is a
        consequence of `white(D−1)` (C390).
      * `tax_conserved_pairs_below_400`, `tax_conserved_not_only_white` (CERT): 25 conserved pairs
        below 400, 15 of them with two non-white, different patterns (C391).

      **Study folder** `rule30_round42/` (EMP, C392): `v13_audit.py`, `glm_guards.py` (five portable
      guards), `tax_guards.py`, `make_v14.py` → `hypothesis_engine_v14.py`, `test_round42.py`.

      **Status.** No prize problem is closed. The TAX route to explaining the doublings is closed.

