  - heading: "Round 34: does period 4 have a finite slack? The divisor rule and the observer's phase; the GLM takes its own step"
    anchor: round-34-does-period-4-have-a-finite-slack-the-divisor-rule-and-the-observers-phase-the-glm-takes-its-own-step
    body: |
      **Request.** Continue. Keep using the GLM and its three columns to pick the way through the
      puzzle, and grow the GLM where the puzzle demands it.

      **How the round was steered.** The Round 33 GLM was installed fresh and asked first
      (`rule30_round34/glm_consult_before_output.txt`). Its `tool next` picked To Do 35 ("does period 4
      have a finite observer-clock slack?") and named the finite step: run the exact longest-life search
      for the three-black words and certify any new record. It could not take that step itself, nor
      answer `derive HalfLineDies4 => HalfLineDies2` (alignment 1/7 on the frozen Round 34 questions).
      The round took the named step, proved the structure the questions needed, and gave the GLM the
      missing abilities.

      **EMP (C328, C329; `rule30_round34/test_slack34.c`).** An exhaustive search over codes, lowest bit
      first, keeping the space-time light cone incrementally (one diagonal per bit), so a branch dies as
      soon as a check before the edge fails. No period-4 word exceeds slack 7 on `d ≤ 37` (all 15
      words); the three-black words stay within 7 to `d ≥ 102`, and on the upper half of their ranges
      their excess is at most 3 (downward drift). Period 3: record 8 unchanged to `d = 42`. Period 2:
      record 5 unchanged to `d = 54`. Period 1: 0, 2 alternating to `d = 300`. No refuting family.

      **Lean, certificates (C327; `SlackCert*.lean`, `TestCountPeriodsData.lean`).** Every code of length
      `d ≤ 30` fails within `d + 7` tests of every period-4 word (`testCountLinearUpTo_four_seven`), so the
      least period-4 slack on `d ≤ 30` is exactly 7. Period 3 slack 8 on `d ≤ 28`, period 2 slack 5 on
      `d ≤ 34`. The four one-black period-4 words are checked in separate files so they build in
      parallel. `frontier_round34` collects the round.

      **Lean, FORMAL (C325, C326; `TestCountPeriods.lean`).**
      * *Divisor rule.* A word of period `p` written out over `q = m p` drives the machine identically
        (`driveN_repeat`). So `TestCountLinear q c → TestCountLinear p c` and
        `HalfLineDies q → HalfLineDies p` for `p ∣ q`, and refutations pass to multiples: every period
        divisible by 4 needs slack ≥ 7, by 3 needs ≥ 8, every even period needs ≥ 5.
      * *The observer's phase* (the user's perspective idea). `TestSlack bd c` is the slack of one drive.
        One step turns a code of length `d` into one of length `d + 1` (`halfStep_length`), so the slack
        seen from a start one step later gives the slack `+ 2` from the earlier start (`+ 1` when the
        skipped time is white; `+ 2 s` for `s` steps): `testSlack_of_shift`, `testSlack_of_shift_white`,
        `testSlack_of_shift_iter`. The four rotations of `0111` have records `7, 6, 5, 4` (EMP).

      **EMP, the GLM's next pick (C331; To Do 36; `rule30_round34/alive_decay34.c`).** After the round the
      GLM picked To Do 36 (why the excess drifts down). Exactly, from `survivors_card`: excess = (tests
      after the edge until the last code dies) − (free bits at the edge) − 1. On `d ≤ 25` the post-edge
      tests remove about one bit each for every word tried; the drift is a large-`d` effect.

      **GLM (C330; `rule30_round34/`).** `tool slack P K D` (the exact search inside the GLM, three
      columns, Occam reading of when the record was last raised, comparison with the Lean frontier);
      the divisor rule in the theorem wheel (spokes `X<q> => X<p>` citing `testCountLinear_of_dvd`,
      `halfLineDies_of_dvd`) and lifted refutations in `tool discuss`; `tool clock` and `tool next` on the
      Round 34 frontier. Self-test passes; consultation 1/7 → 7/7 (development questions, frozen
      before the overlay). After the round `tool next` refuses more search on To Do 35 ("needs an idea")
      and picks To Do 36, 29, 34.

      **What it means.** On the observer's clock period 4 behaves like periods 2 and 3: a small constant
      slack (7) that stops moving, with no sign of a family that defeats every slack. The divisor rule
      means a slack law for period 4 would also give the period-2 rung (`HalfLineDies 2`). No prize problem is settled. P1, P2
      and P3 remain open.
