          - - P2
            - "`SeedFSTypical ⇒ P1 ∧ P2`. `SeedFSTypical` holds for almost every row. The diagonal coupling alone cannot decide it"
            - Prove `SeedFSTypical`, or only its constant-observer case
          - - P3
            - Formal statement `Problem3` in a uniform model. Circuit lower bounds for the generic map (conditional, and checked for `t ≤ 6`). Two models shown to be trivial
            - A super-polynomial time lower bound in the input length for one explicit function. This is beyond current techniques
