  - heading: "Round 26: the conjecture loop — the GLM proposes lemmas, tests them, narrows, loops"
    anchor: round-26-the-conjecture-loop-the-glm-proposes-lemmas-tests-them-narrows-loops
    body: |
      **Input.** (1) Continue the To Do items. (2) "Can we get the GLM to propose possible axioms or
      lemmas and test them, narrowing and looping for some iterations — analogy/junctions may help to
      propose original construction steps." Round 25 tuned candidate *laws for the data*; this round tunes
      candidate *statements*. Nothing in this round settles a prize problem.

      ### Why statements can be tuned like notes

      Almost every open target of the package (`HalfLineDies p`, `HalfLineLinear p a b`, `TuneExcessLog`,
      …) is a conjunction of infinitely many finitely checkable instances. So a candidate lemma is given
      by its *level test* `τ : ℕ → Bool` and holds when every level passes. One failing level is a Lean
      proof of the negation; surviving `N` levels is evidence up to `N` only.

      ### The loop, made exact (`ConjectureLoop.lean`, FORMAL, standard axioms only)

      | Step | Theorem | Meaning |
      |---|---|---|
      | test | `refuted_of_fail`, `SurvivesTo.of_holds`, `holds_iff_survivesTo` | pruning is sound; the truth is never pruned |
      | loop | `loop_prunes_false`, `loop_keeps_true` | with unbounded test levels every false candidate is eventually pruned, no true one ever is |
      | narrow | `narrow_mono`, `narrow_le_of_holds`, `narrow_bounded_iff`, **`narrow_eventually_eq`** | for a graded family (bigger parameter = weaker statement) the frontier (least parameter still standing) only rises, never passes a true member, is bounded iff some member is true, and then **settles exactly on the least true parameter** |
      | junction | `Junction`, `survivesTo_of_junction`, **`junction_split`**, `junction_forever_iff` | candidates no read below level `N` separates share their fate there; a true and a false candidate are always split by a finite read; a junction lasts for ever only between identical tests |
      | construct | `meet`, `meet_holds_iff`, `survivesTo_meet_of_junction` | from a junction, propose the **meet** (both at once): a sharper statement with the same support |
      | analogy | `analogy_transport_unsound`, `useful_survivor` | transporting a true statement can give a false one: analogy proposes, testing decides; a survivor is *useful* when a proved implication carries it to a target |

      ### The loop, run (`scripts/conjecture_loop.py`, EMP; certified verdicts in `ConjectureLoopData.lean`)

      Four rounds, test levels rising (`n ≤ 100, 1000, 10000, 131072` for the echo family, `d ≤ 8, 11,
      14, 17` for the half-line machine). Proposal operators: SEED (To Do targets), ANALOGY (transport of a
      proved source theorem), NARROW (move to the frontier and probe just below it), JUNCTION (meet of
      candidates the data touches at the same point), REPAIR (weakest natural repair of a refuted shape).
      The full trace is `scripts/conjecture_loop_output.txt`. What it found:

      **1. The echo family (To Do 16).** First a new exact identity (`EchoBound.lean`, FORMAL):
      `excess_le_iff_not_echo` — the excess `n − tuneCost n` of Round 25 is exactly the length of the
      longest *echo*: the longest final block of the first `n` notes that occurred before. This makes the
      quantity cheap to compute and to certify (sorting the blocks, `repeatFree_of_check`). The loop then
      narrowed `EchoLogBound a b` (`echo ≤ a·log₂ n + b`, every member ⇒ P1,
      `problem1_of_echoLogBound`) slope by slope:

      | slope `a` | sharp frontier at `n ≤ 131072` (CERT) | refuted just below (FORMAL from one echo) |
      |---|---|---|
      | 0 | `b = 33` (`echoLogBound_0_33_upto`) | `not_echoLogBound_0_32` (`n = 83154`, echo 33, period 37595) |
      | 1 | `b = 17` (`echoLogBound_1_17_upto`) | `not_echoLogBound_1_16` |
      | 2 | `b = 2` (`tuneExcessLog_upto_131072`) | `not_echoLogBound_2_1` (`n = 1995`, echo 22, period 1767) |
      | 3 | `b = 0` (`echoLogBound_3_0_upto`) | — |

      So `TuneExcessLog` (= `EchoLogBound 2 2`) is certified to `n ≤ 131072` (was 2000) and is **sharp**.
      The constant frontier keeps rising (16, 22, 25, 29, 33 at `n` = 10³ … 1.3·10⁵), the slope-1 frontier
      too (8 → 17), while the slope-2 frontier has stayed at `b = 2` since `n = 1995`; this matches the
      random-sequence heuristic (longest echo ≈ `2 log₂ n`) that the ANALOGY operator proposed. EMP
      (`scripts/echo_profile.c`): `TuneExcessLog` still holds at `n = 10⁶`, with equality only at
      `n = 1995`. A junction appeared at round 2 (`ECHO(2,0)`, `ECHO(1,8)`, `ECHO(0,16)` all touched by the
      data at `n = 448`); its meets were proposed and split by the next read (`n = 1419`, `1994`).
      Proved outright on the way: `excess_succ_le` (the echo grows by at most one per note).

      **2. Post-edge halving (To Do 1, 10, 12).** The To Do suggestion "after the edge, every window of
      `m` steps kills a fixed fraction" is `WindowHalving p m num den` (`AmortizedHalving.lean`). The loop
      refutes it: survivors sit on plateaus (`not_windowHalving_of_plateau`). Certified: for the drive
      `1,0,1,0,…` and `d = 11`, two codes stay alive from time 17 to 29, so **no fraction `< 1` works for
      any window `m ≤ 12`** (`not_windowHalving_two`). The REPAIR operator proposed the amortised form
      `AmortizedHalving p c e`: `m` steps after the edge at most `2^(d−1+e)/2^⌊m/c⌋` codes are alive.
      Proved: `AmortizedHalving p c e → HalfLineLinear p (c+1) (c·e)` (`halfLineLinear_of_amortized`), hence
      `HalfLineDies p` (`halfLineDies_of_amortized`). Narrowed: `(c, e) = (4, 1)` for periods 2 and 3,
      certified for every word, `d ≤ 12` and all times (`amortizedHalvingUpTo_2_4_1`,
      `amortizedHalvingUpTo_3_4_1`), with sharp slack (`not_amortizedHalving_2_4_0`,
      `not_amortizedHalving_3_4_0`). EMP: the frontier `(4, 1)` did not move between `d ≤ 11` and
      `d ≤ 17`. `AmortizedHalving 2 4 1` is now the sharpest *useful* open candidate for the period-2 rung.

      **3. Analogies that fail (FORMAL refutations).** Period 1 → period `p`: "dies by `d + 2`"
      (`constDrive_dies`) is false for `p = 2, 3` (`not_halfLineLinear_two_one_two`,
      `not_halfLineLinear_three_one_two`). Rule 86 → Rule 30: the counting law is exact for Rule 86 at
      every time and false for Rule 30 at `T = d = 3` (`analogy_rule86_rule30`).

      **4. Drive symmetry (To Do 2, FORMAL).** Dying for a drive started late implies dying for the drive
      (`wordDies_of_shift`); for a periodic drive all rotations are equivalent
      (`wordDies_shift_iff_of_periodic`). So `HalfLineDies 2 ↔` the single word `1,0`
      (`halfLineDies_two_iff`) and `HalfLineDies 3 ↔` the two words `1,0,0` and `1,1,0`
      (`halfLineDies_three_iff`).

      ### Cautions

      * Every survivor is evidence only up to its level (`no_finite_confirmation`); every refutation is
        final.
      * `AmortizedHalving` is about the one-sided machine, which over-approximates the real two-sided runs
        (as in Round 21): it gives upper bounds.
      * The loop is a proposal engine with a sound filter. It does not search all statements; it searches
        the families it is given, plus what analogy, junctions and repairs build from them.

      ### Where the prize problems stand

      All three open. New sufficient targets with proved implications: `EchoLogBound a b` for any `a, b`
      (⇒ P1) and `AmortizedHalving p c e` (⇒ the period-`p` rung). `frontier_round26` collects the round.
