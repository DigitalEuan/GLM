  - heading: "Round 21: Problem 1 needs only the left half-line"
    anchor: round-21-problem-1-needs-only-the-left-half-line
    body: |
      **The idea.** Suppose column `c` of a left-white row is periodic. Rule 30 reads `L, C, R`, so the
      cells to the left of `c` evolve **on their own**: the cell next to the column reads the column itself
      as its right input. The left half-line is a deterministic machine **driven** by the periodic column.
      Rule 30 also hands this machine a test: when the column is black, its next value is
      `not (cell c − 1)` (`col_black_forces_left`). So at every black time of the drive, the machine's
      cell next to the column must be the complement of the drive's next value. If the machine ever fails
      this test, the column could not have been periodic. **No cell to the right of the column is
      involved.**

      New files (all imported by `RequestProject/GLM/Rule30.lean`; no `sorry`, no added axioms):

      * `PeriodTwoHalfLine.lean` (FORMAL): the alternating case. The half-line is a natural number
        (bit `i` = cell `c − 1 − i`) and one step is `halfStep b S = (S >>> 1) ^^^ (S ||| (S <<< 1 ||| b))`
        (`testBit_halfStep`: it is Rule 30 bit by bit). `halfState_eq_evolve`: the machine equals the real
        run while the column alternates. `altRun_lt_of_halfDiesBy`: a machine failure by time `T` means the
        column cannot alternate on `[0, T]`. **`leftWhiteAperiodic_two_of_halfLineDies`**: the one-sided
        target `PeriodTwoHalfLineDies` (every half-line word fails eventually) implies the period-2 rung.
      * `PeriodTwoHalfLineData.lean` (CERT): every word of `d ≤ 24` cells fails by time `halfBound d`
        (values `7, 6, 5, 6, 9, 10, 12, 17, 18, 17, 30, 29, 28, 32, 31, 30, 31, 33, 38, 37, 36, 41, 43, 42`,
        exact for the machine: `halfBound_sharp`). So alternating runs are bounded for `d ≤ 24`
        (`altRunBound_upTo_24`; was `d ≤ 18`), and with the constant-run bound every period-2 run is
        (`runBound_two_upTo_24`). All values are `≤ 2d + 8`; the linear one-sided target
        `PeriodTwoHalfLineLinear` implies the period-2 rung and is certified for `d ≤ 24`.
        The certificate needs only `2^(d−1)` words, against `2^(d + B)` for the Round 16 search.
      * `HalfLineMachine.lean` (FORMAL): the same for **every period** `p`. A `p`-periodic column follows
        the drive `driveN p k` whose word `k` is its first `p` values (`col_eq_driveN`).
        **`leftWhiteAperiodic_of_halfLineDies`** and **`problem1_of_halfLineDies`**: if for every `p ≥ 1`
        no non-white periodic drive keeps a finite half-line consistent forever (`HalfLineDies p`), then
        Problem 1 holds. **`halfLineDies_one`** (proved): under the constant black drive the machine is
        forced into the fixed pattern `0101…` (`constDrive_pattern`) and fails by time `d + 2`; corollary
        **`blackRun_bound`**: a black constant run at distance `d` from the edge lasts at most `d + 1`
        steps, for every `d`.
      * `HalfLineMachineData.lean` (CERT): driven run bounds for periods 3 (`d ≤ 20`), 4 (`d ≤ 18`),
        5 and 6 (`d ≤ 16`), previously `d ≤ 14` and `d ≤ 12`; `frontier_halfLine` collects the new
        frontier.

      **Caution.** The machine ignores the right side, so its bounds are *upper* bounds for the real runs
      and are larger than the exact values (`d = 11`: machine `30`, real `13`). It does not satisfy the
      Round 16 guess `2d + 7` (fails at `d = 11`), hence the `2d + 8` in the linear target.

      **Experiments (EMP).** `scripts/half_line_search.py` computes the period-2 machine bound by
      searching the half-speed sequence (column `c − 2`, one bit per two steps) instead of the cells:
      about `2^(d/2)` branches. It agrees with the brute force for `d ≤ 20` and stays `≤ 2d + 8` for
      `d ≤ 42` (`scripts/half_line_search_output.txt`). Consecutive distances often end on the same left
      diagonal (`d + B(d)` plateaus), the barrier pattern of `AUDIT.md` §5.1, now seen in the machine too.

      **Why 2d (counting heuristic, EMP).** The machine has `d` free cells and receives one test per
      black time of the drive. If the tests behaved independently, it would fail after about `d` tests,
      i.e. at time about `p·d / (black cells per period)`: about `2d` for period 2 and about `6d` for a
      period-6 word with one black cell (data: `104` at `d = 16`). A uniform proof of `HalfLineDies p`
      has to show that the tests are independent enough. That is the open core of the period-`p` rung.

      **The perspective reading.** The column's consistency can be audited **from the left only**: at a
      black time the column's update involves only the cell to its left, while at a white time it involves
      both neighbours. Looking right, the observer never receives a test on its own, and indeed any
      column sequence is realised by some row (`ColumnInverse.column_inverse_exists`); the finite left edge
      is what makes the left-facing test bite. In the GLM frame: the observer `Y` sitting on the column
      and facing left (towards the side in which Rule 30 is permutive) is the one that can refute a periodicity proposal.

      **Tools.** `scripts/ledger_check.py` resolves every Lean name cited in `claims.csv` (420 names, all
      found), records axiom footprints, and flags class/footprint mismatches; `--wheel out.json` writes
      the ledger as carriers for the GLM theorem wheel. Ledger rows C213–C221.

      ### Where the prize problems stand after Round 21

      All three are still open. Problem 1 is now reduced to a statement about the left half-line alone
      (`problem1_of_halfLineDies`), with period 1 proved inside the new frame and periods 2–6 certified
      further out. The narrowest open rung is `PeriodTwoHalfLineLinear` (or `PeriodTwoHalfLineDies`).
