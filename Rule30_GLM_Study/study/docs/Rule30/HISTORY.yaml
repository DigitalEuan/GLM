  - heading: "Round 13: the stack lift, the propose-and-check loop, and the chemistry lab"
    anchor: round-13-the-stack-lift-the-propose-and-check-loop-and-the-chemistry-lab
    body: |
      **The three prize problems remain open.** This round turns three of your suggestions into
      theorems: running the GLM's propose-and-check loop through the stack, asking what vocabulary the
      GLM is missing, and treating the puzzle as a chemistry lab.

      | File | Contents |
      |---|---|
      | `LeftWhiteLift.lean` | left-white rows; the class is closed under the rule (every row of the stack); `LeftWhiteAperiodic p`; period 1 proved; the lift implies Problem 1; run bounds; the propose-and-check loop and its horizon |
      | `LeftWhiteCompactness.lean` | compactness: `LeftWhiteAperiodic p ↔ ∃ B, RunBound p B`; packaged forms `LeftWhiteAperiodicAll`, `RunBoundsAll` |
      | `RunBoundData.lean` | *computation*: exact run bounds over **all** left-white rows (period 2 for `d ≤ 7`, sharp; periods 3–6 for `d ≤ 4`; period 1 exact `d + 1` for `d ≤ 7`) |
      | `ChemistryLab.lean` | the reaction table is balanced; the rule is irreversible; coboundaries; *computation*: no conservation law of range `≤ 6` in the seed run |

      ### A. The stack lift (`LeftWhiteLift.lean`, `LeftWhiteCompactness.lean`)

      Every row of the seed's space-time diagram is white to the left of a black cell (*left-white*),
      and the image of a left-white row is left-white (`isLeftWhite_evolve`). The period-1 case of
      Problem 1 (Round 7) was in fact proved for every left-white row. Lifting Problem 1 the same way:

      * `LeftWhiteAperiodic p`: no column of any left-white row is periodic with period `p` from some
        time on. Because every later row of the stack is again left-white, it is enough to check it
        from time `0` (`leftWhiteAperiodic_iff_from_start`).
      * `leftWhiteAperiodic_one` (proved). `leftWhiteAperiodic_of_mul`: period `p·k` gives period `p`.
      * **`problem1_of_leftWhiteAperiodic`**: if `LeftWhiteAperiodic p` for every `p ≥ 1`, then
        Problem 1. It is enough to have the factorials (`problem1_of_leftWhiteAperiodic_factorial`).
      * `RunBound p B`: a column at distance `d` from the edge stays `p`-periodic for at most `B d`
        steps. `runBound_one`: `B d = 3d + 5`. **`leftWhiteAperiodic_iff_runBound`**: the qualitative and
        the quantitative forms are equivalent (a compactness argument, `exists_run_limit`).

      The lifted statement is stronger than Problem 1 (it is about every left-white row, not only the
      seed), so it could fail for some `p` while Problem 1 holds. Exact searches support it for small
      periods: see C. Its value is that it is closed under the rule, so a proof can use induction along
      the stack, which a statement about one row cannot.

      ### B. The propose-and-check loop (`LeftWhiteLift.lean`)

      * `Refutes a p N t`: the observation at time `t` refutes the proposal "period `p` from time `N`".
      * `problem1_iff_every_proposal_refuted`: Problem 1 says every proposal is eventually refuted.
      * `refutation_horizon_of_runBound`: with a run bound the refutation of `(p, N)` arrives by time
        `N + B N + 1`. `refutation_horizon_one`: for `p = 1` by time `4N + 6`, for every `N`.

      So the loop is guaranteed to terminate on every proposal of period `p` exactly when the lifted
      statement holds for `p`. For the rows (as opposed to the column) the loop was settled in Round 10:
      rows `0..4` determine wheel 30, rows `0..3` do not (wheel 62 differs only on `101`, which first
      appears in row 3), and from then on every proposed row is confirmed.

      ### C. Run bounds checked over all left-white rows (`RunBoundData.lean`)

      * `runCheck_sound`: the column at distance `d` up to time `L` depends only on `d + L + 1` cells,
        so a finite check covers **every** left-white row.
      * `runBound_two_upTo_seven` and `runBound_two_sharp` (CERT): the longest 2-periodic run at
        distance `d = 0..7` is exactly `1, 7, 6, 5, 5, 8, 9, 9`.
      * `runBound_small_periods` (CERT): periods 3–6 at `d ≤ 4`. `runBound_one_sharp_upTo_seven`
        (CERT): for period 1 the exact bound is `d + 1` (the proved general bound is `3d + 5`).
      * `EMP` (`rule30_round13/r13_periodic_runs_output.txt`): exact values for `p ≤ 6`, `d ≤ 7`, and a
        search for period 2 that dies within 38 steps for every `d ≤ 24`.

      The period-2 case of the lifted statement, uniformly in `d`, is the narrowest open rung.

      ### D. The chemistry lab (`ChemistryLab.lean`)

      * `reaction_table_balanced`: 4 of the 8 neighbourhoods produce black, so from a fair-coin row each
        new cell is again a fair coin. (The full statement, that the fair-coin mixture is an equilibrium
        of the whole row, is `Invariance.lean`, Round 4.)
      * `step_not_injective`: all-black and all-white both react to all-white; the reaction is
        irreversible.
      * `coboundary_total_zero`: a weight `f(w) = g(tail w) − g(init w)` has total `0` on every finite row.
      * **`seed_run_no_conservation_law`** (CERT): for every range `r ≤ 6`, a window weight whose total is
        the same on rows `0..T_r` of the seed run is a coboundary, so there is **no non-trivial conserved
        quantity of range `≤ 6`**. The proof is a rational matrix identity checked by `native_decide`
        (`coboundary_of_cert`).

      In chemistry, conservation laws fix yields. Problem 2 asks for a yield (frequency 1/2), and the
      lab has no conservation law of small range that could fix it, so that route is blocked at those
      ranges.
    subsections:
      - A. The stack lift (`LeftWhiteLift.lean`, `LeftWhiteCompactness.lean`)
      - B. The propose-and-check loop (`LeftWhiteLift.lean`)
      - C. Run bounds checked over all left-white rows (`RunBoundData.lean`)
      - D. The chemistry lab (`ChemistryLab.lean`)
