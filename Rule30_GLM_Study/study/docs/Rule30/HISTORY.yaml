  - heading: "Round 29: a stepwise planner for puzzles; the inner-survivor form refuted"
    anchor: round-29-a-stepwise-planner-for-puzzles-the-inner-survivor-form-refuted
    body: |
      **Request.** Most puzzles were not being solved: a single step is rarely enough. Use a pipeline of
      carefully chosen steps, built from planning methods already proven to work (the GLM's stepwise
      planner and others), and move on with To Do items.

      **What was built on.** Nothing new was invented for the control loop. The GLM's stepwise planner
      (`runtime/stepwise.py`: a chain is licensed when every step is; the answer is given only when
      every licensed reading agrees) and its search loop (`reasoning/search_loop.py`, `SearchLoop.lean`:
      hard gate D1, Occam C5) are lifted from text questions to chains of grid steps. They run as a
      breadth-first state-space search that merges plans leaving every grid in the same state, which is
      a standard planning method. The last step is a fitted finisher (Round 28's version-space tables, a
      tiling, or a colour map). Leave-one-out (Round 25/28 "tuning by ear") guards long plans.

      **Lean (`PlanSearch.lean`, FORMAL, C283–C284).** Plans compose and can be regressed from the goal
      (`run_concat_eq_some`). Merging on the states of the demonstration inputs *and the queries* is
      safe for every continuation (`sig_append_congr`, `consistent_congr`). The merged layers lose no
      plan (`layer_complete`) and decide consistency and agreement exactly (`exists_consistent_iff_layer`,
      `agree_iff_layer`). The planner never answers above the shortest explanation (`planner_minimal`),
      every consistent plan of its depth agrees with it (`planner_agree_all`), and it is correct when the
      truth is a shortest explanation (`planner_correct`). The same holds over any cost order
      (`minAgree_correct`, `minAgree_unique`). Two negative controls: without the Occam premise the rule
      can be wrong (`minAgree_needs_occam`), and merging on demonstrations alone is unsound
      (`train_only_signature_unsound`). When two plans disagree, the query's true output refutes one of
      them (`separating_example_refutes`).

      **Lean (`InnerSurvivorData.lean`, CERT, C285; To Do 22).** `InnerFollows a`, the uniform
      inner-survivor form of To Do 19, is false for every `a ≤ 7`. The witness is code `11083` of length
      `14`, which dies at time `32`, while no inner column alternates for `12` consecutive times.

      **GLM (study folder `rule30_round29/`, EMP, C286–C288).** `grid_planner.py` has 63 steps and 30
      finishers. Results:

      | Set | one step (depth 0) | plans (depth ≤ 2) |
      |---|---|---|
      | held-out multi-step puzzles (132; written after the planner was frozen) | 12 right, 0 wrong | **96 right, 0 wrong** (controls refused 24/24) |
      | development multi-step puzzles (132) | 12 / 0 | 98 / 3 |
      | stored ARC tasks (50; development) | 5 / 0 | 10 / 0 |

      Through the GLM's tool entry point, compared with Round 28: stored ARC went from 1 to 10 right
      (0 wrong). Round 28 held-out puzzles went from 24 to 48 right of 84 (0 wrong). Round 28
      development puzzles went from 44 to 65 right (1 to 2 wrong). Knowledge alignment (10/10) and the
      Round 11 suite are unchanged. Every wrong answer seen is an Occam violation: a cheaper hypothesis
      fits all demonstrations (`minAgree_needs_occam`). New To Do items 23–26 cover fitted middle steps
      and goal regression, the ask-and-measure loop, the planner over candidate statements, and the
      Occam failures.
