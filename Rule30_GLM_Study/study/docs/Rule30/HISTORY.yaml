  - heading: "Round 37: the cost of a turn, the observer's best phase, the GLM indexed by hubs"
    anchor: round-37-the-cost-of-a-turn-the-observers-best-phase-the-glm-indexed-by-hubs
    body: |
      **Brief.** "Continue this Rule 30 project. To Do items 39, 40 and particularly 41 (so we can see
      measurable results and obtain exact improvement requirements)." Guide: `TURN_COST.md`.

      **To Do 40, the exact cost of a turn** (`TurnCost.lean`, FORMAL, C343–C344).
      * One step of phase costs 1 slack over a white time and 2 over a test (`testSlack_of_shift_exact`).
      * `m` steps cost `m` + the tests skipped (`testSlack_of_shift_count`). Between two phases of a
        wheel: `slack(a) ≤ slack(b) + m + testsBefore (phase a) m` (`testSlack_phase_transfer`). Both
        have finite-range forms.
      * **The observer's best phase:** a slack at any one phase of every wheel gives the per-period law
        and `WheelDies` (`testCountLinear_of_phases`, `wheelDies_of_phases`).
      * Period 2 read from the phase `01` with slack 3 gives the optimal `TestCountLinear 2 5`
        (`testCountLinear_two_of_phase`). Period 3 read from `010` (slack 5) and `101` (slack 2) gives
        `TestCountLinear 3 8` (`testCountLinear_three_of_phases`).
      * CERT (`TurnCostData.lean`, C345):
        - the phase `01` needs exactly 3 on `d ≤ 40`, and the hub phase `10` needs 5;
        - the phases `010` and `101` need exactly 5 and 2 on `d ≤ 32`, and the hub phase `100` needs 8;
        - both gaps equal the proved cost.
      * EMP (`scripts/wheel_phases37.py`, C346): every phase of every wheel of period `≤ 8`.
        - Per-period slacks are 2, 5, 8, 7, 6, 11, 12, 14; best-phase slacks are 2, 3, 5, 4, 3, 5, 5, 6.
        - The cost has no violation on 2876 phase pairs, and some pair attains it in 66 of 69 wheels.
        - The answer to To Do 40's question: the natural law is per wheel, read from the best phase.

      **To Do 39, partly** (`OneRunFamily.lean`, FORMAL, C347).
      * Every `1^(q−1)0` is a hub (`wheelRep_oneRun`).
      * For every `q` and every `d ≤ q − 4`, every code fails within `d + 2` tests (`oneRun_band`). This
        follows from the general `failsWithinTests_of_initial_blackRun`, and it is uniform in `q` and `d`.
      * The hub kills iff it kills the codes of length `d ≥ q − 3` (`oneRunDies_iff_long`).
      * The whole family contains `HalfLineDies 2` (`halfLineDies_two_of_oneRunFamily`).
      * EMP (C348): slack `≤ 7` for `q ≤ 20`, `d ≤ 30`.

      **To Do 41, the GLM indexed by hubs** (study folder `rule30_round37/`, C350).
      * New tools: `tool hub P K` (word → hub and phase, as `exists_wheelRep`), `tool hubs P` and
        `tool requirements`.
      * `tool next` proposes hubs first (smallest open period, cheapest best phase).
      * The theorem wheel has the hub rule `HubsOfDivisors<p> ⇔ HalfLineDies<p>` and the Round 37 spokes.
      * Measured:
        - consultation 0/11 → 11/11 on questions frozen before the overlay (development questions);
        - hub index exact on 8178/8178 words of period `≤ 12`;
        - periods 1–8 need 70 hubs instead of 502 words;
        - the exact search over periods 1–7 on `d ≤ 20` took 5.19 s for all words and 0.64 s for the
          hubs;
        - every earlier self-test passes in a fresh install.

      **Exact improvement requirements** (`TURN_COST.md` §4, `tool requirements`):
      * R1: `WheelDies` for all `d`.
      * R2: narrowest, `TestSlack (driveN 2 2) 3` for all `d` (To Do 42).
      * R3: `OneRunFamilyDiesFrom q₀`, whose next step is To Do 43.
      * R4: the GLM proposing spokes (To Do 44).

      New To Do 42–44. No prize problem is settled.

      # Appendix A. Early notes (Rounds 1–10), kept as written

      ### Status of the three targets

      | Claim from the study | Status here |
      |---|---|
      | Cone separation `∂a(n)(0)/∂x_{-n} = 1` | **Proved** for all `n`, every row and every cell (`booleanDerivative_left_edge`, `cone_separation_decomposition`) |
      | Bound ⇒ normality: `|D(n)| ≤ C√n` ⇒ `f(n) → 1/2` | **Proved** (`hasFrequencyHalf_of_sqrt_bound`), plus the exact equivalence frequency 1/2 (balance, not full normality) ⇔ `D(n)/n → 0` (`hasFrequencyHalf_iff`) |
      | `|D(n)| = O(√n)` for Rule 30 | **Open**, and likely false as stated (see note 3) |
      | `deg a(n) = 2n − 1` | Upper bound `≤ 2n − 1` **proved for all `n ≥ 2`** (`center_anfDegree_le`, `anfDegree_le_at`); equality **proved for all `n ≥ 2`** in Round 8 (`center_anfDegree_eq`, `anfDegree_eq_at`, via `topMonomialConjecture_holds`); earlier computation for `2 ≤ n ≤ 20` (`anfDegree_eq_upto20`) |
      | Top monomial `M_n = ∏_{i=-(n-2)}^{n} x_i` is unique | *computation* for `3 ≤ n ≤ 6` (`topMonomial_unique_small`) |
      | Right-cone weight `w(M_n) = 2n − 2`, growing by 2 | `topMonomial_weight` (weight of `M_n`); since `M_n` now provably occurs (Round 8), the weight of this top monomial grows by 2 per step |
      | Problem 1 via degree growth | **Not a valid inference** (`map_properties_cannot_decide_periodicity`) |
      | Problem 1 (partial result) | **Proved**: two adjacent columns are never both eventually periodic (`seed_not_both_adjacent_columns_periodic`), so if the centre column were periodic, both neighbours would be aperiodic (`problem1_partial`). Round 7: no two distinct columns are both eventually periodic (`seed_at_most_one_periodic_column`), and no column is eventually constant (`centerCol_not_eventually_constant`, `centerCol_change_in_window`) |
      | Problem 3 via degree | Not valid: the degree concerns a different function (see note 2) |

      ### Perspective / the observer's arrow (your Round 7 suggestion)

      * `deviation_decreases_iff`: for every bit sequence and every `n ≥ 1`, the next bit brings
        the frequency strictly closer to `1/2` **iff** the step direction equals
        `observerArrow = −sign D(n)`. So the sign of the wobble is exactly an arrow saying which
        way the run is currently converging.
      * `deltaSigma_follows_arrow`: the ideal delta-sigma modulator always follows the arrow (its
        feedback loop *is* the arrow). Its output is `1010…` (`deltaSigma_eq`), and
        `|D| ≤ 1` holds for it.
      * `arrow_stats_10000` (*computation*): Rule 30's centre column follows the arrow at 4968 of
        the 9964 times `n < 10⁴` where the arrow is non-zero, i.e. about half the time. It behaves
        like a source with no feedback.
      * `wobble_reverse`: an observer reading a window backwards sees `D_rev(k) = D(N) − D(N−k)`.
      * Space direction: `columns_determine_left` vs `right_side_not_recoverable`. Information in
        Rule 30 can always be reconstructed *leftwards* and not rightwards. The mirror observer
        sees Rule 86 (`evolve86_mirror`), sees **the same centre column** (`centerCol86_eq`), and
        sees the arrow reversed (`rule86_right_permutive`). So the prize problems do not depend on
        the observer's side, while the cone-separation arrow does.

      ### Audit notes on the earlier files

      1. **Axioms.** Stating `r30_non_periodic`, `r30_normal`, `r30_complexity` as `axiom`s
         assumes the open problems are solved. Two axioms are also **inconsistent**, i.e. they
         prove `False`:
         * `wobbleBoundedness_sqrt` and `wobbleBoundedness_LIL` quantify over *all* sequences; the
           all-`true` sequence refutes them (`not_forall_sqrt_bound`).
         * `r30_complexity` uses an `Algorithm` whose `cost` field is unconstrained, so cost `0`
           refutes it (`unconstrained_cost_refutes`).
         `center_col` was an opaque axiom; it is now the defined `centerCol`, checked against
         OEIS A051023 (`centerCol_first_30`).
      2. **Degree ⇒ Problems 1 and 3.** The ANF degree is a property of the map
         `x ↦ a(n)(0)` from *all* initial rows. The all-white row has the same maps and a periodic
         centre column (`map_properties_cannot_decide_periodicity`). So no degree, cone or weight
         statement alone can prove Problem 1; the proof must use the seed, as the adjacent-column
         theorem does. Likewise, Problem 3 is about computing `n ↦ a(n)` from the `log n` bits of
         `n`. A circuit bound for the `(2n+1)`-input map is about a different function.
      3. **`|D(n)| = O(√n)` is probably the wrong target.** If the centre column behaves like a
         fair coin, the law of the iterated logarithm says `|D(n)|/√n` is unbounded (its running
         maximum grows like `√(2 log log n)`). The exact running maximum of `|D(N)|/√N` is
         `√(8/3) ≈ 1.63` for `N ≤ 1040`. It then climbs in bursts to `√(3200/731) ≈ 2.09` at
         `N = 1462`, and to `2.651…` at `N = 24979`. After that it is unchanged up to at least `10⁶`
         (`wobble_sq_ratio_cert`; the intermediate values come from the script). The exact target for Problem 2 is
         `D(n) = o(n)` (`problem2_iff_wobble`). Any bound `|D(n)| ≤ g(n)` with `g(n)/n → 0`
         is enough (`hasFrequencyHalf_of_le`).
      4. Numbers confirmed by computation: `D(10)=4`, `D(100)=4`, `D(1000)=−38`, `D(10⁴)=64`,
         `D(2·10⁴)=240`, and `max_{n≤10⁴}|D(n)| = 80` (attained at `n = 1462`).
      5. `no_small_eventual_period` (*computation*): no eventual period `p ≤ 1000` starting by time
         `1000`. This is evidence, not a proof of Problem 1.

      ### What is still open

      `Problem1` (open for every period `p ≥ 2`; period `1` is excluded by Round 7), `Problem2` (both
      proved for almost every row, open for the seed), Problem 3, `Problem3Eventual` and `SeedFSTypical`.
      `TopMonomialConjecture` (Round 8) and `WholeConeDependence` (Round 9) are no longer open.

