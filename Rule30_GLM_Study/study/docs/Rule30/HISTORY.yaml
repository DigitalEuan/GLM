  - heading: "Round 22: the first tests are exactly independent; the prefix search"
    anchor: round-22-the-first-tests-are-exactly-independent-the-prefix-search
    body: |
      **The idea.** Round 21 explained the slope `≈ 2d` of the period-2 machine by a counting heuristic:
      `d` free cells, one test per black time, "each test kills half". This round proves the first half of
      that heuristic **exactly**, for every drive, and turns the proof into a faster certificate.

      Two facts about the half-line machine (bit `i` = cell `c − 1 − i`):

      * **Light cone.** Cell `i` at time `t` reads only the bits `0, …, i + t` of the starting code
        (`halfStateD_testBit_congr`). So whether the machine fails before time `k` depends only on the
        bits `< k` of the code (`dDiesBy_congr`, `dDiesBy_mod`).
      * **Left-permutivity.** Rule 30 is `new = L xor (C or R)`: the far-left cell of the cone enters by
        `xor`. So flipping bit `n` of the code flips the state at time `t ≤ n` in bit `n − t`
        (`halfStateD_testBit_flip`); in particular bit `t` of the code flips the cell next to the column at
        time `t`, which is exactly what the test at time `t` reads.

      **Theorem (`survivors_card`, FORMAL, every drive sequence `bd`, every `k`).** The number of codes
      `P < 2^k` that pass every check before time `k` is exactly `2^(k − blacks k)`, where `blacks k`
      is the number of black drive times before `k`. Each black time halves the survivors, **exactly**.

      So for a code of length `d` (top bit `d − 1`), the tests at times `0, …, d − 2` are exactly
      independent fair coins: each reads a fresh free bit. After time `d − 1` the code has no free bits
      left and the tests are deterministic. Whether they keep killing is precisely the open core of
      `HalfLineDies` (and so of the period-`p` rung of Problem 1).

      **Experiment (EMP, `scripts/post_edge_halving.c`, output next to it).** After the edge the halving
      continues *approximately*. The normalised survivor count `survivors(k) · 2^blacks(k) / 2^(d−1)` is
      exactly `1` at `k = d − 1` (the theorem). Afterwards, for period 2 with `d = 30` and `d = 36` (both
      phases) and period 3 with `d = 24`, it stays within about 20% of `1` while more than about a thousand
      codes remain, and roughly within `0.6`–`1.6` until fewer than about a hundred remain; then the last codes die
      out. The first deviation from exact halving is tiny
      (`8193 = 2^13 + 1` survivors instead of `2^13` at `k = 31`). This is the shape a uniform proof would
      have to capture: "the tests after the edge still behave like coins, up to a bounded bias".

      **The prefix search (FORMAL soundness, CERT data).** By the light cone, a prefix that fails before
      time `k` dooms all its extensions. `prefixSearch` builds the code bit by bit from the column
      outward and drops failing prefixes; `prefixSearch_sound` proves it correct and
      `drivenCheck_of_prefixCheck` shows it implies the Round 21 check, so all Round 21 consequences apply
      unchanged. By `survivors_card` it visits exactly `2^(k − blacks k)` prefixes at depth `k`: about
      `2^(d/2)` in all for period 2, against `2^(d−1)` codes before. For period 2 the Round 21 machine
      `halfDiesBy` is the driven machine (`halfDiesBy_eq_dDiesBy`).

      New certificates (`PrefixSearchData.lean`, CERT):

      * **`halfLineLinear_upTo_36`**: the period-2 linear target `PeriodTwoHalfLineLinear` (every code
        fails by time `2d + 8`, both phases) holds for every `d ≤ 36` (Round 21: `d ≤ 24`).
        `drivenRunBound_two_linear` / `runBound_two_upTo_36`: in every left-white row a 2-periodic column
        at distance `d ≤ 36` has run length at most `max(3d + 5, 2d + 8)`.
      * `HalfLineLinear p (p + 1) 15` (failure by time `(p + 1)d + 14`) for period 3 (`d ≤ 26`), 4 (`d ≤ 23`),
        5 (`d ≤ 21`), 6 (`d ≤ 19`), with the matching run bounds (`runBound_three_to_six_linear`).
        Round 21 had `d ≤ 20 / 18 / 16 / 16`.
      * `frontier_prefixSearch` collects the Round 22 frontier.

      **Experiments (EMP, `scripts/prefix_search.c`).** The same search in C reproduces every Round 21 table
      exactly, and gives the exact period-2 machine bound for `d ≤ 46` (all `≤ 2d + 8`; e.g. `d = 44`:
      `87`) and the period-3/4/5/6 bounds to `d = 39/35/33/31` (all within `(p + 1)d + 14`).

      **Caution.** The bounds are for the one-sided machine, hence upper bounds for the real runs. The
      Lean certificates use the linear envelopes as horizons; the exact machine values beyond the Round 21
      tables are `EMP`.

      **The perspective reading.** `survivors_card` gives the observer's left-facing refutation side a
      rate: until its view reaches the edge of the row, an observer `Y` on the column that faces left
      gains **exactly one bit** of evidence against "this column is periodic" per black reading, and none
      per white reading. After the edge the readings are no longer fresh; the data say they still carry
      about one bit each, and proving that is the open problem.

      ### Where the prize problems stand after Round 22

      All three are still open. The period-2 rung of Problem 1 reduces to `PeriodTwoHalfLineLinear`
      (certified for `d ≤ 36`). The new formal fact is that its first `d − 1` tests are exactly independent
      (`survivors_card`); what remains is the behaviour of the tests after the edge.
