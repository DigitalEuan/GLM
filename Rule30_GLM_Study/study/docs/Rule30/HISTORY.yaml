  - heading: "Round 15: following the \"what a proof would take\" leads, and ideas from aperiodic tilings"
    anchor: round-15-following-the-what-a-proof-would-take-leads-and-ideas-from-aperiodic-tilings
    body: |
      **The three prize problems remain open.** This round follows up Round 14's list of missing
      theorems and borrows three ideas from aperiodic-tiling theory. The write-up is
      `rule30_round15/README.md`, and the tiling notes with their citation are in
      `rule30_round15/TILE_RESEARCH_NOTES.md`.

      | File | Contents |
      |---|---|
      | `TileLeads.lean` | rigidity of the seed's whole diagram; the period-2 forcing lemma and one-parameter reduction; the recognizability bridge |

      ### A. Rigidity of the whole diagram (tiling notion of period)

      * **`seed_spacetime_period_trivial`**: if the space-time shift `(t, i) ↦ (t + a, i + b)` maps the
        seed's diagram to itself from some time on, then `a = 0` and `b = 0`.
      * **`seed_no_mirror_symmetry`**: no time shift combined with a reflection `i ↦ b - i` does.
      * So the diagram's eventual symmetry group is trivial. Problem 1 asks for the same rigidity for
        one projection of the diagram, the centre column.

      ### B. The period-2 forcing lemma (Round 14's first missing link)

      * `key_forcing` (any run): at a black time of column `c`, cell `c - 1` is the complement of the next
        value of column `c`.
      * `AltFrom x c N`: column `c` alternates from time `N`.
      * **`alt_forces_left_one`, `alt_pair_constant`, `alt_shift_complement`**: an alternating column
        forces column `c - 1` to be black at its black times. Column `c - 2` holds each value for two
        steps. Column `c - 3` is the complement of column `c - 2` one step later.
      * `left_solve`, `columns_left_determined`: Rule 30 can be solved for its left input, so two
        adjacent columns determine everything to their left.
      * **`alt_left_determined`**: everything at or left of an alternating column is determined, from
        time `N + 1` on, by the phase and the single sequence "column `c - 2`". That sequence carries one
        free bit per two steps. The period-2 case of Problem 1 is now: *no half-speed sequence generates
        a left-white world.*

      ### C. The recognizability bridge (marked vs unmarked tiles)

      * `seedCol c`: column `c` of the seed's run.
      * **`problem1_of_neighbour_recognizable`**: if column `+1` or `-1` is, from some time on, a fixed
        function of a finite window of the centre column (any delay), then Problem 1 holds. This uses
        the proved fact that adjacent columns are never both eventually periodic.
      * Experiment (EMP, `rule30_round15/`): over 4,194,304 steps, column `-1` keeps about 0.30 bits and
        column `+1` about 0.58 bits of uncertainty given windows of up to 15 centre-column bits. The
        numbers fall slowly and show no sign of reaching 0, so this lead is not supported by the data.

      ### Where the prize problems stand after Round 15

      * **P1**: still open. The period-2 rung now has a one-sequence formulation (B). The
        recognizability route (C) is a valid sufficient condition, but the data do not support it.
      * **P2, P3**: unchanged from Round 14. The tiling research offers no tool for frequency or
        running-time bounds (see the tiling notes).
    subsections:
