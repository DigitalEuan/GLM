  - heading: "Round 18: the `C·R` injector, the odd parity lock on `M_{n+1}`, and the three analogies"
    anchor: round-18-the-cr-injector-the-odd-parity-lock-on-mn1-and-the-three-analogies
    body: |
      New files (all imported by `RequestProject/GLM/Rule30.lean`, no `sorry`, no added axioms):

      | File | Content |
      |---|---|
      | `Injector.lean` | product formula for ANF coefficients; the injector carries the top degree; **odd number of surviving pairs for `M_{n+1}`**; the seed diagram is the degree-one slice of the ANF; decoupling theorem |
      | `InjectorAnalogies.lean` | the three analogies made exact: `Δ_iΔ_i = 0` and coefficients as iterated derivatives; Rule 30 = linear Rule 150 + `C·R`; Rule 150 stays degree `≤ 1` |
      | `InjectorData.lean` | *computation*: exact numbers of surviving pairs `3, 3, 5, 3` for `n = 1..4` |

      ### The target, stated exactly

      Over `GF(2)`, `a(n+1)(0) = a(n)(-1) + a(n)(0) + a(n)(1) + a(n)(0)·a(n)(1)`: a linear part
      plus the nonlinear **injector** `C·R`. The study's target was:

      > the nonlinear `C·R` injector on the right side forces an odd number of surviving terms for
      > `M_{n+1}`, preventing the lower-degree cancellation wall from collapsing the sequence into
      > periodicity.

      This contains two claims. The first is now a theorem. The second does not follow from the first,
      and that is also a theorem.

      ### A. The first half: proved for every `n ≥ 1` (`Injector.lean`, FORMAL)

      * **`coeffZ_mul`** (product formula): the ANF coefficient of `x^U` in `F·G` is
        `Σ_{S ∪ S' = U} F̂(S)·Ĝ(S')` over `GF(2)`. This is what "surviving terms" means exactly: pairs of
        monomials, one from each factor, whose union is `U`.
      * **`anfCoeff_succ_split`**: every coefficient of `a(n+1)(c)` is the linear part plus the injector's
        pair sum.
      * **`linear_part_below_wall`**, **`anfCoeff_succ_high_eq_injector`**: for `n ≥ 2` the linear part
        has degree `≤ 2n − 1`, so **every** coefficient of degree `≥ 2n` comes from the injector alone.
        For `M_{n+1}` itself the linear part vanishes already for `n ≥ 1` (`linear_part_topMonomial`).
      * **`injectorPairs_card_odd`** (the target): for every `n ≥ 1`, the number of pairs `(S, S')` with
        `x^S` a monomial of `a(n)(0)`, `x^{S'}` a monomial of `a(n)(1)` and `S ∪ S' = M_{n+1}` is **odd**.
        Hence `M_{n+1}` survives.
      * **`injectorPairs_card_small`** (EXH): the counts are `3, 3, 5, 3` for `n = 1, 2, 3, 4`. More than
        one pair survives, so the oddness is a cancellation in pairs — a parity lock — not one lone term.
        For example at `n = 2`, `M_3 = x_{-1}x_0x_1x_2x_3` is reached by `(x_{-1}x_1, x_0x_2x_3)`,
        `(x_{-1}x_1x_2, x_0x_3)` and `(x_{-1}x_1x_2, x_0x_2x_3)`.

      The oddness is the Round 8 theorem (`topMonomialConjecture_holds`) read through the product
      formula; the new content is the exact identification of the "surviving terms" and the proof that
      the linear part cannot touch them.

      ### B. The second half: the lock cannot reach the seed (`Injector.lean`, FORMAL)

      * **`seed_eq_linearCoeff`**: the seed's whole space-time diagram is the **degree-one slice** of the
        ANF: the cell `(n, c)` of the single-seed run is the coefficient of `x_0` in `a(n)(c)`.
        (Evaluating at the seed kills every monomial except `1` and `x_0`, and the constant is `0`.)
      * **`problem1_iff_linearCoeff`**: Problem 1 asks only whether `n ↦ coeff(x_0, a(n)(0))` is
        eventually periodic. The injector lock concerns degree `2n − 1`; Problem 1 lives at degree `1`.
      * **`linearCoeff_autonomous`**: the degree-one slice evolves by Rule 30 itself, with nothing of
        degree `≥ 2` entering. **`pairSum_singleton`**: on that slice the injector is a single pair (the
        plain `C·R` of the seed run) — at the bottom of the filtration there is no cancellation to lock.
      * **`top_structure_cannot_fix_seed`**: for **any** bit sequence `b` there is a family of functions on
        the same light cones whose ANF agrees with Rule 30's in every coefficient except that of `x_0`
        (so the same degree, the same unique top monomial, and the same coefficients of degree `≥ 2`
        from which the injector pairs are built) and whose seed column is `b`.
      * **`injector_lock_compatible_with_periodicity`**: in particular, every fact about the coefficients
        of degree `≥ 2` — the parity lock included — is compatible with a periodic seed column.

      So the "lower-degree cancellation wall" and the top-degree lock live in different graded pieces,
      and information does not flow from the top piece down to the piece Problem 1 reads. This sharpens
      error E2 (`map_properties_cannot_decide_periodicity`) from "the all-white row" to the seed
      itself.

      ### C. The three analogies, made exact (`InjectorAnalogies.lean`, FORMAL)

      | Analogy | What is exactly true here | Lean |
      |---|---|---|
      | Discrete exterior calculus, `δ² = 0` | The Boolean derivative `Δ_i` satisfies `Δ_iΔ_i = 0`, and derivatives commute. An ANF coefficient is an iterated derivative at the white row: dropping one variable from the monomial is one derivative. "Interior faces cancel in pairs" is exactly `x + x = 0` in these sums | `booleanDerivative_twice`, `booleanDerivative_comm`, `anfCoeff_eq_anfCoeff_derivative`, `mobius_double_sum` (the transform is its own inverse) |
      | Stabilizer / Clifford propagation | Rule 30 = Rule 150 (`L + C + R`, linear) + `C·R`. Rule 150 is `GF(2)`-linear at every step, so all its coefficients of degree `≥ 2` vanish for ever: fully trackable, as Pauli strings are under Clifford gates. The `C·R` term breaks linearity at step 1 and is the only source of degree growth (`deg = 2n − 1`), the analogue of a non-Clifford resource | `rule30_eq_rule150_xor_injector`, `ecaEvolve150_additive`, `rule150_anfDegree_le_one`, `rule30_not_additive`, `injector_is_the_only_degree_source` |
      | Charge conservation / telescoping (delta-sigma, Kirchhoff) | A telescoping window weight has total `0`; and every window weight of range `≤ 6` that is conserved along the seed run is such a telescoping coboundary (Round 13), so it carries no information | `coboundary_total_zero`, `seed_run_no_conservation_law`, `coboundary_of_cert` (`ChemistryLab.lean`) |

      The proposed synthesis — a graded `GF(2)` complex with the degree (or span) filtration, an operator
      raising degree by 2, and a parity lock at the top — is what §A proves. The weight filtration
      `w(M) = rightmost − leftmost` and its `+2` growth are `topMonomial_weight` and
      `topDegree_weight_growth` (Round 16).

      ### D. What this says about the "axiom the GLM could need"

      §B is a precise constraint on any such axiom. A principle phrased only in terms of the
      coefficients of degree `≥ 2` (top degree, filtration, weight, parity locks, cone separation)
      cannot imply Problem 1, because a family with all of those data and a periodic seed column exists.
      An axiom that would settle Problem 1 must speak about the degree-one slice, which is the seed run
      itself (`problem1_iff_linearCoeff`). Put another way: the arrow the GLM needs cannot come from the
      top of the filtration alone. It has to couple the top to the bottom, and Rule 30's dynamics never
      does that (`linearCoeff_autonomous`).

      ### Where the prize problems stand after Round 18

      Unchanged: all three are open. The study's injector claim is proved in its exact form (odd number
      of surviving pairs for `M_{n+1}`, every `n ≥ 1`). The implication from this to non-periodicity is
      proved not to hold, which tells the GLM where an attack on Problem 1 must look.
