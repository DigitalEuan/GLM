  - heading: "Round 16: the period-2 rung, weight growth closed, the triangle question, GLM operators"
    anchor: round-16-the-period-2-rung-weight-growth-closed-the-triangle-question-glm-operators
    body: |
      **The three prize problems remain open.** The write-up is `rule30_round16/README.md`; rows
      C170–C184 of `claims.csv`.

      | File | Contents |
      |---|---|
      | `WeightGrowth.lean` | uniqueness of the top-degree monomial for every `n ≥ 3`; weight `2n − 2`, `+2` per step |
      | `RunBoundSearch.lean` | diagonal recursion; a verified pruned search; exact period-2 run bounds for `d ≤ 16` with witnesses; the open linear target |
      | `ConeGeometry.lean` | the seed's triangle; the chiral influence triangle; slices of the 2D lattice cone |
      | `LatticeConeFraction.lean` | the `1/(2k)` fraction theorem for lattice light cones |
      | `WobbleNormalized.lean` | exact second moment of the wobble; the scale-free carrier `D(N)/√N` |

      ### A. Weight growth (feedback item), closed

      * **`anfCoeff_second_left_small`**: for `n ≥ 3` no monomial of degree `≥ 2n − 1` in `a(n)(0)`
        contains `x_{1−n}`. The derivative in `x_{1−n}` is `Σ_{s<n} (1 + a(s)(s + 2 − n))`
        (`evolve_update_second_left`), and each term has degree `≤ 2n − 3`.
      * **`topMonomial_unique`**, `topMonomial_unique_at`: the top-degree part of `a(n)(c)` is exactly
        `x_{c+2−n} ⋯ x_{c+n}`, for every `n ≥ 3` (previously checked for `3 ≤ n ≤ 6`).
      * **`topDegree_weight_growth`**: the weight is `2n − 2` and grows by exactly `2` per step.
      * As recorded since Round 3 (E2), this is a property of the `n`-step map and cannot decide P1 or P3.

      ### B. The period-2 rung

      * `evolve_diag_succ`: along the diagonals parallel to the left edge, Rule 30 reads diagonal `m`
        from diagonals `m − 1`, `m − 2` and itself.
      * `diagStep`, `searchDead`, **`searchDead_sound`**, `runSearch_sound`: choosing the row one cell at
        a time and abandoning a branch when the column stops being periodic is sound for every
        left-white row.
      * **`runBound_two_upTo_sixteen`** (CERT): exact period-2 bounds
        `1, 7, 6, 5, 5, 8, 9, 9, 16, 15, 14, 13, 14, 16, 19, 21, 25` for `d = 0..16`, and
        **`runBound_two_witness`** (CERT): each is attained.
      * `PeriodTwoLinearBound` (OPEN): `B(d) ≤ 2d + 7`. `leftWhiteAperiodic_two_of_linearBound`: it would
        settle the rung. `runBoundTwoExt_le_linear`: consistent for `d ≤ 16`. The values for
        `d = 17..26` (EMP) are `24, 23, 35, 34, 33, 32, 31, 31, 30, 34`, and `d + B(d)` takes only the
        values `8, 24, 41, 54, 55, 60` in blocks ("barrier diagonals").

      ### C. The triangle question

      * **`seed_pattern_triangle`**: the seed's pattern is exactly `|i| ≤ t`, with both corners black.
      * **`influence_right_ray`**: a one-cell change always reaches `(n, j + n)`. The left side can go at
        speed 1 (`influence_left_ray_fast`) or stall (`influence_left_ray_stalls`). EMP: about `0.243` on
        random rows.
      * `mooreCone`, **`moore_slice_mem`**, **`moore_slice_factor_bounds`**, `diagonal_slice_angle`,
        `face_slice_angle`: slices of the 2D light cone have apex angles from `90°` to
        `2·arctan √2` (`cos = −1/3`).
      * **`axisCone_fraction`**, **`lightCone_ball_fraction`**, `lightCone_cube_fraction`: in
        `k`-dimensional space-time the light cone fills exactly `1/(2k)` of all directions: `1/4` for
        Rule 30, `1/6` for 2D rules.

      ### D. Normalised wobble (feedback item)

      * `sum_wordWobble`, **`sum_wordWobble_sq`**: over all `2^N` words, `Σ D = 0` and `Σ D² = N·2^N`.
      * **`mean_sq_zScore`**: `z = D/√N` has mean square exactly `1` for every `N ≥ 1`.
      * **`card_large_zScore_le`**: at most `2^N/λ²` words have `|z| ≥ λ`.
      * `wobble_eq_wordWobble`, `seqZScore`, `seqZScore_eq`: the bridge to `Wobble.lean`.
      * The GLM operator is `rule30_round16/glm_overlay/glm_universal/reasoning/wobble_normalize.py`. The
        structured question reader for `discuss` is `theorem_wheel_round16.py` in the same folder.

      ### Where the prize problems stand after Round 16

      * **P1**: open. Period 2 is certified exactly for `d ≤ 16` for every left-white row. A uniform
        bound (for example `2d + 7`) would settle it.
      * **P2**: open. Readings should be compared as `z = D/√N`. The 2^17 "transient" is mostly an
        overlap-counting effect (EMP).
      * **P3**: open. The degree/weight track is now complete, and it is a property of the map, not of
        the seed.
    subsections:
      - A. Weight growth (feedback item), closed
      - B. The period-2 rung
      - C. The triangle question
      - D. Normalised wobble (feedback item)
      - Where the prize problems stand after Round 16
