            - "**does not follow** (`transient_read_does_not_imply_aperiodic`). A family satisfies the premise for every period while its diagonal read is constant. For Rule 30 the premise is certified, so this sentence would have claimed Problem 1."
          - - aperiodic ⟹ no finite automaton generates it
