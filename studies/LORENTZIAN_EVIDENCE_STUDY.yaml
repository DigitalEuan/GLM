title: The Lorentzian evidence space — what the lift gives reasoning beyond the Golay tie
verdict: 'The lift is an evidence space: any finite set of weighted cues, in any dimension, sums to one
  vector that is the lifted consensus plus the Weyl vector times the cues'' disagreement, so cues add,
  a tie is the consensus on a mirror, disagreement is minus the Lorentzian norm, and analogy is evidence
  with weights 1, −1, 1; in use it refuses what it should — answers outside the tie''s certificate, examples
  that do not state one relation, a name the dimension layer cannot choose — at no cost in right answers,
  and a tie asks the one question that settles it, but where relations are not displacements it helps
  little, and the decoy readings it still answers wrongly carry no information that could tell them from
  honest ones.'
