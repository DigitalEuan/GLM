question: 'Eighteen of the outside questions (class M of the Capability Failure Matrix, track M of `QUESTION_SET_B_STUDY.md`
  §8) ask about the GLM itself: how it compares distances without a square root, why it refuses `UNCORRECTABLE`
  past weight 3, how its integer procedure stops, how Lean checks a rational inverse. Can the machine
  answer them from its own studies, code and Lean development, quoting what it reads at the time it reads
  it, and say so when a question''s premise is not what the documents say?'
