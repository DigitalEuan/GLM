title: Meta questions answered from the project's own documents
verdict: 'Yes for the eighteen declared questions, and with a recognition gap on rewordings. Every one
  is read by its declared topic and answered with quotes found in the studies at read time, Lean declarations
  found in the stored address book, and the disputed premises the documents contradict; a moved quote
  or a renamed theorem turns the reading into the refusal `CITATION_MOVED`. Six of the seven marks were
  met: the paraphrase mark missed one rewording, which an earlier frame reads and answers correctly, and
  one held-out rewording is not read at all.'
