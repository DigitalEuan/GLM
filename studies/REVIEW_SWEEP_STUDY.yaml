question: 'Directive D13 lets a stalled result be re-read at a finer layer, and then constrains the practice:
  rank candidates by whether there is an **identifiable discarded quantity** at the coarse reading, not
  by how disappointing the original result was. Nothing implemented that clause. Can the whole standing
  set of stalled results be ranked by it, *before* the next re-reading, and does the ranking then say
  anything a list sorted by disappointment would not?'
