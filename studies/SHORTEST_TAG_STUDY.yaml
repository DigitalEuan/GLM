title: The shortest tag — how many tag bits a tie needs
verdict: 'The seven-bit sender tag is proved to be the shortest tag that resolves every tie, and the eleven-
  and fifteen-bit protected tags are proved to be the shortest tags built as parities of seven tag bits.
  Every parity tag whose octad tags have weight at least D needs at least D + 6 bits, so 9 and 11 bits
  is the proved floor for tags of any other shape. The gap between the floors is searched, not settled:
  the search found no shorter tag at any gap length, but its control found the 15-bit length on none of
  three seeds, so for two flipped bits the empty search is weak evidence. Five of six marks were met;
  S5 was missed on that control.'
