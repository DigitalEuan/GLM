title: Contextual domain frames — the question says which energy, and which body drives the wave
verdict: Yes. A question can now say which energy is meant, which oscillator, and whether a rotating body
  drives the wave. Energy from power and time is answered as `energy = power * time` when the energy is
  delivered over a time and as half of that when it is stored in a capacitor; the source's energy `charge
  * voltage` and the capacitor's `1/2 * charge * voltage` are told apart the same way; with a rotating
  body driving the wave, the reference-circle identity and the rotor chain come back. No answer given
  without a context moved, and over 16,215 questions no pin changed an answer — as Lean proves it cannot.
  One mark was missed on a mis-written expectation, not on an answer.
