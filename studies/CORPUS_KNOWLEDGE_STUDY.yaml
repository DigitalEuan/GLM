title: The corpus as what the GLM knows — counting instead of training
verdict: 'Yes, for the uses that reduce to counting: the corpus, counted rather than trained, predicts
  held-out text three times better than word frequency and eight times better than its own words without
  their order, grows more accurate as it grows, is exactly additive and order-free, and reads word use
  and definitions with a witness sentence for every answer; it does not yet know when its prediction is
  right at a useful coverage, and no rule tried for choosing terms gave 80% definitions.'
