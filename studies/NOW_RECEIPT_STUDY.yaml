title: History recorded in the now — what the receipt actually holds
verdict: 'The identity holds and the reading of it does not: the accumulator is exactly the fractional
  part of the integral of its input, which makes it a function of the program and the tick count rather
  than a record of the run, and the supplied recoveries succeed just as well with the state withheld.
  What the corrected statement is worth is a shipped path made cheap and a class of question the system
  can now refuse with a witness rather than answer wrongly.'
