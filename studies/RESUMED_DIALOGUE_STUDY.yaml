title: The open tie kept across turns — a reply read after the conversation has moved on
verdict: Yes. A question now stays open across turns that leave it alone, and a reply after one, two or
  three unrelated turns ends every dialogue exactly as the uninterrupted dialogue ends, for truthful informants
  and for adversarial ones. A question is answered once, the newest question supersedes an older one,
  and no question of the evaluation set is taken for a reply. Lean proves that an unrelated turn is invisible
  to the replies read. The same round ran Phase 167's adversarial battery at the `locate` junctions for
  the first time, and pinned `report anonymous` on its claim, which showed that one sentence of that report
  had asserted more than its measurement holds.
