title: 'The chat surface: one echo, the declared readings, and what a refusal means'
verdict: Yes, for the three defects the platform round of 13 November 2026 named under *use*. The interactive
  surface echoed every query twice, one echo its own and one the answer path's; it now echoes each query
  once, from the answer path alone. It had no way to say which readings a question may have; `:kinds`
  now lists the parser's own table — 30 declared readings, with `unknown` named apart — and nothing is
  typed twice. A question that matched no declared reading was refused with the bare word `unrecognised
  query`, while the machine's own reading of that refusal (the sentence matched no classification rule)
  was discarded; the interactive surface now says so and points at `:kinds`, and the batch line the evaluation
  pins is unchanged.
