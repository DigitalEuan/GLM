title: Citations read in Lean's scope, checked against the elaborator
verdict: 'The repaired reader is a reader of Lean: 99.1 % of its citation edges are edges the elaborator
  confirms, against 52.1 % for the legacy reader, it finds more of the real ones, and the one-letter sink
  is gone; the type-word repair leaves no structural coordinate that a renaming can move; every qualitative
  retrieval verdict survives the repaired relevance, and the structural address gains on it. The repaired
  graph then carries a new operation: whether one Lean result rests on another, answered with a checkable
  witness.'
