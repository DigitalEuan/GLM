title: The configuration reading in the other deep-hole reports — each round's question asked of `L5`
verdict: Yes. Each of the three reports keeps its round's answer verbatim and adds what `L5` says to that
  round's question. For the classifier, the sanity query that stopped the first round holds at `L5` for
  10 of 10 seed queries, and all 44 queries are answered correctly. For the ladder, `L5` passes the escalation
  gate at every one of its 8 measured sizes, already at 240 starts, where the joint reading needed 1920.
  At 480 starts it passes with ρ above one, which is the global criterion being sufficient but not necessary.
  For the failures, `L5` answers all four of the joint reading's failures correctly and meets the criterion
  for 10 of 10 types at 1920 starts. The whole evaluation keeps all 212 statuses, and only the three intended
  texts moved, each with its old text as its prefix. 6 of 6 measured marks were met, and L1 by the build.
  Taking column 3 also found that the `report hole ladder` script had never verified, because its template
  missed one key. That is now fixed.
