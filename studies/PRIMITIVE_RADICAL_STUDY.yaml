title: Roots with no expression in radicals in composite degree, and on the modes route
verdict: 'Yes, for groups that hold the two elements the test looks for. An element of cycle type `(n
  - 1, 1)` makes the Galois group primitive, and an element with a power that is a transposition or a
  3-cycle then puts the alternating group inside it (Jordan''s theorem); both steps are proved in Lean.
  All ten marks were met: the statement reaches `x^n - x - 1` for n = 6, 8, 9, 10 and 12, the sextic trinomial
  in letters, and the chain pendulums of five and six links, it is given to none of 141 polynomials with
  solvable groups, and it reaches all 200 random irreducible polynomials of degree 6, 8, 9 and 10. It
  stays silent on an imprimitive group that is not solvable, as declared, and Dedekind''s theorem is still
  used, not proved.'
