question: Phase 113's Frobenius certificate needs prime degree, so `solve symbolically` says nothing about
  `x^6 - x - 1`, and the `modes.higher` route names the roots of a characteristic polynomial of degree
  five or more with no statement about radicals at all. Can the layer read two Frobenius elements in composite
