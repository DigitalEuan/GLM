title: The machine sums π — Machin's formula and the arctangent series, proved in Lean and run in GLM-BAT
verdict: Yes. Machin's formula, the error bound of the series for `arctan` and the machine's Horner loop
  in two integers are proved in Lean, and the four integers the machine leaves are proved to enclose π
  for every number of terms. The summed enclosure is about 10⁻⁵⁷ wide (the declared constant was 10⁻²⁰),
  certifies 53 terms of π's continued fraction (the constant certified 19), and every one-step π chain
  the constant admitted is admitted with the same value.
