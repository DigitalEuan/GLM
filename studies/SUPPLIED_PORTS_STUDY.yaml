title: The four pieces left in the source material — two ported, two measured and left in the sandbox
verdict: 'Two are. The parity binding inverts with no side condition and is proved to; recovering a **name**
  from it is worth exactly what the registers'' parity readings are worth, which is 424 of 1,143 carriers
  and a forced refusal on the rest, and the product binding offered beside it is refuted. The plan store
  keeps a refusal as it keeps an answer, replays all fifteen declared follow-ups unchanged and takes their
  licensing trials from 27 to 0, while the key that ignores the conversation answers 8 of the 15 with
  another conversation''s antecedent. The other two are not. The four-register split is recency with a
  decay rate once a pronoun has named no concept: it agrees with licensing on 5 of the 8 follow-ups the
  shipped layer binds and answers 6 of the 7 it refuses, mostly by choosing a member of the ambiguity
  the refusal exists to keep open. The Lean generator''s own round-trip check never reads what it generated
  — it passes for a generator that emits the empty string — and the real round trip returns the reading
  it was generated from on 0 of 12 carriers.'
