title: The corpus confidence curve, declared — three operating modes chosen before they are measured,
  and definitions that say how good they are
verdict: Partly. The balanced mode chosen on the calibration fold meets the bar Phase 154 missed on held-out
  text — 33.7% precision, 1.6 times the unguarded accuracy, at 42.4% coverage — and the order control
  falls to 3.3% under the same guard. The sure mode holds 62.0% precision at 7.3% coverage but misses
  its declared three-times bar narrowly, and the balanced mode's coverage moved by just over the declared
  tolerance between folds. Strong definitions agree with the held-out gloss only slightly more often than
  weak ones (4 of 15 against 2 of 8).
