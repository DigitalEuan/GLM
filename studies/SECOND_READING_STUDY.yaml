question: 'The escalated-operations study left one declared failure: the program-text operation answers
  13 of 576 queries *wrongly* rather than refusing, because its unanimity contract is applied to a single
  reading and a cell can be unanimous and unanimously wrong. Does requiring a **second, independent reading**
