verdict: 'A transposed letter is now read back: the respelling, count first and use under load, restores
  194 of the 196 typo questions with none turned into a different question, and after the round 193 of
  194 typo runs hold with no slip where 41 of 196 held before, with no evaluation outcome moved; the harness
  reads every refusal the machine prints; but use on its own does not beat spelling, wear does not remove
  the self-made valley, which the two-token row carves rather than the touches, and the noise-set margin
  removes the flip-flops at a cost of 27 final readings.'
