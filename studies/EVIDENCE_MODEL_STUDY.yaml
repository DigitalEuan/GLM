title: One evidence and result model — every answer and refusal of the evaluation read into the same ten
  fields
verdict: 'Yes, after two repairs the census itself found. All 223 evaluation questions read into the ten
  fields; the model''s status agrees with the evaluation on all of them, where the surfaces'' own solved
  flag alone disagrees on two; every refusal names its reason. The first take missed two marks: 26 cited
  theorem names did not resolve, all of them a Python repr''s closing quote read as a prime (an extractor
  artefact, amended), and two answers'' own column 3 did not reproduce them — the trilinear template could
  not replay a triple of axis labels and the language report''s column 3 had drifted behind its report.
  Both were real defects of the replay, fixed; on the re-take every one of the 171 replayable answers
  verifies. Re-taken on 31 October 2026 on the reconstructed model, with the Lean declaration lookup restored
  so that every cited name is checked against the declarations of the build tree, over the 227 questions
  the evaluation now holds: 9 of 9 marks again (§7.6).'
