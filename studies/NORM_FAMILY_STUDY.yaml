question: Escalation reads a carrier at rung after rung until one rung resolves it, and what decides whether
  a rung can resolve a perturbed query is its minimum squared norm. Does indexing the rungs by that quantity
  — one rung at every power of two, generated rather than named — read more queries than the eleven named
