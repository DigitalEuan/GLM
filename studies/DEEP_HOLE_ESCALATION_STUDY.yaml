title: The deep-hole ladder — escalating the reading until the law descends
verdict: It was the layer. Escalating the reading takes the sanity count from **3 of 10** at the first
  round's cell to **10 of 10** — the gate — at the joint reading with 1920 starts, where the full query
  set is named **40 of 44** correctly against 12 for the vertex-count baseline. The passing cell is the
  extension rung of §14, decided after the twelve pre-registered cells were measured, and is reported
  as an extension throughout; the best pre-registered cell is 9 of 10.
