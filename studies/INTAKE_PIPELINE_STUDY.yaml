title: The intake pipeline — supplied material, filed and gated
verdict: 'Yes. All 42 supplied items and 2 local-only files have one record each: 10 are open in `ToDo/`
  and 34 are finished in `done/`, 21 absorbed and 13 closed with a reason and evidence; the check passes
  with 0 errors, and each gate refuses a scratch record that lacks its evidence, including a promotion
  to Lean verified without a matching build record, a draft or unaccepted measurement, a stale test pass
  and a study without its manifest in step. No item reaches Lean verified in this checkout, because the
  owner''s build has not yet written that record; the two wheel items wait at Lean written with their
  acceptance decisions recorded against their studies'' declared criteria, and by the owner''s decision
  their 6 parts are installed in the package provisionally (16 files, listed in the register of provisional
  wheels, every answer from them marked), not absorbed; the 21 earlier absorptions are marked as predating
  acceptance decisions. Of 24 in-place runs of the supplied items'' scripts at filing, 18 pass and 6 fail;
  the failures are five missing or changed dependencies and one tautology the item''s own suite flags,
  not wrong answers.'
