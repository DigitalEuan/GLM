title: The machine reads what it carries — the registers as files, the typed planner and the field reads
  through GLM-BAT
verdict: 'Yes. The machine is given its own copy of the registers (8,408 entries in 11 tables) and the
  question''s numbers, and of the 2,314 steps Phase 151 carried as data it now reads 2,189 and computes
  33 more, with 92 still carried; every answered chain is still admitted. A lie at a register read is
  found at its own step every time, a lie at a given whenever it is not another number of the same question,
  and a lie at a newly computed step every time. The typed planner''s 42 exact computations and 7,716
  field answers of the session''s default domains run through the same machine, every honest one admitted
  and every altered one refused, and no answer moved. No mark was missed. Re-measured on 31 October 2026
  (repository check) by the reconstructed measurement module, 11 of the 12 measured marks hold: every
  chain, register, question, computed, typed and field mark is met over the reconstruction''s 187 chains,
  and F1 is not met because its baseline was lost in the October 2026 reorganisation; §7.5 gives the figures.'
