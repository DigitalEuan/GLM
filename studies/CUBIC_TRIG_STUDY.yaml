title: A cubic in letters with three real roots
verdict: A cubic whose depressed form has `P^3/Q^2` a number is answered as a ratio of the letters times
  a bracketed algebraic number, and any other cubic whose discriminant is plainly negative is answered
  by the trigonometric form, three roots in decreasing order. The identical triple pendulum and three
  masses on four springs now have their three squared frequencies. A Phase 104 reading that printed Cardano's
  root under a condition no value of the letters satisfies is now answered by the trigonometric form.
  All 9 marks were met; with the switch off the layer is Phase 104's exactly, and no other reading moved.
