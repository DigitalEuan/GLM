title: The question at the `nearest` ties — a reply turn for the ranking's head
verdict: Yes. A `nearest` answer whose ranking head is a tie now ends with the question that splits it,
  and its `given` replies are read as the next turn. Over the 18 distinct tied heads of Phase 148's six
  sets, with each of the 48 members as the carrier meant, true replies confirmed the member meant in 48
  of 48 runs and never a wrong one, with at most 2 replies; one false reply ended contradicted in 48 of
  48. A carrier meant outside the head was never confirmed. Every one of the 212 evaluation cases keeps
  its status, and the junction answer keeps its old text as a verbatim prefix. No mark was missed.
