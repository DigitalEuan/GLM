question: Phase 112's radical-free certificate reads the Galois group through complex conjugation, so
  it needs exactly two non-real roots and is silent on `x^5 - x - 1`, whose group is the full symmetric
  group. Can the branch layer of `solve symbolically` read the group through one Frobenius element instead,
  say with a proved reason when no root is expressible in radicals, and never say it of a polynomial whose
  group is solvable?
