title: Roots with no expression in radicals, read from one Frobenius element
verdict: 'Yes. The layer now factors an irreducible polynomial of prime degree modulo small primes, and
  when one factorisation has a cycle shape that no affine map `x ↦ ax + b` has, it states that no root
  is expressible in radicals, citing Galois''s theorem on groups of prime degree, proved in Lean. All
  nine marks were met: the statement now reaches `x^5 - x - 1`, the A5 quintic `x^5 + 20x + 16`, Trinks''s
  septic with group `PSL(2, 7)` and the septic trinomial in letters, it is given to none of 178 polynomials
  with solvable groups, and it reaches all 200 random irreducible quintics and septics. Dedekind''s theorem,
  which turns the factorisation into a group element, is used but not proved in Lean, and composite degrees
  are still out of reach.'
