title: The operations ladder in the stepwise planner — the chain as a GLM-BAT program
verdict: 'Yes. All 174 chains the stepwise planner answers among its 283 recorded texts are said as GLM-BAT,
  read back to the identical lines, run by the batch machine to a halt, leave no drift and are promoted
  by the gated pipeline, so the gate refused nothing the planner answered. A lie in the last computed
  step is found at that step in 87 of 87 chains, and the pipeline does not promote and leaves no file.
  The machine checks what it computes, not what it carries: of the 2,494 steps, 180 are computed and 2,314
  carried as data, and a lie in a carried step is caught only downstream, in 87 of 168 cases. No mark
  was missed.'
