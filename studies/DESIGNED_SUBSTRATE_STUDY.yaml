title: The designed substrate — is the Golay–Leech carrier optimal for the GLM, and what resolves its
  ties?
verdict: 'In the GLM''s regime the Golay carrier is optimal and cannot be beaten by any design of the
  same size; what can be improved is how its six-way tie is resolved, and the two new certified stages
  measurably widen that. Proved in the GLM''s own Lean development, for every 4,096-word design with any
  decoder: none decodes correctly more often on the bit-flip channel, every one leaves at least 7,254,016
  received words at distance 4 or more, and none that corrects three flips can correct more than one sixth
  of the four-flip corruptions. The eight declared alternative codes tie or lose and each silently miscorrects
  2,695 to 4,480 four-flip corruptions, where the GLM''s code miscorrects none. The sender-tag stage resolves
  every one of 680,064 tied reads to the sent codeword at seven bits per carrier, where the hard word
  alone resolves none; the soft-certificate stage resolves every read of the gentle ensemble and refuses
  every read of the existing K4b ensemble, whose noise lies outside its radius. Seven of eight marks were
  met; S7 was missed on a declaration that wrongly expected one sixth on a 64-codeword sample.'
