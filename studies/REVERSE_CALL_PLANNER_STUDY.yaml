question: 'The runtime decides a query''s *kind* before it looks at the problem, and one kind means one
  solver. An older proposal in the source material inverts that: parse the string into a problem, then
  let a planner select every tool whose declared precondition the problem satisfies. Does that inversion
  buy anything the current system does not already have — and can it be made safe enough to promote out
  of a sandbox?'
