title: The reverse-call planner — a problem-driven front end, in the sandbox
verdict: 'It buys something on the declared task set and nothing at all on the project''s own evaluation
  set, and it is therefore not promoted. The safety gate holds and the utility gate does not: the planner
  answers five declared tasks the plain runtime refuses, every answer it gives is checked by a second
  tool, and no principled refusal ever reaches it — but of the twenty evaluation refusals it is offered,
  it correctly refuses all twenty, so under the declared fallback rule it would add nothing to the shipped
  system today.'
