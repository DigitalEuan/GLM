title: The document tree as a third native book, on a frozen corpus
verdict: 'No: the document tree cannot move the document rankings past parity. The literal book — the
  section''s document as a Golay word — reads the relevance relation and scores a hit at 1 on every query,
  which is a leak and not a refinement; the leak-free part of the tree, where in its document a section
  sits, changes no hit, because the two earlier books leave a tie across the top-five boundary on only
  30 of 1,506 queries, and even the leaking book in that layer gains one query. N2 is closed in the negative
  by its ceiling.'
