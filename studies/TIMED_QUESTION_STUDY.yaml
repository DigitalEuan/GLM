title: Time and the question — resolving a tie by information that comes later
verdict: 'The intuition holds where it can be measured. Held open as a tie, a refusal becomes a question:
  time resolves the Golay fork when later steps report sure coordinates (all 768 forks, to the transmitted
  word, after 8.71 reports on average), and asking resolves it faster — the GLM''s own halving questions
  take 2.66 on average and never more than 3, the proved minimum. Waiting can never resolve a junction,
  because every observation of the coordinates is constant on it (proved, and 104 of 104 measured); asking
  for what the coordinates do not carry resolves all 387 junction runs with 0 wrong. A single false answer
  is undetectable without a confirming question and always caught with one. All 9 marks met.'
