title: Asking for the separating example — and the pipeline kit's late files
verdict: 'Yes to both. Of the 2,250 queries of Phase 175, the 129 refused as ambiguous were handed to
  the new ask loop with the family''s true rule replying: 127 were answered right after exactly one ask,
  0 wrong, 2 still refused. Every ask removed survivors, as `separating_strict_shrink` proves it must.
  The kit''s own suite passes unchanged (14 of 14), its demo table is reproduced exactly, and on the demo''s
  250 queries, drawn from the kit''s own task generator, `tool induce` gives 235 right and 0 wrong against
  the kit''s 149. The kit''s audit became a check the build enforces: every one of the 9,582 theorems
  of the development rests on the standard axioms only.'
