title: Passes that print a counter, long output, and the diagnosis of a refusal
verdict: 'Yes, within the declared rule, with two marks missed on how the hand-worked expectations were
  stated. All 10 battery programs came out exactly as declared, 0 wrong: K5 (as P1) halts after 60,002
  steps printing 1 to 20000, K4 (as P2) after 1,500,004 steps printing `tick` 500,000 times with a 208-byte
  claim in run form, and five more loops that print counters are answered exactly; the 8 refused programs
  of the diagnosis battery were diagnosed exactly as declared, and the closed forms predicted the next
  32 visits of all 8 shaped variables. P8''s printed text came out in the declared encoder''s segments,
  not the hand-worked ones, and P2''s whole script is over the declared 10,000 bytes because the checker
  alone is 26,819, so marks A3 and A4 are missed. Non-interference on every earlier answer and all 300
  generated programs, and the soundness control against plain runs, were met. The NRCI of a straight line
  through L12''s quadratic counter is 0.999993: a soft score would have called it a line.'
