title: Roots with no expression in radicals, through a composition
verdict: 'Yes, whenever the outer polynomial has degree five or more and one of the earlier certificates
  reaches it. A root `x` in radicals would make `h(x)`, a root of `g`, one too, and that step is proved
  in Lean, together with a fully proved instance, `x^10 - 4x^2 + 2`. All eight marks were met: the statement
  reaches the five declared compositions, including Phase 114''s silent `x^10 - x^2 - 1`, and all 120
  random irreducible compositions of the reach battery; it is given to none of 201 polynomials with solvable
  groups; and every one of 180 built compositions is decomposed exactly. Dedekind''s theorem is still
  used, not proved, wherever the outer certificate reads Frobenius elements.'
