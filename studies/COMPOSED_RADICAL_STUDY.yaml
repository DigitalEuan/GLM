question: Phase 114's certificates need a primitive Galois group, so `solve symbolically` says nothing
  about `x^10 - x^2 - 1`, whose group is not solvable but has blocks. Can the layer find such a polynomial's
  decomposition `g(h(x))` exactly, certify the outer polynomial instead, and still never certify a polynomial
  whose group is solvable?
