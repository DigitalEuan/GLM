question: Phase 114's composite-degree certificate needs a second Frobenius element, one with a power
  that is a transposition or a 3-cycle, so `solve symbolically` says nothing about a sextic whose Galois
  group is `PGL(2, 5)` or `PSL(2, 5)` acting on six points, though neither group is solvable. Can the
  layer drop the second element where the degree allows it, and still never certify a polynomial whose
  group is solvable?
