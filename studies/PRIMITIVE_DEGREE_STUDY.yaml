title: Roots with no expression in radicals, from one Frobenius element, in a degree that is not a prime
  power
verdict: 'Yes, in every degree that is not a prime power. A solvable primitive permutation group has prime-power
  degree (Galois), so in degree 6, 10, 12, 14, 15 and so on, one element of cycle type `(n - 1, 1)`, which
  already makes the group primitive, rules solvability out; both steps are proved in Lean. All eight marks
  were met: the statement reaches the three declared sextics, built as Cayley resolvents of quintics with
  groups `S5` and `A5`, and all 60 resolvents of the reach battery, none of which Phase 114''s certificate
  reaches; it is given to none of 201 polynomials with solvable groups, and it stays out of prime-power
  degree. Dedekind''s theorem is still used, not proved.'
