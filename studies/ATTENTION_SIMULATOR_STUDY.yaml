title: The attention simulator — attention from elementary operations, ported, measured
verdict: 'Yes, exactly: every elementary operation of the paper''s construction agrees with the shipped
  ground truth with zero error, the simulator `U` reproduces the paper''s own demonstrations with zero
  error on every exact stage (the paper''s float error 3.38e-06 becomes 6.4e-105 at declared depth), and
  every head count matches the paper''s tables — but the exponential is not exact and cannot be, two of
  the paper''s stated conditions are looser than the truth (the coverage bound is conservative by a factor
  of two; the hierarchy corollary silently needs a padding mask), and on the live registers raw attention
  scoring is norm-dominated and inverts at low depth, so the module stays in the sandbox: a compiled library,
  not yet a faculty.'
