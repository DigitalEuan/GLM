title: Explanations anchored in the registers
verdict: Yes for the thirty-five declared questions, with a large recognition gap on rewordings. Every
  one is read by its declared topic and answered with values read from the element register or a new nuclide
  register (AME2020 and NUBASE2020) or with an exact derivation, every causal or philosophical account
  it asks for is stated as refused EXPLANATION, three register contradictions are reported as disputed
  premises, and every answer carries a column-3 script that fails when its claim or a register row is
  altered. All ten marks were met, but only five of thirty-five held-out rewordings were read; none was
  read by a wrong topic.
