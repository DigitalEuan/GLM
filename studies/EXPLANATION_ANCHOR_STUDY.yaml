question: 'Thirty-two of the outside questions (class E of the Capability Failure Matrix, track E of `QUESTION_SET_B_STUDY.md`
  §8) ask *why*: why helium is inert, why technetium has no stable isotope, why beryllium-8 falls apart,
  why a series RLC circuit turns inductive above resonance, why material implication is paradoxical. Three
  more (29, 39 and 96) were refused by Phase 107 as accounts rather than derivations. Can the machine
  answer the part of each that a register or an exact derivation decides, refuse the rest by name, and
  say so when a register contradicts the question''s premise?'
