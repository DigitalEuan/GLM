title: The cell guard — a ladder answer certified to be the nearest carrier
verdict: Safe but nearly silent. The cell guard answers no query wrongly on any of the three sets, every
  guarded answer is the strictly nearest carrier as the Lean file proves, and the guarded ladder is order-independent;
  but it keeps only 30 of the ladder's 467 correct answers on the standard set and 12 of 435 and 12 of
  426 on the held-out and third sets, because most carriers sit outside the inscribed ball of their own
  cell. The retirement rule read on the standard and held-out sets together keeps only the five coarse
  rungs, and that ladder answers 388 of the third set's queries correctly and none wrongly, where the
  ladder Phase 123 left answers one wrongly.
