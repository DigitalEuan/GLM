title: The AST address as a retrieval key
verdict: 'Yes: the structural key finds a structurally equal site at rank 1 for every perturbed query,
  where the token overlap finds one for 343 of 467, and the new operation answers where an expression
  is computed in the live code and in the archive, with a column-3 script that re-decides every member
  of the bucket. The Phase 64 address, read as it is, is not a usable key: it changes under renaming on
  a fifth of the queries and merges 23 classes that are not structurally equal. 5 of 7 marks met; A2 missed
  by one declaration error, A4 missed as predicted by reading the code.'
