title: Adversarial replies at the `nearest` ties — what dialogue may and may not do when the informant
  is not truthful
verdict: 'No reply of any kind ever made a carrier outside the ranking''s head live, over 560 adversarial
  runs through the conversation, and Lean proves this for any replies. A consistent liar cannot be told
  from a truthful informant, and Lean proves that limit too. One defect was found and fixed: a number
  repeated from the turn before was read as an option number of the confirming question, so a confirmation
  nobody gave was recorded (10 wrong confirmations after a first false reply). A yes-or-no question is
  now answered by its words only.'
