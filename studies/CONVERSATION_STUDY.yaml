title: The turn that refers back — what the supplied conversation material was worth, and what licensing
  buys over recency
verdict: 'All eight of the supplied scripts run unmodified against the package, and two of their claims
  do not survive being re-run: the higher-order analogy adds no constraint that was satisfied, and the
  periodic table reading is a renaming of two coordinates. What holds is the thing they were built around
  and this package as it stands cannot hold: a turn that refers back to an earlier turn. Built here as
  a binding licensed by the solver, it binds 8 of 15 declared follow-ups and refuses 7, every one as declared,
  where a session with no memory of the conversation answers 0 of them; and the rule a reader would assume,
  bind to the most recent mention, differs on 3 of the 10 pronoun follow-ups it applies to — once it loses
  an answer the registers hold, and twice it gives a wrong answer confidently.'
