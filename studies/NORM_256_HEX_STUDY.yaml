title: Norm 256 and the hex colour — a rotated Leech rung, the hex-digit readings, and a hex shortcut
verdict: 'Partly. Norm 256 is filled, by the reading that keeps the first hex digit of each coordinate
  (`H16`): it answers none of the 568 queries wrongly and none of the 568 held-out queries wrongly, but
  it answers nothing the rest of the ladder cannot on the 568 and one query more on the held-out set.
  The rotated Leech rung and the nearest-hex-digit rung are retired, each for wrong answers. The hex shortcut
  held on every point checked: a point of `2C` lies on the rotated Leech rung exactly when the hex colour
  of its half lies in a 4096-colour subspace. The held-out set also shows that the ladder Phase 123 left
  is not safe on new perturbations: it answers 8 of 568 wrongly, with or without the new rung.'
