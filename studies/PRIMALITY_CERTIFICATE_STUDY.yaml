title: Primality certificates — the primality step without a ceiling
verdict: Yes. Above 10^12 a primality step now carries a certificate — a factor, a Fermat witness or a
  Pratt certificate — whose check costs a few modular exponentiations at any size and is proved sound
  in Lean; below it nothing changed. The only refusal left is a work budget on factoring, never a size
  ceiling. All 6 marks were met.
