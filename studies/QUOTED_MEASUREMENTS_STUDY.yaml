title: The answer censuses guarded by what their answers quote, and the replay gate as a step of the close
verdict: 'Yes, both. The evidence census and the result census now record, while they run, every stored
  measurement their answers open, and their digests cover those files: alter any one of them and the census
  turns stale. The close re-takes the two censuses last, in order, so a re-take earlier in the same stage
  cannot leave them stale. The replay gate is the sign-off instrument `replay`, re-run when what it reads
  has moved and signed like the others.'
