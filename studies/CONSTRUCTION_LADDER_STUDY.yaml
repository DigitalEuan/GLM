title: The construction ladder — the full escalation, generated on the fly, walked out from the middle
verdict: 'It is a partial system, and the note''s five rungs were too few: escalating across the eleven-rung
  ladder names 462 of 568 queries correctly with 0 wrong, against 327 for the five-rung ladder and 283
  for the best single rung. The six rungs that were admitted are Construction rungs: Construction `A`
  over the trivial code is `2ℤ²⁴` and over the even-weight code is `D₂₄`, so the lattices that fill the
  note''s long step are Construction rungs too, and the scaling `L ↦ 2L` generates them. No single rung
  is best at more than one perturbation, and the escalation loses nothing to an oracle that is allowed
  to pick the rung after the fact: 462 is the oracle''s count too. The order of the walk changes the cost
  and not the answer — which is a theorem, `firstNamed_order_independent` — and the sweep at each length
  is a measured instance of the theorem''s hypothesis failing: the ladder stays safe to thirteen rungs
  and breaks at fifteen.'
