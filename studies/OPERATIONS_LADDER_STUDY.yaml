title: The operations ladder — an old-style machine, learnt as a language
verdict: Yes, within the declared fragment. The 97 terms of the note are the register tier by tier with
  every composition layered and grounded; all 25 machine runs, all 18 English questions and all 6 English-written
  programs came out as declared with 0 wrong answers, every refusal by its declared name; all 78 battery
  lines were said as sentences and read back exactly; and all 41 answered runs and questions carry a column-3
  Python script that passes in a fresh interpreter, while all 158 of their mutations fail. Hypothesis
  H held narrowly (185 of 242 composition edges monotone against 3/4), but the mean Geometric-Cybernetic
  tier is not monotone in the DevOps tier, so the two ladders agree on most edges and disagree on the
  coarse order.
