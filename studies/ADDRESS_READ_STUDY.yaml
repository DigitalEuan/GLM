title: The address read — a ladder carrier read by its address, under the placement guard
verdict: Yes. A new query kind, `locate`, reads a carrier off the construction ladder by its address and
  answers only under the placement guard, from a stored table that refuses to load when any of its three
  digests fails. On the four sets of Phase 129 it answers exactly what the measurement-only read answered,
  query by query (445, 402, 393 and 402 correct, 0 wrong); on a fifth set generated after the pre-registration
  it answers 402 and refuses 166 with 0 wrong, where the unguarded ladder answers 4 wrongly; every one
  of its 2,169 answers is the strictly nearest carrier by a full scan, with its margin honest and its
  origin certified; all twelve tamperings of the table are refused; and the evaluation's earlier cases
  keep their verdicts.
