title: Which pairs a stray-blind reading must conflate — lattice item 10
verdict: 'A reading of distances alone conflates two equal-size records exactly when their stray spectra
  agree, whatever the hole types: the arrivals all sit at the one covering radius and contribute only
  their count. A reading blind to the strays as well conflates every deep hole. This is proved in Lean
  with no `sorry`. On the ladder''s own ensembles, the predicted pairs equal the measured pairs at all
  four sizes: the one pair `A_1^24`/`A_2^12`, the only two stray-free holes. A conflated pair of references
  also makes the separation criterion fail at every spread, so the `L₃` rung cannot reach `ρ < 1` at any
  measured size. That is the theorem''s bearing on lattice item 6.'
