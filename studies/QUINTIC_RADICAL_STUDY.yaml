title: Past degree six, and roots with no expression in radicals
verdict: 'Yes to both. Numeric polynomials up to degree 24 are now factored by Zassenhaus''s algorithm,
  and their real roots are answered exactly. Any irreducible factor of prime degree at least 5 with exactly
  two non-real roots is now marked as having no root in radicals, by a theorem proved in Lean. The quintic
  in letters is still refused, but the refusal now names a rational point where no root is expressible
  in radicals, so no formula in radicals of the letters can exist. All seven marks were met. Two limits
  are counted: the certificate is sufficient but not necessary, and the letter search finds nothing for
  a family that never has two non-real roots.'
