question: 'The cubic radical study''s §8 left two limits on the branch layer of `solve symbolically`:
  a numeric polynomial above degree 6 was refused because its factors were not decided, and the quintic
  in letters `x^5 + p*x = q` was refused with no reason beyond its degree. Can the layer factor past degree
