title: Improper maps in `tool frame` — reflections, time reversal, and the four components of the Lorentz
  group
verdict: Declaring the three improper components of the Lorentz group as families, beside the proper orthochronous
  one, and the spatial reflection beside the rotation, turned 361 of the 720 improper queries into right
  answers where Phase 178 answered 3, with 0 wrong; every improper answer names its component and splits
  exactly into a proper map after a reflection or time reversal; and on all 1,920 queries the 361 answers
  the Phase 178 family set gives are unchanged. `LorentzImproper.lean` proves the four components exhaust
  the group and that two demonstrations never fix the component (any Lorentz map has a partner in another
  component agreeing with it on both), so the span guard's refusals stay.
