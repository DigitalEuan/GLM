title: The placement guard — the cell guard with a radius read from the carriers
verdict: Yes, on every set read. The placement guard answers no query wrongly on any of the four sets
  — the standard set, Phase 127's held-out set, Phase 128's third set and a fourth set generated after
  the pre-registration — while the unguarded ladder answers 0, 8, 1 and 2 wrongly on them; and it keeps
  445 of the ladder's 467 correct answers on the standard set and between 91 and 93 per cent on the other
  three. Every guarded answer is the strictly nearest carrier, as the Lean file proves without any hypothesis
  on the quantiser, and the guarded ladder is order-independent. The coarse-only ladder the retirement
  rule leaves is also safe on the fourth set, with 386 correct against the placement guard's 402.
