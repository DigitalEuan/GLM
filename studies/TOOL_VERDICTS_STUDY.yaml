title: Tool verdicts — a tool's yes/no answer in the planner, and the nearest fraction without a bound
verdict: Yes on all three. A tool's verdict is now a planner step; *if A, B, otherwise C* builds only
  the branch its test selects; *the first convergent of X whose denominator is above N* is unrolled into
  steps with no iteration cap, admitted because a measure proved in Lean ends it. The classical closest-fraction
  theorem is proved, and the tool now checks a Farey certificate for every bound instead of an exhaustive
  search up to 20,000. All 6 marks were met. On the fresh rewordings 12 of 16 were read and all 12 were
  right; 4 were not read and are left unread.
