title: Frame operators — Lorentz boosts in exact arithmetic, operators inferred layer by layer, and the
  anchor κ = 190 kJ/mol
verdict: 'Yes, within the declared families. The boost arithmetic held on every one of 78,161 exact checks,
  and 26 theorems in `RationalBoost.lean` prove it in general. `tool frame` answered 703 of 1,620 in-vocabulary
  queries outright and every one of the rest after a single asked example, with 0 wrong answers; outside
  the vocabulary it refused all 360, but only after an evidence guard was added between the first and
  second take. Light along one ray cannot tell a frame from a unit change, so all 270 such queries were
  refused; light along both rays can, which broke one declared mark (F4). κ is a unit: no dimensionless
  output depends on it. It is the bromine dissociation energy to within the register''s ±0.3 kJ/mol, and
  its digits are the smallest of the four precision knobs.'
