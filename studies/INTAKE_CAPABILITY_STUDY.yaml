title: The intake items absorbed where they measurably help — what the hypothesis engine, the formula
  wheels and the next-term reading add to the GLM on ARC, on Rule 30 and on reasoning across domains
verdict: Yes, with two pre-registered marks not met. With the three items wired in, the GLM answers 9
  of the 50 stored ARC tasks where it answered 2, answers Rule 30 claims, conjectures about every n, formula-law
  questions and next-term questions that it refused before, and across thirty questions in five domains
  answers 23 right where it answered 4, with 0 wrong; but the ARC tasks are a development set, not a held-out
  one, the answering path reads only 16 of the 39 Rule 30 sentences right (the bar was 20), and one of
  the 13 negative controls of the next-term battery is answered where it should be refused. The items'
  Lean was checked standalone; the owner's build has still to confirm it.
