title: Counter lassos — halting and non-termination past the budget
verdict: 'Yes, within the declared rule. All 12 battery programs and all 17 questions came out as declared
  with 0 wrong: six loops of 40,003 to 2,000,003 steps are answered *halts* with their exact step count,
  outputs, values and exit code, two loops are certified never to halt — N2, whose counter only the output
  reads, and one whose odd counter never reaches the zero it is compared with — and the four controls
  are refused. Every Phase 125 and 126 answer stands except N2 and N3, all 299 generated programs the
  earlier readings decided keep their verdicts, and the one they left undecided (206) is now certified
  never to halt. Every *halts* agrees with a plain run of up to 2,500,000 steps and no *never* halts within
  200,000; the three refused controls do halt.'
