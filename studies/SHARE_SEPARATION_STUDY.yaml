title: The separation criterion for the share-carrying rungs — lattice item 6
verdict: 'No share-carrying cell reaches the criterion: up to 30720 starts the best ratio is 2.3508, because
  the separation falls with the spread. The arrival shares approach a near-uniform profile, so holes with
  equal vertex counts converge on each other; the per-hole criterion certifies 8 of 10 holes at the joint
  rung and leaves exactly the two 28-vertex holes, E_6^4 and D_6^4. Sorting is proved non-expansive in
  L1, so the share part''s seed shift is bounded by the vertex-matched shift, and that bound holds at
  all 80 measured instances.'
