title: The protected tag — a carrier read in the answering path, and a sender tag with a code of its own
verdict: 'The GLM can now be asked about a carrier, and a sender tag protected by a code of its own absorbs
  two flipped tag bits where the seven-bit tag absorbs none. The new query kind reads a 24-bit word through
  the carried fork and the stages the request supplies information for, answers only when one candidate
  survives and refuses an open tie or a contradicted read; all nine declared questions came out as declared.
  Proved in the GLM''s Lean development: a tag absorbs as many flipped bits as the least tag weight over
  the octads allows, which is none for the seven-bit tag and two for the fifteen-bit tag, and an intact
  tag disagrees with every wrong decode on up to seven flips. Measured, both protected tags resolve all
  680,064 tied reads with up to their radius of flipped tag bits, 0 wrong, where the seven-bit tag with
  one flip answers 28,096 wrongly; on 523,204 reads with five to seven flips the decoder alone answers
  409,860 wrongly and a tag none. Six of seven marks were met; P5 was missed on a declared three-flip
  pattern that never misled radius 2.'
