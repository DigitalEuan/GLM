title: Tool values — a tool's answer handed to the planner as a number
verdict: 'The planner does now: there are ten noun-phrase patterns in nine shapes. A part the typed planner
  refuses is now read as one number a tool computes, with a selector that picks it out of the tool''s
  figures. The step goes through the same step gate as any planner step, and the chain''s column-3 script
  re-runs the tool in a fresh interpreter. Two new tools answer with a fraction rather than a term list:
  `convergent` and `best approximation`. The second is checked by trying every denominator, with no continued
  fractions, up to a bound of 20,000. All 8 marks were met. On the held-out rewordings, 10 of 12 were
  read and all 10 were right; three values on the hand-written answer sheet were wrong and are recorded
  as such.'
