title: 'The iteration lane: what a round costs, which CPUs it may use, and what can be done before a close'
verdict: 'Two thirds of it was method, not work. The machine offers eight CPUs, the working notes said
  two and advised `--jobs 2`, and the evaluation''s default was four; measured, eight cases run 7.3× faster
  at `--jobs 8` than at `--jobs 1`, and the whole evaluation takes 248 seconds at eight with the same
  237 answers. The round''s cheap lane — `corpus --check`, the touched test files, `--only KIND`, `--case`
  — costs about a minute and can carry most of a round, and the close has one correct order: every code
  and document edit, then `figures --write`, then `corpus --refresh`, then the two answer censuses last,
  then `corpus --check`.'
