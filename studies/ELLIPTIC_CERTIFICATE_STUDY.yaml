title: Elliptic-curve certificates — primes where neither `p - 1` nor `p + 1` splits
verdict: 'Yes, on the held-out set. An elliptic-curve entry, proved sound in Lean from the trivial bound
  on the number of points of a curve and found at run time by complex multiplication, certified all 6
  of the 6 held-out primes Phase 140 refused, with no wrong verdict, and moved no earlier answer. 5 of
  6 marks were met. The missed mark is a tampered certificate that was wrongly declared invalid: on the
  secp256k1 prime the search found a curve of prime order, so raising its cofactor to 2 still gives a
  valid certificate, and the checker was right to accept it.'
