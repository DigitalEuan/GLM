title: The declared majority rule — conflicting evidence, and when believing the majority is sound
verdict: 'The rule is declared and proved: split the examples into agreeing groups, each a null vector
  in the evidence space, and answer the target a strict majority of the weight states; it is never wrong
  while the honest examples hold at least half the weight and always right above half, the condition is
  tight because agreeing decoys below half carry it, a wrong answer needs decoys weighing at least the
  answer''s own group, and wherever the guard answers the rule answers the same; in measurement it recovers
  every right answer the guard gave up on honest majorities at no wrong answer, refuses where a plurality
  vote is misled by a colluding pair, but refuses as well where a plurality would have been right because
  the decoys happened to disagree.'
