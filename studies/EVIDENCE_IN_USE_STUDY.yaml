title: The evidence model in use — every answer as one result on the command line, and column 3 in the
  evaluation's gate
verdict: 'Yes. `GLM.py -q … --result` prints every evaluation answer as the ten-field result of Phase
  169 with the same status, surface, kind and answer as the census, and changes no answer; `evaluation
  --replay` replays column 3 for every case expected answered and fails on a replay that does not verify,
  by a rule proved in Lean. The measurement took five takes: the first four were moved by stored measurements
  or a corpus that were stale or older than what they described (a corpus not refreshed with the last
  round''s Lean files, a re-pin that staled a measurement, a census holding a stale answer, a refresh
  that had not read this round''s own Lean file), never by the reading.'
