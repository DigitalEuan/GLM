title: The field surface — buying the cheap instrument, and saying what it bought
verdict: 'Nine of the ten, which is exactly the number declared reachable before the run: the tenth asks
  for a comparison across two rows and needs an operation rather than a surface. The whole probe moves
  from six parsed to fifteen, and none of it is reasoning — a field surface is `table`, the weakest of
  the three faculties, and every question it moves is one whose answer the system already held.'
