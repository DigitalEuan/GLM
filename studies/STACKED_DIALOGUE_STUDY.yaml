title: Several open ties at once — a reply read against the question it answers
verdict: 'Yes. The open questions now form a stack, newest first: a second question no longer closes the
  first, a reply is read against the newest open question it fits or against the turn it names (`turn
  N: <reply>`), it closes that question only, and a question closes after five unrelated turns. Two ties
  answered one after the other, interleaved, ended exactly as each ends alone in every run, with no reply
  bound to the wrong question; a reply that fitted both was bound to the newer and named the older every
  time; no question of the evaluation set was taken for a reply. Lean proves the rule: the bound question
  is the newest the reply fits, a reply closes exactly one question, the window closes everything after
  it, and nothing the rule of Phase 172 read is read differently when the newest question fits.'
