title: Pocklington and N+1 certificates — primes whose `p - 1` will not split
verdict: Partly, and in two stages. The Pocklington certificate alone certifies `2^521 - 1` but none of
  the five primes the first held-out set left refused, so the first set's pre-declared mark failed. Those
  five all have a smooth `p + 1`, so an N+1 certificate was added and scored on a second, fresh held-out
  set, where it certified 13 of 13 primes with no wrong verdict. Both certificates are proved sound in
  Lean, and no answer Phase 139 gave moved. 6 of 7 marks were met.
