title: Register junctions — the address read over carriers that share coordinates
verdict: The junction method carries over from names to coordinates where a cell of the ladder holds one
  junction. The `locate` read now answers a set of carriers that share exact coordinates as a **junction**
  — certified strictly nearer than every other carrier, exactly the scan's least-distance set, with its
  declaration (identity or distinct) reported beside it — from a junction table kept beside its digests.
  Every Phase 143 answer is unchanged on all six sets; 193 queries it refused are now answered as junctions,
  each one holding the carrier the query came from. 13 of the 15 duplicate carriers are read; the junction
  of the zero word (Golay and hexacode) is not, because every cell that holds it also holds two carriers
  outside it, so three marks that counted it were missed.
