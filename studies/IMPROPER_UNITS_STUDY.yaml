title: Improper maps times a change of units in `tool frame` — the last improper refusal declared
verdict: Declaring the three improper components of the Lorentz group times a change of units as families,
  completed as the proper `lorentz_units` is, answered 238 of the 480 queries of four scaled improper
  families right where the Phase 179 family set answered none, with 0 wrong anywhere; each of the 238
  answers names the component and the scale and recomposes; and the 717 answers of the Phase 179 family
  set are unchanged. `LorentzUnits.lean` proves the change of units divides out, that a positive scale
  keeps the signs the component is read from, that the eight families exhaust the maps keeping the Minkowski
  form up to a positive square, and that two demonstrations still never fix the component.
