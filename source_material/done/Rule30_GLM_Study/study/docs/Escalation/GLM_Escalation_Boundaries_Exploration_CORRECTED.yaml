  - heading: 5. Complete syndrome decoding at the deep-hole boundary
    anchor: "5-complete-syndrome-decoding-at-the-deep-hole-boundary"
    body: |
      ### 5.1 The deep-hole geometry of Λ₂₄

      Kept (CLASSICAL, scale with minimal norm 4):

      * Λ₂₄ is the unique even unimodular lattice in dimension 24 with no roots;
      * it has 196,560 minimal vectors (norm 4);
      * its covering radius is √2;
      * its deep holes, the points at distance √2 from the lattice, fall into **23 types** under the
        automorphisms of Λ₂₄;
      * these 23 types correspond one-to-one to the 23 Niemeier lattices *with roots*. The type of a
        deep hole is read from the extended Dynkin diagram of its nearest lattice points (Conway–Parker–
        Sloane).

      **[Correction: the list.]** The sketch lists 22 root systems and calls them 23. **E₆⁴ is
      missing**, also from its `DeepHoleType`. The correct list is in the table below.

      The root system of a Niemeier lattice with roots is an ADE system of rank 24 whose components all
      have the same Coxeter number h. `Niemeier.lean` (FORMAL) checks the combinatorial side:

      * exactly 23 ADE multisets satisfy these conditions (`rank_cox_classification`,
        `niemeier23_valid`, `niemeier23_card`, `niemeier23_nodup`);
      * the sketch's 22 are among them, and the only one missing is E₆⁴ (`sketch22_sub`,
        `niemeier23_diff_sketch22`).

      | h | root system(s) | h | root system(s) |
      |---|---|---|---|
      | 2 | A₁²⁴ | 13 | A₁₂² |
      | 3 | A₂¹² | 14 | D₈³ |
      | 4 | A₃⁸ | 16 | A₁₅ D₉ |
      | 5 | A₄⁶ | 18 | A₁₇ E₇, D₁₀ E₇² |
      | 6 | A₅⁴ D₄, D₄⁶ | 22 | D₁₂² |
      | 7 | A₆⁴ | 25 | A₂₄ |
      | 8 | A₇² D₅² | 30 | D₁₆ E₈, E₈³ |
      | 9 | A₈³ | 46 | D₂₄ |
      | 10 | A₉² D₆, D₆⁴ | | |
      | 12 | A₁₁ D₇ E₆, **E₆⁴** | | |

      **[Correction: "plus the shallow hole corresponding to Λ₂₄ itself".]** This is wrong. Λ₂₄ has no
      roots and corresponds to no hole. Holes of Λ₂₄ that are not deep (shallow holes) are a separate,
      larger classification (CLASSICAL, not checked here). The sketch's radial figure should drop the
      grey "shallow" node and add E₆⁴.

      ### 5.2 Why nearest-vector decoding fails at ties (corrected)

      The snapping-instability problem is real. The proposed fix is not.

      **[Correction]** A fixed coset-leader table (a "complete syndrome decoder") makes the snap
      **deterministic**: the same input always gives the same output. It does **not** make it
      **stable**. No choice of leaders is continuous (`no_continuous_leader`, FORMAL). Take an
      integer-valued linear functional φ reading a lattice vector v as 1. Then
      t ↦ φ(ℓ(tv) − tv) is integer-valued and drops by 1 between t = 0 and t = 1, so it must jump.

      Jumps happen at **every** Voronoi wall, not only at deep holes. Deep holes are particular Voronoi
      vertices, where many walls meet. The sketch's sentence "the deep holes are exactly the points where
      the section is discontinuous" should read: "the section is discontinuous on the Voronoi walls; the
      deep holes are the worst of these points, where many nearest lattice points tie."

      **At the substrate**, the GLM's own Golay code shows exactly where ties occur (CERT,
      `GolayTies.lean`):

      * every 24-bit word has either exactly one codeword within distance 3, or none within distance 3
        and **exactly six** at distance 4 (`golay_decoding_dichotomy`);
      * the 4096 cosets split 1, 24, 276, 2024, 1771 by distance 0–4 (`golay_coset_census`), so the
        covering radius is 4 (`golay_covering_radius`);
      * errors of weight ≥ 5 are never decoded correctly by any nearest-codeword rule
        (`golay_heavy_error_never_decoded`).

      The right response to a tie is to **report** it. The GLM's `golay_decode.decode_complete` already
      returns all six leaders with status `ambiguous` (REPORTED).

      ### 5.3 The residue filters as syndrome selectors — refuted

      **[Correction]** The sketch defines syn_m(v) = (v mod m) + Λ^{(m)} and claims that the quotient
      ℝ²⁴/(Λ₂₄ + mℤ²⁴) is a finite group of order m²⁴ and that the five residues select deep-hole types.
      Work in Conway's integer coordinates, √8·Λ₂₄ = `LeechZ` ⊂ ℤ²⁴, built from the GLM's own Golay
      code (`LeechResidue.lean`).

      * **LeechZ + mℤ²⁴ = LeechZ whenever 8 ∣ m** (`Leech.leechZ_add_smul`, FORMAL). This covers
        m = 8, 144, 256 (`Leech.eight_dvd_sketch_moduli`). Two integer vectors that agree mod m differ
        by a lattice vector (`Leech.leechZ_sub_of_modEq`, FORMAL). So the "syndrome mod m" is the
        lattice coset itself, the **same** for 8, 144 and 256: three of the five filters are one
        filter.
      * The quotient ℝ²⁴/Λ₂₄ is a 24-dimensional **torus**, not a finite group. On integer vectors the
        index is not m²⁴ either. For m = 2 it is 2²³, because every lattice vector has all coordinates of
        the same parity (part of the definition of `LeechZ`), so the lattice reduces mod 2 to
        {0, (1,…,1)}.
      * Sanity checks that the coordinates are right (`Leech.leechZ_examples`, `Leech.leechZ_octad`,
        `decide`): 8eᵢ, (4,4,0,…), (−3,1²³) and an octad of 2s are lattice vectors; eᵢ is not.
      * Deep-hole types are invariants of the automorphism group of Λ₂₄. A coordinate residue has no
        reason to be one, and no computation supports the assignments "mod 2 ↔ A₁²⁴", "mod 4 ↔ A₂¹², A₃⁸",
        and so on.

      **What classifies deep holes**, correctly:

      * *Mathematically:* the extended Dynkin diagram of the hole's nearest lattice points. In
        summary form this is the Coxeter number h of the table above, with a further invariant needed in
        the five cases h = 6, 10, 12, 18, 30, where two root systems share h.
      * *In the shipped GLM:* `deep_holes.classify_carrier` walks to the hole, certifies its vertex set
        and reads the diagram (REPORTED).

      ### 5.4 The decoding flow (corrected)

      ```mermaid
      flowchart TD
          V["Input carrier (from ΔΣ)"] --> D["Complete decode at the current layer:<br/>list ALL nearest points"]
          D --> U{"how many?"}
          U -->|"one"| OK["status = unique<br/>commit (subject to TCT)"]
          U -->|"k ≥ 2 (tie)"| T["status = tie(k)<br/>escalate the reading (§4)"]
          U -->|"none within radius"| B["status = beyond-radius<br/>detect, do not guess"]
          T --> E{"a layer resolves?"}
          E -->|"yes"| OK
          E -->|"no (top reached)"| ST["status = stall (terminal)"]
      ```

      ### 5.5 The connection to the 23 Niemeier lattices (corrected)

      The correspondence of deep-hole types and Niemeier lattices with roots is CLASSICAL.

      **[Correction]** The sketch also claimed that "A-types are arithmetic and need mod 2, 4, 8; D-types
      need mod 144; E-types need mod 256", so that "the filters are root-system classifiers". This is
      not supported, and §5.3 shows the higher filters are blind. The classifier that works is the
      diagram, or h with a tie-break (§5.3). It is not a residue cascade.

      ### 5.6 The Lean formalisation

      The sketch's `classify_deep_hole` cascade has two defects:

      * its `DeepHoleType` lacks `E6_4`;
      * it falls back to `E8_3` whenever nothing matches, which would silently label unclassified
        inputs.

      The compiled replacements are `Niemeier.niemeier23` (the 23 types), `rank_cox_classification`,
      and `LeechResidue.lean` for the syndromes.

      **[Correction: "Conjecture (cascade consistency)".]** The conjecture is **moot**. The mod-8, 144
      and 256 syndromes are identical (§5.3), so the cascade's last three stages return the same
      information. "Consistency" holds trivially for them and they cannot distinguish types.

      ### 5.7 What this reveals about the snap (corrected)

      1. **Stability.** False as claimed. The snap is deterministic, not stable (§5.2).
      2. **Layer-awareness.** Kept, and strengthened. The snap returns (point, status, layer) with
         status ∈ {unique, tie(k), beyond-radius}.
      3. **Root-system sensitivity.** Not via residues. Via the hole's diagram, yes.

      **Improvement 3 (corrected).** "The snap is the layer selection" holds in this form: the
      layer is `escalate` applied to the predicate "the reading at this layer gives a unique answer".
      A tie is an escalation trigger, not something a table should hide.

      ---
