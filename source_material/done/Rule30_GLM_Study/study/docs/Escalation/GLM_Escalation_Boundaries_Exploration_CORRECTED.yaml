  - heading: "4. Escalation mechanics: from binary to graded"
    anchor: "4-escalation-mechanics-from-binary-to-graded"
    body: |
      The trigger is kept: escalate when two carriers are indistinguishable at L_k but their results
      under the operation are not.

      ### 4.1 Graded escalation (corrected)

      The correct statement (FORMAL, `MasterStep.lean`):

        escalate(cong, k) = the least layer j ≥ k at which `cong j` holds, if there is one.

      * `escalate_spec`: the returned layer resolves, and no layer between k and it does.
      * `escalate_eq_none_iff`: escalation fails exactly when no layer at or above k resolves.
      * `escalate_isSome_of_top`: if the top layer resolves, escalation always succeeds. A lossless top
        layer always resolves.

      Skipping layers is legitimate; it is just this minimum.

      **[Correction: the half-unit walk-through.]**

      * **mod 2:** correct, it fails. ⌊1/2⌋ mod 2 = 0 and 0 + 0 = 0, but ⌊1⌋ mod 2 = 1.
      * **mod 4:** the sketch's line is an **arithmetic error**. It mixes two readings:
        * the floor residue ⌊q⌋ mod 4 gives 0, 0 and 1, so it fails;
        * the scaled reading ⌊4q⌋ mod 4 gives 2 and 2, and ⌊4·1⌋ mod 4 = 0 = 2 + 2 mod 4, so it is
          **consistent** on this example (`scaled_four_half_consistent`, FORMAL).

        The sketch wrote "perceive₄(1) = 1", which uses the first reading on the result and the second
        on the operands.
      * **mod 8:** no floor-residue filter resolves the half-unit sum, for any m ≥ 2
        (`floorResidue_add_not_congruent`). In particular none of 2, 4, 8, 144, 256 does
        (`five_floor_filters_fail`, FORMAL). The sketch's "mini-float" is not a residue mod 8. It is a
        different, lossy reading: with 3 bits, 1/3 is not representable and sums must round.

      So on the sketch's own five-filter stack, escalation from the substrate returns **none**. In the
      shipped GLM the half-unit sum is resolved because the Rational layer reads the carrier exactly
      (the GLM's own `substrate_addition_not_congruent` / `glmRationalLayer_congruentOn`, REPORTED).

      ### 4.2 The escalation flow (corrected)

      ```mermaid
      stateDiagram-v2
          [*] --> Substrate
          Substrate --> Integer: not congruent at Substrate,\ncongruent at Integer
          Substrate --> Rational: not congruent at Substrate or Integer\n(e.g. 1/2 + 1/2)
          Integer --> Rational: not congruent at Integer
          Rational --> Rational: every operation is congruent\n(lossless) — escalation stops here
          Rational --> Griess: only to use Griess structure\n(an enrichment request, not a congruence failure)
          Griess --> Universal: enrichment request
      ```

      ### 4.3 The half-unit case study (corrected)

      Path: Substrate (fails) → Integer (fails: parity + SI7 exponents do not determine 1/2 + 1/2) →
      Rational (succeeds, lossless). Graded escalation goes straight to Rational because Rational is the
      least resolving layer.

      **[Correction to Improvement 2: "graded escalation distinguishes kinds of failure".]** The
      failure at mod 2 and the failure at mod 4 are the same failure: floor does not commute with
      addition. No residue filter removes it; only a lossless reading does.

      Also, **congruence is not monotone under refinement** (`congruent_not_monotone`, FORMAL): a
      coarse layer can be congruent where a finer one is not. So escalation cannot be a threshold search
      on a "kind" detector. Each layer must be tested on its own, which is what `escalate` does.

      ### 4.4 The Lean formalisation

      Replaced by `escalate` and its three theorems (§4.1).

      **[Correction]** The sketch's `graded_escalation_correct` (every failure escalates to a
      resolving layer above) is **false** on its own five-filter stack (`graded_escalation_claim_false`,
      FORMAL). Its correct form is `escalate_isSome_of_top`: escalation succeeds whenever the top layer
      resolves.

      ---
