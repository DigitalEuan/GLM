  - heading: 2. The Master Equation, re-examined
    anchor: "2-the-master-equation-re-examined"
    body: |
      The spec's form is

        Ψ_{n+1} = (R_gate ∘ snap_Λ₂₄[ΔΣ(x_n*)]) Ψ_n, subject to TCT ≡ VERIFIED and L_k ∈ ℚ²⁴.

      The sketch's four observations are **kept**:

      * **Composition order.** Read ΔΣ_{x*} as an update rule on the carrier. Then one tick is
        R_gate ∘ snap ∘ ΔΣ_{x*}.
      * **Layer tracking.** The layer must be an output of the step.
      * **The TCT guard.** The spec does not say what happens when TCT fails.
      * **Snap resolution.** "Nearest" is ambiguous on ties.

      One repair:

      **[Correction]** The carrier lives in ℚ²⁴, so an irrational target x* is never *held* by the
      carrier. The ΔΣ modulator produces a sequence of rational carriers whose running average tends to
      x*. "Irrational" describes the target of the process, not any state. This matters in §6.2.

      ### 2.1 An improved form (kept, with one semantic fix)

        ⟨Ψ_{n+1}, k_{n+1}⟩ = let Ψ̂ = ΔΣ_{x*}(Ψ_n); let ⟨Ψ̄, k'⟩ = snap(Ψ̂, k_n) in
                  if TCT(Ψ_n, Ψ̂, Ψ̄) then ⟨R_gate(Ψ̄), k'⟩ else ⟨Ψ_n, k_n⟩.

      Points 1, 2 and 4 of the sketch (the state is a pair; the composition is explicit; the snap is
      parameterised by the layer) are kept. This is exactly `Machine.step` in `MasterStep.lean`
      (FORMAL definitions): the structure `Machine C K` has fields `modulate`, `snap : C → K → C × K`,
      `gate` and `tct`.

      **[Correction to point 3: "TCT failure leaves the state unchanged".]** With a fixed target this
      is a **deadlock**. A rejected state is rejected on every later tick, so the run never moves again
      (`Machine.step_of_reject`, `Machine.iterate_of_reject`, FORMAL). Roll-back alone therefore
      cannot be the semantics. **Recommended (PROPOSAL):**

      * **on rejection, escalate the layer and retry;**
      * if the top layer still rejects, report a terminal **stall**.

      This turns the sketch's "stall is a meaningful event" into a terminal, reportable state.

      ### 2.2 The Lean form

      The sketch's snippet is replaced by the compiled declarations:

      * `GLM.Escalation.Machine` — the four ingredients of a tick;
      * `Machine.step` — one tick, exactly the formula of §2.1;
      * `Machine.accepts` — whether TCT accepts at a state.

      Making the layer part of the state (`C × K`) makes escalation visible in the type, as the sketch
      intended.

      ### 2.3 What the improved form reveals

      * **The trajectory is a sequence of (carrier, layer) states.** Kept.
      * **A TCT failure stalls the run.** Corrected: under roll-back it stalls **for ever**
        (`iterate_of_reject`). See §2.1.
      * **The snap is the only place the layer can change.** Kept and proved: if the snap never changes
        the layer, no tick does (`Machine.layer_preserved_of_snap`, `Machine.layer_preserved_iterate`,
        FORMAL).

      ---
