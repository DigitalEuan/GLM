  - heading: 7. Real-system correspondences
    anchor: "7-real-system-correspondences"
    body: |
      These are kept as **analogies**. Corrections of fact:

      * **7.1 Floating point.** The five IEEE 754 status flags (invalid, divide-by-zero, overflow,
        underflow, inexact) are correctly listed. Note that IEEE 754 does not "escalate" integer overflow
        to floating point; integer and floating units are separate. The analogy is best for the
        *inexact* flag, which signals "this operation did not descend exactly to this representation".
        That is precisely a congruence failure.
      * **7.2 CPU rings.** A system call goes from ring 3 directly to ring 0; it does not climb one
        ring at a time. Mainstream operating systems use only rings 0 and 3. The analogy with
        "escalate to the least layer that resolves" is therefore closer than the sketch said.
      * **7.3 OSI.** Kept as the weakest structural analogy: the layers wrap one another and do not
        refine one another.
      * **7.4 Type systems — made exact where possible.** A layer's indistinguishability is an
        equivalence relation. "op descends to the layer" means exactly that op lifts to the quotient
        (`Quotient.lift₂` / `Quotient.map₂`). `descends_iff_congruent` is the universal property of the
        quotient. The sketch's mapping "mod 144 = algebraic numbers?, mod 256 = byte-addressable?" is
        removed (§3).
      * **7.5 Database isolation.** Kept as an analogy.

      **Improvement 4/5 (corrected).** Formalise layers as quotients (setoids) and operations as maps
      that lift. That is exact. "Universes `Type_k`" is a different notion (size, not resolution) and
      should not be used for layers.

      ---
