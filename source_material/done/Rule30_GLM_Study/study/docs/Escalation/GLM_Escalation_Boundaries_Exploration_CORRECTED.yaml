  - heading: 1. Introduction — the exploratory stance
    anchor: "1-introduction-the-exploratory-stance"
    body: |
      This document is an exploration. Where it now makes a mathematical claim, the claim is checked.
      The GLM Technical Specification gives a Master Operator Equation, a five-layer hierarchy, a
      congruence predicate, and a worked example of addition breaking down at the substrate. The sketch
      correctly found three loose places in the spec: the composition order of the equation, the role of
      the side-conditions, and how `snap_Λ₂₄` resolves ties.

      The sketch's central thesis was that the "5-bit modular escapement filters" (residues mod 2, 4, 8,
      144, 256) and complete syndrome decoding at the deep holes are two views of one structure.

      **[Correction]** That thesis does not survive checking, for three reasons:

      1. The five moduli are not a refinement chain (§3).
      2. The residue filters do not resolve the sketch's own example (§4).
      3. Three of the five residue "syndromes" carry no information about the Leech lattice at all (§5).

      What does survive is the useful core:

      * **the layer as part of the state;**
      * **escalation as "the least layer that resolves";**
      * **the snap as the place where ties are detected and the layer is chosen.**

      All three are proved below in a corrected form. The "escalation boundary" is real. It is
      crossed by escalating the **reading** (what a layer perceives), not by changing a modulus.

      ---
