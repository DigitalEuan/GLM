  - heading: 8. Improvements and open questions (status after checking)
    anchor: "8-improvements-and-open-questions-status-after-checking"
    body: |
      ### 8.1 The five improvements

      | # | Improvement | Status |
      |---|---|---|
      | 1 | Two regimes of refinement | **kept, re-founded**: resolution refinement vs structural enrichment (§3.2) |
      | 2 | Graded escalation | **kept as `escalate`** (least resolving layer, FORMAL); the five-filter version is false (§4) |
      | 3 | The snap is the layer selection | **kept in corrected form**: the snap returns a status, and ties trigger `escalate` (§5.7) |
      | 4 | Stratified type system | **made exact as quotients** (§7.4) |
      | 5 | Unified master equation | **compiled** (`Machine.step`); roll-back replaced by escalate-on-reject (§2.1, §6) |

      ### 8.2 Open questions — answered or updated

      * **Cascade consistency.** Answered: moot. Three of the five syndromes are identical (§5.3).
      * **Justification of the geometric moduli (144, 256).** Answered negatively. 144 refines 8, 256
        does not refine 144, and neither refines the lossless Rational layer (§3).
      * **TCT semantics.** Answered in part: pure roll-back deadlocks (FORMAL). Escalate-on-reject with a
        terminal stall is the recommended semantics (PROPOSAL).
      * **Type-system formalisation.** Answered: quotients and lifts (§7.4).
      * **Deep-hole type as a runtime observable.** Updated: expose the snap **status**. The deep-hole
        type itself is computed by the GLM's `classify_carrier` (REPORTED).
      * **Real-system identification.** Remains analogy, except type systems / quotients (§7.4).
      * **Still open:** whether a monotone (escalate-only) snap is compatible with everything the GLM
        needs (§6.2), and how the layer arrow relates to the Rule 30 read-angle arrow. All three Rule 30
        prize problems remain **open**.

      ### 8.3 What this edition is

      This is the owner's exploration with its errors fixed. Every remaining mathematical claim is
      FORMAL, CERT, CLASSICAL (cited), REPORTED (from the GLM's own repository), or marked PROPOSAL.
      Its value is that the GLM can take back the parts that are now solid:

      * the (carrier, layer) state;
      * `escalate`, with its correctness, minimality and termination;
      * the deadlock warning;
      * the tie/status snap;
      * the arrow theorem;
      * the correct 23-type list.

      It should not take back the residue cascade, which is now refuted.
