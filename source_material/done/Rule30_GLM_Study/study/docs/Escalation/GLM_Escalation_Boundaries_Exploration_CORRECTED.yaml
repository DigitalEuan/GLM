  - heading: 3. The five layers and their modular escapements
    anchor: "3-the-five-layers-and-their-modular-escapements"
    body: |
      The spec's order is Substrate ≺ Integer ≺ Rational ≺ Griess ≺ Universal. Here L' ≺ L means
      "every distinction made by L is also made by L'" (`View.Refines`, `LayerStack.lean`).

      **[Correction]** The sketch proposed that the layers *are* the residue filters mod 2, 4, 8, 144,
      256, and that their divisibility forces the order. Both parts fail:

      * For residue views, mod m' refines mod m **iff m ∣ m'** (`residue_refines_iff`, FORMAL).
        * 2 ∣ 4 ∣ 8, so the first three are a chain.
        * 8 ∣ 144 (144 = 8·18), so mod 144 **does** refine mod 8 arithmetically
          (`eight_dvd_144`, `residue_144_refines_8`, FORMAL). The sketch said "8 ∤ 144".
        * 144 ∤ 256 (9 ∤ 256), so mod 256 does **not** refine mod 144
          (`residue_256_not_refines_144`, FORMAL). The common refinement of mod 144 and mod 256 is
          mod 2304 = lcm(144, 256) (`residue_pair_indist_iff`, `lcm_144_256`).
      * The sketch's Rational layer perceives the **identity** (lossless). A view refines the identity
        only if it is injective (`View.refines_identity_iff`), and no residue view is injective
        (`residue_not_refines_identity`, FORMAL). So no residue layer can sit above the Rational layer
        in the order.

      ### 3.1 The layer correspondence (corrected)

      The shipped GLM (`LayerChain.lean` in `glm_repo.zip`, REPORTED) assigns layers by **what each
      layer reads**. The stack is **cumulative**: each layer keeps the reading of the one below.

      | Layer | Reads (two carriers look the same when …) | Lossless? | Meaningful modulus |
      |---|---|---|---|
      | Substrate | the 24 parity bits ⌊cᵢ⌋ mod 2 agree | no | 2 (parity), exactly |
      | Integer | parity bits **and** the seven SI7 exponents agree | no | none |
      | Rational | the exact rational carriers agree | yes | none (identity) |
      | Griess | carrier **and** 2A axes agree | yes | none |
      | Universal | every lower reading agrees | yes | none |

      The substrate's error-correcting structure is the 12-bit **Golay syndrome** (4096 cosets of the
      extended Golay code), not a residue filter (§5).

      **[Correction to the table rows of the sketch]**

      * *Integer = "q mod 4", signed residue.* The sketch's mod-4 readings are inconsistent (§4.1). A
        residue of ⌊q⌋ is not "integer arithmetic". The shipped Integer layer adds the SI7 exponents to
        the parity bits instead.
      * *Rational = "mod 8 = sign + exponent + mantissa".* This contradicts "perceive = identity" in the
        same row. Three bits hold eight values, which is lossy. A mini-float is a different reading
        (§4.1).
      * *Griess = "mod 144 = 12 × 12 coordinate split from the Coxeter plane of the Monster".*
        Not supported:
        * 144 = 12·12 is a product, while a 12 + 12 split of 24 coordinates is a sum;
        * a Coxeter plane (of a Coxeter element of a reflection group) is 2-dimensional;
        * the Monster is not a reflection group, and no "12 + 12 Coxeter split" of the Griess algebra
          is known to us.

        The numbers 24 = 2·12 do appear in the Golay code (length 24, dimension 12), which the
        substrate already uses.
      * *Universal = "mod 256 = bytes".* Byte addressing is a storage format, not a perception of the
        carrier. In the shipped stack the Universal layer is the join of all lower readings.

      ### 3.2 Why this order? (corrected)

      * **Substrate ≺ Integer ≺ Rational** holds because each reading includes the previous one
        (cumulative pairs). This is *resolution* refinement: more distinctions.
      * **Rational ≺ Griess ≺ Universal** also holds by construction. These layers are already lossless,
        so they add **structure** (2A axes, the Griess product, observables), not distinctions. The GLM's
        register audit shows this: 1,040 entries resolve into 415 → 544 → 757 → 757 → 757 classes
        (REPORTED), and 757 is the number of distinct carriers.

      **Improvement 1 (corrected).** The two regimes are *resolution refinement* (Substrate → Integer
      → Rational) and *structural enrichment* (Rational → Griess → Universal). The sketch put the boundary
      in the right place, at the Rational layer, but for the wrong reason ("arithmetic vs geometric
      moduli").

      ### 3.3 The layer stack diagram (corrected)

      ```mermaid
      graph TB
          subgraph "Structural enrichment (lossless; adds operations, not distinctions)"
              U["Universal<br/>join of all readings"]
              G["Griess<br/>carrier + 2A axes"]
              R2["Rational<br/>exact carrier (identity)"]
          end
          subgraph "Resolution refinement (lossy readings)"
              R1["Integer<br/>parity bits + SI7 exponents"]
              S["Substrate<br/>24 parity bits; Golay syndrome"]
          end
          U -->|"adds structure"| G
          G -->|"adds structure"| R2
          R2 -->|"refines"| R1
          R1 -->|"refines"| S
      ```

      ### 3.4 What each layer can compute

      By the GLM's `descends_iff_congruent`, an operation descends to a layer iff it is congruent there.
      In this package, `View.Congruent` is the predicate and `View.congruent_of_injective` (FORMAL) says
      **every** operation is congruent at a lossless layer.

      | Layer | Descends | Fails |
      |---|---|---|
      | Substrate | XOR/AND on parity bits | ℚ-addition (half-unit: 1/2 + 1/2), one Rule 30 step on rows (`step_not_congruent_parity`, FORMAL) |
      | Integer | whatever is determined by parity + SI7 exponents | ℚ-addition in general |
      | Rational | every operation on ℚ²⁴ (lossless) | — |
      | Griess | every operation on ℚ²⁴, plus the Griess-layer observables | — |
      | Universal | every operation (lossless) | — |

      **[Correction]** The sketch said irrational targets need the Griess layer and that "the
      irrational is treated as a process over the 12+12 split". In fact no carrier is irrational
      (§2). A ΔΣ run tracking √2 is a rational-carrier process, so it lives at the Rational layer. The
      Griess layer adds structure, not the ability to hold irrationals.

      ### 3.5 The Lean formalisation

      Replaced by the compiled `LayerStack.lean` (FORMAL):

      * `View C` — a reading `perceive : C → V`;
      * `View.Indist`, `View.Refines`, `View.Congruent`;
      * `View.residue m` on ℤ, `floorResidue m` and `scaledResidue m` on ℚ.

      **[Correction]** The sketch's key claim was "`modulus` is the smallest m such that `perceive`
      factors through q mod m". It has no meaning for the lossless layers: the identity factors through
      no residue map. It is true only for the substrate (m = 2).

      ---
