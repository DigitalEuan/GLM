  - heading: 6. The unified master equation (corrected)
    anchor: "6-the-unified-master-equation-corrected"
    body: |2
        ⟨Ψ_{n+1}, k_{n+1}⟩ = if TCT(Ψ_n, Ψ̂, Ψ̄) then ⟨R_gate(Ψ̄), k'⟩ else REJECT(Ψ_n, k_n)

      where

      * Ψ̂ = ΔΣ_{x*}(Ψ_n);
      * ⟨Ψ̄, status, k'⟩ = snap(Ψ̂, k_n), with k' = escalate("unique at layer j", k_n);
      * REJECT = escalate-and-retry, or a terminal stall at the top layer (§2.1).

      The sketch's `classify(syn₂, syn₄, syn₈, syn₁₄₄, syn₂₅₆)` is removed (§5.3).

      ### 6.1 What the unified equation reveals (corrected)

      * **The layer is an output of the snap.** Kept. If the snap ignores the incoming layer, two
        accepted ticks from the same carrier land on the same layer (`Machine.layer_of_input`, FORMAL).
        Whether the snap *should* ignore the incoming layer is a PROPOSAL. It conflicts with the arrow
        below.
      * **"TCT failure rolls back the escalation".** Corrected: roll-back deadlocks
        (`iterate_of_reject`). Use escalate-on-reject.
      * **Filters internal to the snap.** Replaced: expose the **status** (unique / tie / beyond) as
        the diagnostic observable. This answers the sketch's own request in §8.2.

      ### 6.2 The trajectory of a computation (corrected)

      **[Correction]** The sketch's example table cannot occur:

      * the rows (√2, 0, …) and (√2, π, …) are not ℚ²⁴ carriers;
      * the deep-hole labels (A₄⁶ for (1/2, 0, …), D₁₆E₈ for √2, …) were not computed from anything;
      * a rational carrier such as (1, 0, …, 0) is generally not at a deep hole at all.

      A correct trajectory, using the shipped readings and the half-unit example:

      | Tick | Carrier | Layer | Snap status | Reason |
      |---|---|---|---|---|
      | 0 | integer carrier (1, 0, …, 0) | Substrate | unique | parity reading suffices for the requested operation |
      | 1 | half-unit operands (1/2, …) with operation + | Rational | unique | Substrate and Integer are not congruent for +; Rational is the least resolving layer |
      | 2 | ΔΣ step towards target √2 (rational carrier) | Rational | unique | the target is irrational, the carrier is not |
      | 3 | TCT rejects | Rational → Griess | — | escalate-on-reject (PROPOSAL) |
      | 4 | TCT rejects at the top layer | Universal | stall | terminal, reported |

      **The arrow (the owner's Wobble/Observer idea).** Suppose the snap only escalates. Then along
      every run the layer index is non-decreasing and, in a finite stack, eventually constant
      (`Machine.layer_monotone`, `Machine.layer_eventually_const`, FORMAL). So the layer gives the run a
      **direction** and names where it settles. This is a precise version of "which way the run is
      converging". The sketch's oscillating trajectory (up and down) gives no arrow. One must choose:

      * a **monotone snap**, which gives an arrow; or
      * a **layer as a pure function of the input**, which gives oscillation and no arrow.

      The Rule 30-level Wobble/read-angle results (`../Rule30/Wobble*.lean`, `ReadAngle.lean`,
      `Perspective.lean`) give a separate, finer direction on the space-time diagram.

      ### 6.3 The Lean formalisation

      Replaced by `Machine.step` together with `escalate`.

      **[Correction]** The sketch's `layer_for_hole_type` table was said to be "fixed by the
      root-system structure of the Niemeier lattices". It is not: it is an arbitrary assignment, and it
      omits E₆⁴.

