  - id: hypothesis_engine
    path: RequestProject/GLM/Rule30/HYPOTHESIS_ENGINE.md
    yaml: study/docs/Rule30/HYPOTHESIS_ENGINE.yaml
    title: "Round 38 — the GLM Hypothesis Engine (v5): statements, falsification, mechanisms, predictions"
    kind: document
    archive: false
    tier0:
      question: Can the owner's Hypothesis Engine produce real, checkable results on Rule 30?
      verdict: Rebuilt as v5, the engine keeps the v4 loop but changes what is guessed and how it is checked; on Rule 30 it gave a new theorem about the left side, two refuted conjectures, and a prediction that was then confirmed, all proved or certified in Lean.
      figure: v4 passed all 5 inputs with known answers, including periodic ones; the v5 prediction reached 87,000 diagonals beyond the data.
      recomputed: (hand-written argument; nothing to recompute)
    last_altered: null
    summary: This round takes the owner's **Hypothesis Engine v4** (`glm_hypothesis_engine_v4.py`, the "sorry generator") and rebuilds it so that it produces real, checkable results on Rule 30. It keeps the v4 loop — a cheap guess, a rigorous check, a refinement that reads *why* the check failed, then another guess — and changes what is guessed and how it is checked. Running it on Rule 30 gave a new theorem about the left side of the automaton, two refuted conjectures, and a prediction 87,000 diagonals beyond the data, which was then confirmed. All of these are proved or certified in Lean.
