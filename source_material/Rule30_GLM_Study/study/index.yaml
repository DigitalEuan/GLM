  - id: merge_into_glm
    path: MERGE_INTO_GLM.md
    yaml: study/docs/MERGE_INTO_GLM.yaml
    title: Merging the Rule 30 study package into the GLM repository
    kind: document
    archive: false
    tier0:
      question: Can the Rule 30 study package be merged into the GLM repository so that the GLM absorbs its Lean files, documents and tools, and what does the merge take?
      verdict: "Yes: the package uses the same Lean toolchain, the same Mathlib commit and the same library name as the GLM, its folders and declarations do not clash with the GLM's, and one command copies it in and prepares the GLM's own gates; after the merge the GLM's build, corpus and sign-off gates must be run once."
      figure: 158 Lean files with 3174 declarations, 0 declaration clashes and 1 file-name clash (avoided); the GLM's Lean folder grows from 255 to 413 files.
      recomputed: (hand-written argument; nothing to recompute)
    last_altered: null
    summary: This note is the practical side of §5 of [`RULE30_STUDY.md`](RULE30_STUDY.md). It was written against the GLM snapshot `glm_repo.zip` of 23 October 2026; the merge tool re-checks every point below against whatever checkout it is given, so it stays valid when the GLM moves on.
