  wheels:
  - name: Integer Wheel
    file: 'integer_wheel.py (data: oeis_seed.py)'
    what: 'provisions Sequence[int] -> Optional[OEIS id]: speaks an id only when the queried prefix
      is a prefix of the entry''s stored terms; exact matches preferred to longer ones, ties broken
      by the alphabetically first id; merge keeps the old entries and adds new ids'
    test_result: 'test_integer_wheel.py 102 of 102 after the in-place fix (sympy was missing; factorint_compat.py
      added); audit_soundness: 183 of 183 sound'
    overlap: 'none: no existing wheel maps integer sequences; it instantiates the provision contract
      of HypothesisEngine/NeedsWheel.lean and HypothesisEngine/Wheel.lean'
    lean_obligations:
    - 'Sound: with alpha = List Int and truth x = (the spoken entry''s stored terms start with x),
      every provision p of the wheel satisfies NeedsWheel''s Sound truth p'
    - speak returns an id only if that entry's terms start with the claim (speak_sound), and returns
      the exact-length match when one exists, else the least id among prefix matches
    - 'merge_sound: merging two sound wheels is sound; merge is idempotent on ids'
    - for every entry whose terms come from a closed-form generator in oeis_seed.py (Fibonacci, Lucas,
      primes, factorials, Catalan, Bell, ...), the stored terms equal the generator's first n values,
      checked by decide/norm_num on the finite lists
    lean:
    - HypothesisEngine/NeedsWheel
    - HypothesisEngine/Wheel
  - name: Monster Wheel
    file: 'monster_wheel.py (data: cfsg_seed.py)'
    what: the Integer Wheel plus the 26 sporadic simple groups keyed by order (a single integer) and
      by the prime-exponent vector of the order, five group-theory OEIS sequences and the sorted sporadic
      orders; find_by_order, find_by_factorization, find_by_exponent_vector; absorbs CFSG Lean files
    test_result: 'test_monster_wheel.py 110 of 110 after the fix; verify_cfsg_orders.py: all 26 orders
      equal their factorisations; monster_wheel_rule30_arc_test.py runs and reports no measurable
      improvement on Rule 30 or ARC (0)'
    overlap: a superset of the Integer Wheel; no existing wheel holds group orders
    lean_obligations:
    - each of the 26 stored orders equals the product of its stored prime powers (26 norm_num/decide
      facts, e.g. |M11| = 2^4 * 3^2 * 5 * 11 = 7920)
    - the exponent vector of each order over the primes 2..73 is the stored one
    - find_by_order n = some g only if the stored order of g is n, and the 26 orders are distinct,
      so the answer is unique
    - every Integer Wheel entry is kept (superset), so the Integer Wheel's soundness carries over
    lean:
    - HypothesisEngine/NeedsWheel
  - name: glm_wheel.py (bundle copy)
    file: glm_wheel.py
    what: the Rule 30 study's verification wheel (rings KNOWS / THINKS-TRUE / DOESN'T-KNOW) with the
      two new wheels wired in
