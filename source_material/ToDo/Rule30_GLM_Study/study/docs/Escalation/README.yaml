  - heading: "Round 47: a layered tower that is a chain"
    anchor: round-47-a-layered-tower-that-is-a-chain
    body: |
      The owner suggested a layered, p-adic-like system. The moduli `2, 4, 8, 144, 256` of the sketch do
      not refine one another (`LayerStack.lean`). The 2-adic tower `ℤ/2 ← ℤ/4 ← ℤ/8 ← ⋯` does: each layer
      is the previous one plus one cell. `../Rule30/AdicTower.lean` and `../Rule30/AdicPeriod.lean` prove
      that on this tower Problem 1 is exactly 2-adic irrationality of the centre column, and that the
      denominator of a layer relation fixes the period while its numerator bounds the preperiod.
