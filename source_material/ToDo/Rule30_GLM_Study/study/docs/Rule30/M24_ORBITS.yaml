sections:
  - heading: Tier 0 — the coarse read
    anchor: tier-0-the-coarse-read
    role: tier0
    body: |
      **Question.** What are the M₂₄ orbits of 24-bit seed patterns, and how much of that symmetry does Rule 30 keep?

      **Verdict.** Orbits of seed patterns are certified exactly by a checked enumeration tool, but only rotations commute with Rule 30, so at most 12 symmetries are shared, for every labelling.

      **Deciding figure.** At most 12 of the 244823040 elements of M₂₄ commute with the Rule 30 step on a ring of 24 cells; 2 in the GLM's own labelling.

      **Recomputed by.** (hand-written argument; nothing to recompute)

      *Tier 0 is a coarse read of what follows, never a claim of its own: the verdict and the figure above are grounded in the body below, and `tools/tier0_check.py` (or the GLM's corpus check, after a merge) fails if they stop being.*

      This is the guide to the Round 32 material. The Lean files are `MathieuOrbits.lean` (exact
      proofs), `MathieuOrbitsData.lean` and `MathieuRule30Data.lean` (finite certificates). The scripts
      are `scripts/m24_search.py`, `scripts/m24_orbit_census.c` and `scripts/m24_rule30_octads.c`,
      with their outputs. The three Lean files depend only on Mathlib, so they can be copied into the GLM
      repository on their own.
    subsections: []
    tables: []
    links: []
    code_blocks: 0
  - heading: 1. The idea, made exact
    anchor: "1-the-idea-made-exact"
    body: |
      * A **seed pattern** is a 24-bit word: a set of marked cells ("defects") among 24 cells.
      * **`M₂₄`** is the group of permutations of the 24 cells that map the GLM's Golay code (the
        12 generator rows of the lattice-shortcut layer, `golayRows`) onto itself. Membership is decided
        exactly by checking the 12 rows (`preservesCode_iff_rows`).
      * The **orbit** of a seed is the set of all patterns `pmask σ x` for `σ` in `M₂₄`: the
        symmetrically related patterns. Moving cells keeps XOR, the number of marked cells and
        membership of the code (`pmask_xor`, `weight_pmask`, `PreservesCode`).
    subsections: []
    tables: []
    links: []
    code_blocks: 0
  - heading: 2. The enumeration tool
    anchor: "2-the-enumeration-tool"
    body: |
      * `Reach gens x y`: `y` is reached from the seed `x` by applying generators one after another.
        Every reached pattern is the image of `x` under the group generated by `gens`
        (`reach_mem_closure`), and anything every generator keeps is kept along the orbit
        (`reach_invariant`).
      * `bfsCert gens x` computes a breadth-first certificate (pattern, parent, generator) and
        `certOK` checks it. **The search itself is never trusted**: `certOK_reach` proves that every
        pattern in a checked certificate is in the orbit. `orbit_eq_of_checkL` turns a check plus an
        invariant into the exact statement "the orbit is this set".
      * Two generators `gM0`, `gM1` of `M₂₄` for the GLM code are given (`gens_preserve`). Use them, or
        generators of any subgroup (for example a sextet or octad stabiliser read off the MOG), with
        any seed.
    subsections: []
    tables: []
    links: []
    code_blocks: 0
  - heading: 3. What the enumeration gives (symmetry types of defect arrangements)
    anchor: "3-what-the-enumeration-gives-symmetry-types-of-defect-arrangements"
    body: |
      Certified in Lean (`MathieuOrbitsData.lean`), each orbit proved equal to an explicit set:

      | defects | symmetry types | orbit sizes | Lean |
      |---|---|---|---|
      | 1–5 | 1 each | 24, 276, 2024, 10626, 42504 (all sets) | `orbit_weight_one` … `orbit_weight_five` |
      | 6 | 2 | 21252 inside an octad, 113344 not | `orbit_hexads_special`, `orbit_hexads_umbral` |
      | 7 | 2 | 6072 inside an octad, 340032 not | `orbit_heptads_special`, `orbit_heptads_umbral` |
      | 8 (octads) | — | 759 | `orbit_octads` |
      | 12 (dodecads) | — | 2576 | `orbit_dodecads` |

      Computed for all `2²⁴` patterns (`scripts/m24_orbit_census_output.txt`, EMP, not proved in Lean):
      49 orbits, the classical count. The smaller the orbit, the larger the stabiliser
      (`|stabiliser| = 244823040 / |orbit|`, using the classical order of `M₂₄`), so the most symmetric
      arrangement of `k` defects is the smallest orbit with `k` cells:

      | defects | most symmetric type | orbit | stabiliser order |
      |---|---|---|---|
      | 6 | 6 cells inside an octad | 21252 | 11520 |
      | 7 | 7 cells inside an octad | 6072 | 40320 |
      | 8 | an octad | 759 | 322560 |
      | 9 | an octad plus one cell | 12144 | 20160 |
      | 12 | a dodecad | 2576 | 95040 |

      ### Round 47: the census is now certified

      `MathieuCensus.lean` and `MathieuCensusOrbits.lean` certify the full census in Lean (CERT):
      `census_49` — the 49 representatives `reps49` reach all `2^24` patterns and no pattern is reached
      from two of them. For 8–11 marked cells there are 3 orbits each and for 12 cells 5, each described
      by an octad/dodecad-meeting test (`orbit_…`) with its size (`card_…`); the sizes add up to `C(24, k)`
      (`sizes_sum`). `MathieuMOG.lean` gives generators of the octad, sextet and trio stabilisers and
      their orbits on the octads (1/30/280/448, 15/384/360, 3/84/672). The stabiliser *orders* in the
      table above still rely on the classical `|M₂₄|`, which is not certified here.
