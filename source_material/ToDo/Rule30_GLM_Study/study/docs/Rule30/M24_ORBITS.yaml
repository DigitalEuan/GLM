  - heading: 4. What Rule 30 keeps of the symmetry
    anchor: "4-what-rule-30-keeps-of-the-symmetry"
    body: |
      Rule 30 on a ring of 24 cells is `ring30`. A symmetry is useful for the dynamics only if it
      commutes with the Rule 30 step; then it carries whole futures (`transport_iterate`).

      * **Only rotations commute with Rule 30** (`commutes_iff_rot`, exact proof). Reflections fail
        because Rule 30 is chiral (`reflect_not_commutes`).
      * **No labelling makes the one-cell turn an element of `M₂₄`** (`no_rot_one`): for every way of
        placing the 24 code coordinates on the ring.
      * **So at most 12 symmetries are shared**, for every labelling (`shared_card_le_twelve`), out of
        the 244823040 elements of `M₂₄`. 12 is attained by an explicit labelling `tau0`, under which the
        turns by an even number of cells are code automorphisms (`shared_card_tau0`). In the GLM's own
        labelling only 2 are shared: the identity and the half-turn by 12 cells (`shared_card_glm`).
      * **Symmetric seeds have different futures.** The 759 octads are one orbit, but after one Rule 30
        step their weights take every value from 6 to 21 (`octad_rule30_weights`), and they settle into
        cycles of three different lengths (`octad_cycles`; lengths 185040, 5448 and 102 reached by 712, 8
        and 39 octads, EMP).
      * **The exception is Wolfram's seed**: the orbit of one black cell is the 24 single cells, which
        are its rotations, so all have the same future up to rotation (`single_cell_futures`).
    subsections: []
    tables: []
    links: []
    code_blocks: 0
  - heading: 5. How to use this, and its limits
    anchor: "5-how-to-use-this-and-its-limits"
    body: |
      1. Enumerate with `M₂₄` (or a MOG subgroup) to get the symmetry types and one representative of
         each. This step is exact and complete.
      2. Before mapping representatives onto a geometry (a ring, a lattice, a diamond supercell), find
         the symmetry group `G` of that geometry and dynamics as a group of permutations of the 24 sites,
         and intersect it with the laid-out `M₂₄`. Only that intersection transports (`Shared`,
         `transport_iterate`). For the Rule 30 ring it has at most 12 elements.
      3. The same check applies to a diamond supercell. A 24-site supercell (for example three
         conventional 8-atom cubic cells) has its own site-permutation group from the space group. Only
         the elements of that group that are also code automorphisms under the chosen labelling are
         carried across. This package has no diamond geometry, so that intersection has not been
         computed.

      On the prize problems: none is affected. `M₂₄` symmetry gives no route to P1, P2 or P3 by itself,
      because the Rule 30 dynamics keeps at most 12 of its elements. On the observer `Y`: in the GLM's
      labelling the only non-trivial shared symmetry is the half-turn. Reading the ring from cell `j` or
      from the opposite cell `j + 12` gives the same code structure and the same dynamics. No other read
      position is equivalent in both senses.
    subsections: []
    tables: []
    links: []
    code_blocks: 0
